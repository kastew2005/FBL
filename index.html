<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>⚔️ Защита Базы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #gameContainer {
            position: relative;
            background: #1a2a3a;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
            max-width: 100vw;
            width: auto;
            height: auto;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1f3a4b;
            touch-action: none;
            cursor: crosshair;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            touch-action: none;
        }
        #menu-screen, #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(6px);
            pointer-events: auto;
            touch-action: auto;
            padding: 20px;
            text-align: center;
            transition: opacity 0.3s;
        }
        #gameover-screen {
            display: none;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: clamp(2.5rem, 12vw, 4rem);
            color: #ffd966;
            text-shadow: 0 0 30px #ffb347, 0 4px 0 #8b5a00;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #b0d4e8;
            font-size: clamp(1rem, 4vw, 1.4rem);
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .btn {
            pointer-events: auto;
            touch-action: manipulation;
            background: #ffb347;
            border: none;
            color: #1a1a2e;
            font-weight: 800;
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            padding: 18px 50px;
            border-radius: 60px;
            box-shadow: 0 8px 0 #a05f15, 0 10px 30px rgba(255, 180, 50, 0.3);
            transition: 0.08s linear;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 8px;
            min-width: 200px;
            border: 2px solid #ffe28c;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a05f15;
        }
        .btn-secondary {
            background: #3a5f7a;
            box-shadow: 0 8px 0 #1f3a4b, 0 10px 30px rgba(0,0,0,0.3);
            border-color: #6a9fc0;
            color: white;
        }
        .stats-mini {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 10px black;
            font-size: clamp(14px, 3.5vw, 22px);
            pointer-events: none;
            z-index: 10;
            padding: 0 5px;
        }
        .stat-item {
            background: rgba(0,0,0,0.5);
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        #build-panel {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            pointer-events: none;
            z-index: 20;
            padding: 0 10px;
            flex-wrap: wrap;
        }
        .build-btn {
            pointer-events: auto;
            touch-action: manipulation;
            background: #2c4a5e;
            border: 2px solid #6a8fa0;
            color: white;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: clamp(14px, 3vw, 18px);
            box-shadow: 0 4px 0 #14222b;
            transition: 0.05s linear;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            background: rgba(30, 50, 70, 0.8);
            min-width: 80px;
            justify-content: center;
        }
        .build-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #14222b;
        }
        .build-btn .cost {
            color: #ffd966;
        }
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #fff;
            color: white;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: auto;
            z-index: 30;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }
        @media (max-width: 500px) {
            .btn { min-width: 150px; padding: 14px 20px; }
            .build-btn { padding: 8px 12px; min-width: 60px; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- Статистика сверху -->
    <div class="stats-mini" id="statsBar">
        <span class="stat-item" id="livesDisplay">❤️ 20</span>
        <span class="stat-item" id="moneyDisplay">💰 150</span>
        <span class="stat-item" id="waveDisplay">🌊 0</span>
    </div>

    <!-- Кнопка паузы -->
    <button id="pause-btn">⏸️</button>

    <!-- Панель строительства -->
    <div id="build-panel">
        <button class="build-btn" data-type="basic">🔫 Башня <span class="cost">50💰</span></button>
        <button class="build-btn" data-type="sniper">🎯 Снайпер <span class="cost">100💰</span></button>
        <button class="build-btn" data-type="cannon">💥 Пушка <span class="cost">150💰</span></button>
    </div>

    <!-- Главное меню -->
    <div id="menu-screen">
        <h1>⚔️ БАСТИОН</h1>
        <div class="subtitle">Защити базу от волн врагов</div>
        <button class="btn" id="startGameBtn">▶️ СТАРТ</button>
        <div style="margin-top:15px; color:#8899aa; font-size:0.9rem;">🖱️ Тап по экрану — строить башню</div>
    </div>

    <!-- Экран Game Over -->
    <div id="gameover-screen">
        <h1 style="color:#ff6b6b;">💀 ПРОИГРЫШ</h1>
        <div class="subtitle" id="finalScore">Волна: 0 | Монет: 0</div>
        <button class="btn" id="restartBtn">🔄 ЗАНОВО</button>
    </div>
</div>

<script>
    (function(){
        // ---------- ОСНОВНЫЕ НАСТРОЙКИ ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // Размеры под 9:16
        let W, H;
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            W = canvas.width;
            H = canvas.height;
            ctx.scale(1,1);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ---------- АУДИО (синтез) ----------
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.enabled = true;
            }
            play(type) {
                if (!this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    gain.gain.value = 0.15;
                    const now = this.ctx.currentTime;
                    if (type === 'shoot') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now+0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now+0.08);
                        osc.start(now);
                        osc.stop(now+0.08);
                    } else if (type === 'explode') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now+0.3);
                        gain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
                        osc.start(now);
                        osc.stop(now+0.3);
                    } else if (type === 'build') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now+0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now+0.1);
                        osc.start(now);
                        osc.stop(now+0.1);
                    } else if (type === 'wave') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(500, now+0.2);
                        gain.gain.exponentialRampToValueAtTime(0.001, now+0.25);
                        osc.start(now);
                        osc.stop(now+0.25);
                    }
                } catch(e) {}
            }
        }
        const sound = new SoundFX();

        // ---------- ИГРОВОЕ СОСТОЯНИЕ ----------
        const game = {
            money: 150,
            lives: 20,
            wave: 0,
            score: 0,
            paused: false,
            gameOver: false,
            enemies: [],
            towers: [],
            projectiles: [],
            particles: [],
            enemySpawnTimer: 0,
            enemiesThisWave: 0,
            enemiesSpawned: 0,
            waveDelay: 0,
            spawnInterval: 1.2,
            enemiesPerWave: 6,
            baseX: 0,
            baseY: 0,
        };

        // Конфиги
        const TOWER_TYPES = {
            basic: { range: 180, damage: 12, fireRate: 0.8, color: '#4fc3f7', cost: 50, size: 16, bulletSpeed: 300 },
            sniper: { range: 300, damage: 40, fireRate: 1.8, color: '#ffb74d', cost: 100, size: 14, bulletSpeed: 500 },
            cannon: { range: 160, damage: 30, fireRate: 1.2, color: '#ff6b6b', cost: 150, size: 18, bulletSpeed: 200, splash: 50 }
        };

        // Утилиты
        function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

        // Инициализация позиций
        function initGame() {
            game.baseX = W/2;
            game.baseY = H - 80;
            game.enemies = [];
            game.towers = [];
            game.projectiles = [];
            game.particles = [];
            game.money = 150;
            game.lives = 20;
            game.wave = 0;
            game.score = 0;
            game.gameOver = false;
            game.paused = false;
            game.enemySpawnTimer = 0;
            game.enemiesSpawned = 0;
            game.enemiesThisWave = 0;
            game.waveDelay = 0;
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'none';
            updateUI();
            startWave();
        }

        // Запуск волны
        function startWave() {
            game.wave++;
            game.enemiesPerWave = Math.floor(6 + game.wave * 2.5);
            game.enemiesSpawned = 0;
            game.enemiesThisWave = game.enemiesPerWave;
            game.spawnInterval = Math.max(0.4, 1.2 - game.wave * 0.04);
            sound.play('wave');
            updateUI();
        }

        // Спавн врага
        function spawnEnemy() {
            if (game.gameOver) return;
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const margin = 30;
            if (side === 0) { x = Math.random() * W; y = -margin; }
            else if (side === 1) { x = W + margin; y = Math.random() * H; }
            else if (side === 2) { x = Math.random() * W; y = H + margin; }
            else { x = -margin; y = Math.random() * H; }

            const hp = Math.floor(20 + game.wave * 8);
            const speed = 40 + game.wave * 3;
            const type = (game.wave > 3 && Math.random() < 0.2) ? 'fast' :
                         (game.wave > 6 && Math.random() < 0.25) ? 'tank' : 'normal';
            let size = 12, color = '#ff8a80', speedMul = 1, hpMul = 1;
            if (type === 'fast') { size = 10; speedMul = 1.7; hpMul = 0.6; color = '#80d8ff'; }
            else if (type === 'tank') { size = 20; speedMul = 0.6; hpMul = 2.8; color = '#b39ddb'; }

            game.enemies.push({
                x, y,
                hp: hp * hpMul,
                maxHp: hp * hpMul,
                speed: speed * speedMul,
                size: size,
                color: color,
                type: type,
                baseX: game.baseX,
                baseY: game.baseY,
                reward: Math.floor(10 + game.wave * 2)
            });
        }

        // Строительство башни
        function buildTower(type, x, y) {
            const cfg = TOWER_TYPES[type];
            if (!cfg) return false;
            if (game.money < cfg.cost) return false;
            // Проверка наложения
            for (let t of game.towers) {
                if (dist(t, {x,y}) < t.size + cfg.size + 10) return false;
            }
            game.money -= cfg.cost;
            game.towers.push({
                x, y,
                type: type,
                ...cfg,
                cooldown: 0,
                angle: 0,
                size: cfg.size,
                target: null
            });
            sound.play('build');
            spawnParticles(x, y, '#ffd54f', 12);
            updateUI();
            return true;
        }

        // Частицы
        function spawnParticles(x, y, color, count=15) {
            for (let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 60 + Math.random() * 150;
                game.particles.push({
                    x, y,
                    vx: Math.cos(angle)*speed,
                    vy: Math.sin(angle)*speed,
                    life: 0.5 + Math.random() * 0.6,
                    maxLife: 0.5 + Math.random() * 0.6,
                    size: 3 + Math.random() * 6,
                    color: color
                });
            }
        }

        // Обновление UI
        function updateUI() {
            document.getElementById('livesDisplay').innerHTML = `❤️ ${game.lives}`;
            document.getElementById('moneyDisplay').innerHTML = `💰 ${game.money}`;
            document.getElementById('waveDisplay').innerHTML = `🌊 ${game.wave}`;
        }

        // ---------- ЛОГИКА ----------
        function update(dt) {
            if (game.paused || game.gameOver) return;
            if (document.getElementById('menu-screen').style.display !== 'none') return;

            // Спавн врагов
            if (game.enemiesSpawned < game.enemiesThisWave) {
                game.enemySpawnTimer -= dt;
                if (game.enemySpawnTimer <= 0) {
                    spawnEnemy();
                    game.enemiesSpawned++;
                    game.enemySpawnTimer = game.spawnInterval;
                }
            } else if (game.enemies.length === 0 && game.enemiesSpawned >= game.enemiesThisWave) {
                // Следующая волна
                game.waveDelay -= dt;
                if (game.waveDelay <= 0) {
                    startWave();
                    game.waveDelay = 2;
                }
            }

            // Обновление врагов
            for (let i = game.enemies.length-1; i>=0; i--) {
                const e = game.enemies[i];
                const dx = e.baseX - e.x;
                const dy = e.baseY - e.y;
                const d = Math.hypot(dx, dy);
                if (d < 5) {
                    // Урон базе
                    game.lives -= Math.floor(e.maxHp / 8) + 1;
                    sound.play('explode');
                    spawnParticles(e.x, e.y, '#ff1744', 25);
                    game.enemies.splice(i, 1);
                    if (game.lives <= 0) { game.lives = 0; gameOver(); }
                    updateUI();
                    continue;
                }
                const move = e.speed * dt;
                e.x += (dx/d) * move;
                e.y += (dy/d) * move;

                // Анимация врага
                e.angle = Math.atan2(dy, dx);
            }

            // Обновление башен
            for (let t of game.towers) {
                t.cooldown -= dt;
                // Поиск цели
                let closest = null;
                let minDist = Infinity;
                for (let e of game.enemies) {
                    const d = dist(t, e);
                    if (d < t.range && d < minDist) {
                        minDist = d;
                        closest = e;
                    }
                }
                t.target = closest;
                if (closest) {
                    t.angle = Math.atan2(closest.y - t.y, closest.x - t.x);
                    if (t.cooldown <= 0) {
                        // Стрельба
                        t.cooldown = t.fireRate;
                        const proj = {
                            x: t.x,
                            y: t.y,
                            target: closest,
                            speed: t.bulletSpeed,
                            damage: t.damage,
                            color: t.color,
                            size: 5,
                            splash: t.splash || 0,
                            isSplash: t.splash > 0,
                            trail: []
                        };
                        game.projectiles.push(proj);
                        sound.play('shoot');
                        spawnParticles(t.x, t.y, t.color, 4);
                    }
                }
            }

            // Обновление снарядов
            for (let i=game.projectiles.length-1; i>=0; i--) {
                const p = game.projectiles[i];
                if (!p.target || !game.enemies.includes(p.target)) {
                    // Ищем новую цель
                    let newTarget = null;
                    let minD = Infinity;
                    for (let e of game.enemies) {
                        const d = dist(p, e);
                        if (d < minD) { minD = d; newTarget = e; }
                    }
                    p.target = newTarget;
                    if (!newTarget) { game.projectiles.splice(i,1); continue; }
                }
                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const d = Math.hypot(dx, dy);
                if (d < 8) {
                    // Попадание
                    const dmg = p.damage;
                    p.target.hp -= dmg;
                    spawnParticles(p.target.x, p.target.y, '#ffab00', 10);
                    if (p.isSplash) {
                        // Урон по площади
                        for (let e of game.enemies) {
                            if (e !== p.target && dist(e, p.target) < p.splash) {
                                e.hp -= dmg * 0.5;
                            }
                        }
                        sound.play('explode');
                    }
                    if (p.target.hp <= 0) {
                        // Убийство
                        game.money += p.target.reward;
                        spawnParticles(p.target.x, p.target.y, '#ff6f00', 20);
                        game.score += 10;
                        const idx = game.enemies.indexOf(p.target);
                        if (idx !== -1) game.enemies.splice(idx, 1);
                        updateUI();
                    }
                    game.projectiles.splice(i,1);
                    continue;
                }
                const move = p.speed * dt;
                p.x += (dx/d) * move;
                p.y += (dy/d) * move;
                p.trail.push({x:p.x, y:p.y, life:0.2});
                if (p.trail.length > 6) p.trail.shift();
            }

            // Обновление частиц
            for (let i=game.particles.length-1; i>=0; i--) {
                const p = game.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                p.vx *= 0.98;
                p.vy *= 0.98;
                if (p.life <= 0) game.particles.splice(i,1);
            }

            updateUI();
        }

        // Game Over
        function gameOver() {
            game.gameOver = true;
            document.getElementById('finalScore').innerHTML = `Волна: ${game.wave} | Монет: ${game.money}`;
            document.getElementById('gameover-screen').style.display = 'flex';
            sound.play('explode');
        }

        // ---------- ОТРИСОВКА ----------
        function draw() {
            ctx.clearRect(0,0,W,H);
            // Фон
            const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
            grad.addColorStop(0,'#1f3a4b');
            grad.addColorStop(1,'#0a1520');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,H);

            // Сетка
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let i=0; i<W; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i,0);
                ctx.lineTo(i,H);
                ctx.stroke();
            }
            for (let i=0; i<H; i+=40) {
                ctx.beginPath();
                ctx.moveTo(0,i);
                ctx.lineTo(W,i);
                ctx.stroke();
            }

            // База
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 40;
            ctx.fillStyle = '#00bcd4';
            ctx.beginPath();
            ctx.arc(game.baseX, game.baseY, 28, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏠', game.baseX, game.baseY-2);

            // Башни
            for (let t of game.towers) {
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
                ctx.stroke();

                // Ствол
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                ctx.fillStyle = '#fff';
                ctx.fillRect(4, -3, t.size+6, 6);
                ctx.restore();

                // Тип
                ctx.fillStyle = 'white';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t.type[0].toUpperCase(), t.x, t.y+2);
            }

            // Враги
            for (let e of game.enemies) {
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 25;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // HP бар
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(e.x-20, e.y-e.size-12, 40, 6);
                ctx.fillStyle = hpPct > 0.5 ? '#4caf50' : '#ff5252';
                ctx.fillRect(e.x-20, e.y-e.size-12, 40 * hpPct, 6);
                // Глаза
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.x-4, e.y-3, 3, 0, Math.PI*2);
                ctx.arc(e.x+4, e.y-3, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(e.x-5, e.y-2, 1.5, 0, Math.PI*2);
                ctx.arc(e.x+3, e.y-2, 1.5, 0, Math.PI*2);
                ctx.fill();
            }

            // Снаряды
            for (let p of game.projectiles) {
                // Трейл
                for (let t of p.trail) {
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, p.size*0.4, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Частицы
            for (let p of game.particles) {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life/p.maxLife), 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Инфо о волне
            if (game.enemiesSpawned < game.enemiesThisWave) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Волна ${game.wave} · Врагов: ${game.enemiesThisWave - game.enemiesSpawned}`, W/2, 50);
            } else if (game.enemies.length === 0 && game.enemiesSpawned >= game.enemiesThisWave) {
                ctx.fillStyle = '#ffd966';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✅ ВОЛНА ОТБИТА!', W/2, 50);
            }
        }

        // ---------- ЦИКЛ ИГРЫ ----------
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- УПРАВЛЕНИЕ ----------
        // Строительство по тапу
        function handleTap(e) {
            e.preventDefault();
            if (game.paused || game.gameOver) return;
            if (document.getElementById('menu-screen').style.display !== 'none') return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            // Выбор башни из активной кнопки (по умолчанию basic)
            const activeBtn = document.querySelector('.build-btn.active');
            const type = activeBtn ? activeBtn.dataset.type : 'basic';
            buildTower(type, x, y);
        }

        // Обработка кнопок строительства
        document.querySelectorAll('.build-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sound.play('build');
            });
            btn.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sound.play('build');
            }, {passive: true});
        });
        // По умолчанию активна первая
        document.querySelector('.build-btn').classList.add('active');

        // События ввода
        canvas.addEventListener('click', handleTap);
        canvas.addEventListener('touchstart', handleTap, {passive: false});

        // Кнопка паузы
        document.getElementById('pause-btn').addEventListener('click', () => {
            game.paused = !game.paused;
            document.getElementById('pause-btn').textContent = game.paused ? '▶️' : '⏸️';
        });

        // Главное меню
        document.getElementById('startGameBtn').addEventListener('click', () => {
            document.getElementById('menu-screen').style.display = 'none';
            initGame();
            sound.ctx.resume();
        });

        // Рестарт
        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameover-screen').style.display = 'none';
            initGame();
        });

        // Запуск
        initGame();
        requestAnimationFrame(gameLoop);

        // Предотвращение скролла
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, {passive: false});

        // Адаптация под изменение размера
        window.addEventListener('resize', () => {
            resizeCanvas();
            game.baseX = W/2;
            game.baseY = H - 80;
        });

        console.log('🛡️ Игра "Бастион" загружена! Управляй с телефона или ПК.');
    })();
</script>
</body>
</html>
