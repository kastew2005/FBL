<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival HD - Extended World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050705; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Оверлеи */
        .ui-panel {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 20, 28, 0.95);
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            z-index: 100;
            width: 90%;
            max-width: 420px;
        }

        .ui-header { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #37474f; padding-bottom: 10px; color: #ffb74d; }
        .item-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.06); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-action { background: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; }
        .btn-close { margin-top: 15px; width: 100%; background: #d32f2f; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; }

        /* Главное меню */
        #mainMenu {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a237e 0%, #050705 100%); z-index: 200;
        }
        #mainMenu h1 { font-size: 42px; color: #ff5722; text-shadow: 0 0 20px rgba(255,87,34,0.8); margin-bottom: 10px; text-align: center; }
        #mainMenu p { color: #b0bec5; margin-bottom: 30px; }
        .menu-btn {
            width: 240px; padding: 16px; margin: 10px; background: #263238; color: #fff;
            border: 2px solid #ff9800; border-radius: 30px; font-size: 18px; font-weight: bold; text-align: center;
        }

        /* Мобильные кнопки контроля */
        #actionBtn {
            display: none;
            position: absolute; bottom: 120px; right: 30px;
            background: rgba(255, 152, 0, 0.9); color: #fff;
            border: 2px solid #fff; padding: 16px 24px; border-radius: 50px;
            font-weight: bold; font-size: 16px; z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #invBtn {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #ff9800;
            padding: 10px 18px; border-radius: 20px; font-weight: bold; z-index: 50;
        }
    </style>
</head>
<body>

    <div id="mainMenu">
        <h1>ZOMBIE SURVIVAL HD</h1>
        <p>Исследуйте город, заходите в здания и выживайте!</p>
        <div class="menu-btn" onclick="startGame()">ИГРАТЬ</div>
    </div>

    <button id="invBtn" style="display:none;" onclick="openInventory()">🎒 Инвентарь</button>
    <button id="actionBtn" onclick="triggerAction()">ОБЫСКАТЬ</button>

    <div id="lootMenu" class="ui-panel">
        <div class="ui-header">📦 Тайник</div>
        <div id="lootList" class="item-list"></div>
        <button class="btn-close" onclick="closeLootMenu()">Закрыть</button>
    </div>

    <div id="inventoryMenu" class="ui-panel">
        <div class="ui-header">🎒 Инвентарь</div>
        <div id="inventoryStats" style="margin-bottom: 10px; font-size: 14px; color: #b0bec5;"></div>
        <div id="inventoryList" class="item-list"></div>
        <button class="btn-close" onclick="closeInventory()">Закрыть</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const actionBtn = document.getElementById('actionBtn');

        const WORLD = { width: 4000, height: 4000 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Предметы
        const ITEMS = {
            pistol: { name: 'Пистолет', type: 'weapon', fireRate: 250, damage: 1.5, speed: 800, count: 1, spread: 0.05, ammoType: '9mm' },
            shotgun: { name: 'Дробовик', type: 'weapon', fireRate: 750, damage: 1.2, speed: 700, count: 6, spread: 0.35, ammoType: '12cal' },
            rifle: { name: 'Автомат', type: 'weapon', fireRate: 110, damage: 1.1, speed: 900, count: 1, spread: 0.1, ammoType: '5.56mm' },
            medkit: { name: 'Аптечка (+50 HP)', type: 'heal', healVal: 50 },
            ammo_9mm: { name: 'Патроны 9mm (+30)', type: 'ammo', ammoKey: '9mm', count: 30 },
            ammo_12cal: { name: 'Патроны 12cal (+12)', type: 'ammo', ammoKey: '12cal', count: 12 },
            ammo_556mm: { name: 'Патроны 5.56mm (+45)', type: 'ammo', ammoKey: '5.56mm', count: 45 },
            armor: { name: 'Бронежилет', type: 'armor', armorVal: 50 }
        };

        let gameState = 'MENU';
        let score = 0;
        let lastShot = 0;
        let activeCrate = null;
        let gameTime = 0; // Для цикла дня/ночи

        const player = {
            x: WORLD.width / 2, y: WORLD.height / 2,
            radius: 14, hp: 100, maxHp: 100, armor: 0,
            speed: 200, angle: 0,
            currentWeapon: 'pistol',
            ammo: { '9mm': 90, '12cal': 24, '5.56mm': 60 },
            inventory: ['pistol', 'medkit']
        };

        const camera = { x: 0, y: 0 };
        let zombies = [];
        let bullets = [];
        let environment = { lakes: [], trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [] };

        // ДВОЙНОЙ ДЖОЙСТИК
        const moveJoystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const aimJoystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };

        // --- ГЕНЕРАЦИЯ ЗДАНИЙ РАЗНЫХ ТИПОВ ---
        function generateBuilding(x, y, w, h, type) {
            const wallThick = 14;
            const doorSize = 60;
            const doorX = x + w / 2 - doorSize / 2;

            let color = '#424242';
            let name = 'Дом';
            if (type === 'bank') { color = '#2e7d32'; name = 'Банк'; }
            else if (type === 'school') { color = '#1565c0'; name = 'Школа'; }
            else if (type === 'hospital') { color = '#c62828'; name = 'Больница'; }

            const bId = environment.buildings.length;
            environment.buildings.push({ x, y, w, h, inside: false, color, name, doorRect: { x: doorX, y: y + h - wallThick, w: doorSize, h: wallThick } });

            // Стены (Вокруг дверного проема)
            environment.walls.push({ x, y: y + h - wallThick, w: w / 2 - doorSize / 2, h: wallThick, bId });
            environment.walls.push({ x: doorX + doorSize, y: y + h - wallThick, w: w / 2 - doorSize / 2, h: wallThick, bId });
            environment.walls.push({ x, y, w, h: wallThick, bId });
            environment.walls.push({ x, y, w: wallThick, h, bId });
            environment.walls.push({ x: x + w - wallThick, y, w: wallThick, h, bId });

            // Мебель и Лут в зависимости от типа
            if (type === 'bank') {
                environment.furniture.push({ x: x + 40, y: y + 40, w: 60, h: 40, type: 'safe', bId });
                environment.crates.push({ x: x + 50, y: y + 50, w: 28, h: 28, items: ['armor', 'ammo_556mm', 'rifle'], bId });
            } else if (type === 'hospital') {
                environment.furniture.push({ x: x + 30, y: y + 30, w: 40, h: 70, type: 'bed', bId });
                environment.crates.push({ x: x + w - 60, y: y + 40, w: 28, h: 28, items: ['medkit', 'medkit', 'ammo_9mm'], bId });
            } else {
                environment.furniture.push({ x: x + w/2 - 25, y: y + h/2 - 20, w: 50, h: 40, type: 'table', bId });
                environment.crates.push({ x: x + 30, y: y + 30, w: 28, h: 28, items: ['shotgun', 'ammo_12cal'], bId });
            }
        }

        function generateMap() {
            environment = { lakes: [], trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [] };
            zombies = [];

            // 1. Озера (Непроходимые зоны)
            for (let i = 0; i < 4; i++) {
                environment.lakes.push({
                    x: Math.random() * (WORLD.width - 600) + 300,
                    y: Math.random() * (WORLD.height - 600) + 300,
                    radius: Math.random() * 100 + 120
                });
            }

            // 2. Здания
            const types = ['house', 'bank', 'school', 'hospital', 'house'];
            types.forEach((t, i) => {
                let w = t === 'school' ? 360 : 240;
                let h = t === 'school' ? 280 : 240;
                let x = 400 + (i % 3) * 1000 + Math.random() * 200;
                let y = 400 + Math.floor(i / 3) * 1200 + Math.random() * 200;
                generateBuilding(x, y, w, h, t);
            });

            // 3. Зомби
            for (let i = 0; i < 60; i++) {
                zombies.push({
                    x: Math.random() * WORLD.width,
                    y: Math.random() * WORLD.height,
                    radius: 15, hp: 4, speed: 70 + Math.random() * 40, alerted: false
                });
            }
        }

        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('invBtn').style.display = 'block';
            gameState = 'PLAYING';
            generateMap();
        }

        // --- ОБРАБОТКА КАСАНИЙ (Двойной Джойстик) ---
        window.addEventListener('touchstart', e => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-panel')) return;
            for (let touch of e.changedTouches) {
                if (touch.clientX < window.innerWidth / 2 && !moveJoystick.active) {
                    moveJoystick.active = true; moveJoystick.touchId = touch.identifier;
                    moveJoystick.baseX = touch.clientX; moveJoystick.baseY = touch.clientY;
                    moveJoystick.dx = 0; moveJoystick.dy = 0;
                } else if (touch.clientX >= window.innerWidth / 2 && !aimJoystick.active) {
                    aimJoystick.active = true; aimJoystick.touchId = touch.identifier;
                    aimJoystick.baseX = touch.clientX; aimJoystick.baseY = touch.clientY;
                    aimJoystick.dx = 0; aimJoystick.dy = 0;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoystick.touchId) {
                    let dx = touch.clientX - moveJoystick.baseX, dy = touch.clientY - moveJoystick.baseY;
                    let dist = Math.hypot(dx, dy), maxD = 50;
                    moveJoystick.dx = (dist > maxD ? (dx / dist) * maxD : dx) / maxD;
                    moveJoystick.dy = (dist > maxD ? (dy / dist) * maxD : dy) / maxD;
                }
                if (touch.identifier === aimJoystick.touchId) {
                    let dx = touch.clientX - aimJoystick.baseX, dy = touch.clientY - aimJoystick.baseY;
                    let dist = Math.hypot(dx, dy), maxD = 50;
                    aimJoystick.dx = (dist > maxD ? (dx / dist) * maxD : dx) / maxD;
                    aimJoystick.dy = (dist > maxD ? (dy / dist) * maxD : dy) / maxD;
                }
            }
        });

        const resetTouch = (id) => {
            if (id === moveJoystick.touchId) { moveJoystick.active = false; moveJoystick.dx = 0; moveJoystick.dy = 0; }
            if (id === aimJoystick.touchId) { aimJoystick.active = false; aimJoystick.dx = 0; aimJoystick.dy = 0; }
        };
        window.addEventListener('touchend', e => { for (let t of e.changedTouches) resetTouch(t.identifier); });

        // --- ДЕТЕКЦИЯ КОЛЛИЗИЙ С ВОДОЙ И СТЕНАМИ ---
        function resolveCollisions(entity) {
            // Стены
            for (let wall of environment.walls) {
                let closestX = Math.max(wall.x, Math.min(entity.x, wall.x + wall.w));
                let closestY = Math.max(wall.y, Math.min(entity.y, wall.y + wall.h));
                let distX = entity.x - closestX, distY = entity.y - closestY;
                let dist = Math.hypot(distX, distY);
                if (dist < entity.radius) {
                    let overlap = entity.radius - dist;
                    entity.x += (distX / dist || 1) * overlap;
                    entity.y += (distY / dist || 0) * overlap;
                }
            }

            // Озера (Вода)
            for (let lake of environment.lakes) {
                let dist = Math.hypot(entity.x - lake.x, entity.y - lake.y);
                if (dist < lake.radius + entity.radius) {
                    let overlap = (lake.radius + entity.radius) - dist;
                    let angle = Math.atan2(entity.y - lake.y, entity.x - lake.x);
                    entity.x += Math.cos(angle) * overlap;
                    entity.y += Math.sin(angle) * overlap;
                }
            }
        }

        function triggerAction() {
            if (activeCrate) openLootMenu(activeCrate);
        }

        function openLootMenu(crate) {
            activeCrate = crate;
            const list = document.getElementById('lootList');
            list.innerHTML = crate.items.length === 0 ? '<div style="text-align:center;">Пусто</div>' : '';
            crate.items.forEach((itemKey, idx) => {
                const item = ITEMS[itemKey];
                list.innerHTML += `<div class="item-card"><span>${item.name}</span><button class="btn-action" onclick="takeLoot(${idx})">Взять</button></div>`;
            });
            document.getElementById('lootMenu').style.display = 'block';
        }
        function closeLootMenu() { document.getElementById('lootMenu').style.display = 'none'; }

        function takeLoot(idx) {
            let key = activeCrate.items[idx];
            let item = ITEMS[key];
            if (item.type === 'ammo') player.ammo[item.ammoKey] += item.count;
            else player.inventory.push(key);
            activeCrate.items.splice(idx, 1);
            openLootMenu(activeCrate);
        }

        function openInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            document.getElementById('inventoryStats').innerHTML = `HP: ${Math.round(player.hp)} | Броня: ${player.armor}`;
            player.inventory.forEach((key) => {
                let item = ITEMS[key];
                list.innerHTML += `<div class="item-card"><span>${item.name}</span><button class="btn-action" onclick="useItem('${key}')">Применить</button></div>`;
            });
            document.getElementById('inventoryMenu').style.display = 'block';
        }
        function closeInventory() { document.getElementById('inventoryMenu').style.display = 'none'; }

        function useItem(key) {
            let item = ITEMS[key];
            if (item.type === 'weapon') player.currentWeapon = key;
            if (item.type === 'heal') { player.hp = Math.min(player.maxHp, player.hp + item.healVal); player.inventory.splice(player.inventory.indexOf(key), 1); }
            if (item.type === 'armor') { player.armor = item.armorVal; player.inventory.splice(player.inventory.indexOf(key), 1); }
            openInventory();
        }

        function shoot() {
            const wpn = ITEMS[player.currentWeapon];
            if ((player.ammo[wpn.ammoType] || 0) <= 0) return;
            player.ammo[wpn.ammoType]--;

            for (let i = 0; i < wpn.count; i++) {
                let finalAngle = player.angle + (Math.random() - 0.5) * wpn.spread;
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(finalAngle) * wpn.speed, vy: Math.sin(finalAngle) * wpn.speed,
                    damage: wpn.damage
                });
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        let lastTime = performance.now();

        function update(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = now;
            gameTime += dt * 0.05; // Смена времени суток

            if (gameState === 'PLAYING') {
                // Движение
                player.x += moveJoystick.dx * player.speed * dt;
                player.y += moveJoystick.dy * player.speed * dt;
                resolveCollisions(player);

                // Прицеливание и Стрельба
                if (aimJoystick.active) {
                    player.angle = Math.atan2(aimJoystick.dy, aimJoystick.dx);
                    const wpn = ITEMS[player.currentWeapon];
                    if (now - lastShot > wpn.fireRate) { shoot(); lastShot = now; }
                } else if (moveJoystick.active) {
                    player.angle = Math.atan2(moveJoystick.dy, moveJoystick.dx);
                }

                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                // Внутри ли здания?
                environment.buildings.forEach(b => {
                    b.inside = (player.x >= b.x && player.x <= b.x + b.w && player.y >= b.y && player.y <= b.y + b.h);
                });

                // Тайник рядом
                activeCrate = environment.crates.find(c => Math.hypot(player.x - (c.x+14), player.y - (c.y+14)) < 40);
                actionBtn.style.display = activeCrate ? 'block' : 'none';

                // Зомби
                for (let z of zombies) {
                    let d = Math.hypot(player.x - z.x, player.y - z.y);
                    if (d < 300) z.alerted = true;
                    if (z.alerted) {
                        let a = Math.atan2(player.y - z.y, player.x - z.x);
                        z.x += Math.cos(a) * z.speed * dt;
                        z.y += Math.sin(a) * z.speed * dt;
                        resolveCollisions(z);
                        if (d < player.radius + z.radius) player.hp -= 15 * dt;
                    }
                }

                // Пули
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx * dt; b.y += b.vy * dt;
                    for (let z of zombies) {
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
                            z.hp -= b.damage; z.alerted = true;
                            bullets.splice(i, 1);
                            if (z.hp <= 0) zombies.splice(zombies.indexOf(z), 1);
                            break;
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ГРАФИКА И МИНИКАРТА ---
        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1b2a1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(-camera.x, -camera.y);

            // 1. Озера
            ctx.fillStyle = '#0288d1';
            for (let l of environment.lakes) {
                ctx.beginPath(); ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 6; ctx.stroke();
            }

            // 2. Здания и Интерьер
            for (let b of environment.buildings) {
                // Пол
                ctx.fillStyle = '#37474f';
                ctx.fillRect(b.x, b.y, b.w, b.h);

                // Выделение ВХОДА (Двери)
                ctx.fillStyle = '#ffb74d';
                ctx.fillRect(b.doorRect.x, b.doorRect.y, b.doorRect.w, b.doorRect.h);

                if (b.inside) {
                    // Мебель
                    for (let f of environment.furniture.filter(i => i.bId === environment.buildings.indexOf(b))) {
                        ctx.fillStyle = '#8d6e63'; ctx.fillRect(f.x, f.y, f.w, f.h);
                    }
                    // Тайники
                    for (let c of environment.crates.filter(i => i.bId === environment.buildings.indexOf(b))) {
                        ctx.fillStyle = '#ff9800'; ctx.fillRect(c.x, c.y, c.w, c.h);
                    }
                } else {
                    // Крыша (Если снаружи)
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
                    ctx.fillText(b.name, b.x + 15, b.y + 30);
                }
            }

            // Пули
            ctx.fillStyle = '#fff566';
            for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }

            // Зомби
            for (let z of zombies) {
                ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(Math.atan2(player.y - z.y, player.x - z.x));
                ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(0, 0, z.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // Персонаж и Фонарик
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Свободный свет / Фонарик
            ctx.fillStyle = 'rgba(255, 235, 59, 0.15)';
            ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0, 0, 180, -0.4, 0.4); ctx.fill();

            ctx.fillStyle = '#2196f3'; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            ctx.restore();

            // --- МИНИКАРТА (Радар) ---
            if (gameState === 'PLAYING') {
                const mapSize = 120;
                const mapX = canvas.width - mapSize - 15;
                const mapY = 15;

                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(mapX, mapY, mapSize, mapSize);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(mapX, mapY, mapSize, mapSize);

                const scale = mapSize / WORLD.width;

                // Озера на карте
                ctx.fillStyle = '#0288d1';
                for (let l of environment.lakes) {
                    ctx.beginPath(); ctx.arc(mapX + l.x * scale, mapY + l.y * scale, l.radius * scale, 0, Math.PI * 2); ctx.fill();
                }
                // Зомби
                ctx.fillStyle = '#f44336';
                for (let z of zombies) {
                    ctx.fillRect(mapX + z.x * scale, mapY + z.y * scale, 2, 2);
                }
                // Игрок
                ctx.fillStyle = '#00e676';
                ctx.beginPath(); ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2); ctx.fill();

                ctx.restore();

                // ДЖОЙСТИКИ (Рендеринг)
                [moveJoystick, aimJoystick].forEach(j => {
                    if (j.active) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(j.baseX, j.baseY, 50, 0, Math.PI * 2); ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.beginPath(); ctx.arc(j.baseX + j.dx * 50, j.baseY + j.dy * 50, 20, 0, Math.PI * 2); ctx.fill();
                    }
                });
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
