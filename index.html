<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft PE Ultra HD</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ (LOADING SCREEN) -->
    <div id="loading-screen">
        <div class="loader-content">
            <h1 class="mc-title">ГЕНЕРАЦИЯ МИРА...</h1>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <p id="loading-tip">Совет: Алтарь заставляет вас прыгать выше!</p>
        </div>
    </div>

    <!-- КИНЕМАТОГРАФИЧНОЕ ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen">
        <div class="menu-card">
            <div class="mc-title">MINECRAFT<br><span class="subtitle">ULTRA HD EDITION</span></div>
            
            <div class="menu-options">
                <label>Режим:</label>
                <select id="game-mode">
                    <option value="survival">Выживание</option>
                    <option value="creative">Творчество</option>
                </select>

                <label>Мир:</label>
                <select id="world-type">
                    <option value="normal">Обычный (HD)</option>
                    <option value="flat">Плоский</option>
                </select>
            </div>

            <button class="mc-btn" id="start-btn">ИГРАТЬ</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН И UI -->
    <div id="game-screen">
        <div id="crosshair"></div>
        <div id="water-overlay"></div>
        <div id="hud-bottom">
            <div id="hotbar"></div>
        </div>
    </div>

    <script src="textures.js"></script>
    <script src="effects.js"></script>
    <script src="world.js"></script>
    <script src="game.js"></script>
</body>
</html>
