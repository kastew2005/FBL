<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECT: COW MEADOW — CINEMATIC 3D ANIMATION</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js & Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons for UI -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b130e;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism UI Styling */
        .glass-panel {
            background: rgba(15, 23, 18, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            transition: transform 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Vignette overlay */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 60%, rgba(5, 12, 8, 0.45) 100%);
        }

        /* Sun glow overlay */
        .sun-lens {
            position: absolute;
            top: -10%;
            right: 15%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(254, 240, 138, 0.15) 0%, rgba(254, 240, 138, 0) 70%);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between">

    <!-- Top Overlay Header -->

            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white drop-shadow-md">COW MEADOW</h1>

            <!-- Play/Pause -->
            <button id="btn-play" class="glass-btn px-4 py-2.5 rounded-xl text-white font-semibold flex items-center gap-2 text-sm">

        <!-- Camera Preset Controls -->
        <div class="glass-panel p-2 rounded-2xl flex items-center gap-2 pointer-events-auto">

                Tracking
            </button>
            <button id="cam-front" class="glass-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:text-emerald-400 transition-colors" data-cam="front">
                Front
            </button>
            <button id="cam-close" class="glass-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:text-emerald-400 transition-colors" data-cam="close">
                Close-up
            </button>
        </div>
    </footer>

    <!-- MAIN 3D LOGIC & SOUND SIMULATION ENGINE -->
    <script>
        // --- Web Audio Synthesizer Engine ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = true;
                this.initialized = false;
                this.nextStepTime = 0;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.initialized = true;

                    // Continuous Wind Sound Generator
                    this.setupWind();
                    // Ambient Bird Chirp Generator
                    this.setupBirds();
                } catch (e) {
                    console.warn("Audio Context setup failed:", e);
                }
            }

            toggleSound() {
                if (!this.initialized) this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.isMuted = !this.isMuted;
                if (this.windGain) {
                    this.windGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.15, this.ctx.currentTime, 0.2);
                }
                return !this.isMuted;
            }

            setupWind() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                // Pink noise generation for soft ambient wind
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.11;
                    b6 = white * 0.115926;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                // Lowpass filter for deep wind whistle
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                this.windGain = this.ctx.createGain();
                this.windGain.gain.value = 0; // Starts silent until toggled

                whiteNoise.connect(filter);
                filter.connect(this.windGain);
                this.windGain.connect(this.ctx.destination);
                whiteNoise.start();

                // Slow wind modulation
                setInterval(() => {
                    if (!this.isMuted && this.ctx) {
                        filter.frequency.setTargetAtTime(300 + Math.random() * 350, this.ctx.currentTime, 1.5);
                    }
                }, 2000);
            }

            playHoofStep(volume = 0.4) {
                if (this.isMuted || !this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                // Dynamic pitch for soft thud on grass terrain
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random() * 20, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);

                filter.type = 'lowpass';
                filter.frequency.value = 350;

                gain.gain.setValueAtTime(volume * 0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            setupBirds() {
                const scheduleChirp = () => {
                    if (!this.isMuted && this.ctx && Math.random() > 0.4) {
                        this.playBirdChirp();
                    }
                    setTimeout(scheduleChirp, 3000 + Math.random() * 5000);
                };
                scheduleChirp();
            }

            playBirdChirp() {
                if (this.isMuted || !this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const now = this.ctx.currentTime;

                osc.type = 'sine';
                const startFreq = 2200 + Math.random() * 800;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.linearRampToValueAtTime(startFreq + 600, now + 0.08);
                osc.frequency.linearRampToValueAtTime(startFreq - 200, now + 0.15);

                gain.gain.setValueAtTime(0.02, now);
                gain.gain.linearRampToValueAtTime(0.06, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(now + 0.17);
            }
        }

        const audio = new AudioEngine();

        // --- Global Scene Configuration ---
        const CONFIG = {
            speed: 1.0,
            isPlaying: true,
            highQuality: true,
            camMode: 'tracking' // 'tracking', 'front', 'close'
        };

        // --- Main WebGL & Three.js Setup ---
        let scene, camera, renderer, clock;
        let cowGroup, cowBody, legs = [], ears = [], tail, headGroup;
        let grassInstancedMesh, flowerInstancedMesh;
        let cloudsGroup, pollenParticles;
        let terrainMesh;

        const MEADOW_SIZE = 160;
        const GRASS_COUNT = 35000;
        const FLOWER_COUNT = 1500;

        function initScene() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Light sky blue
            scene.fog = new THREE.FogExp2(0xa0d8ef, 0.0085); // Realistic atmospheric fog

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
            updateCameraPosition();

            // 3. Renderer setup
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            } catch (e) {
                document.getElementById('webgl-error').classList.remove('hidden');
                return;
            }

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 4. Lighting Configuration
            const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.65);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.35);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 150;
            const d = 30;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Sun Lens Flare Mesh Accent
            const sunGeo = new THREE.SphereGeometry(4, 16, 16);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff9e6 });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.copy(sunLight.position).multiplyScalar(2);
            scene.add(sunMesh);

            // Hemispheric Ground Light Bounce
            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3d7033, 0.45);
            scene.add(hemiLight);

            // 5. Build Procedural Assets
            createTerrain();
            createInstancedGrass();
            createInstancedFlowers();
            createClouds();
            createPollen();
            createCow();

            // 6. Responsive Resize Handling
            window.addEventListener('resize', onWindowResize);
        }

        // --- Procedural Cow Character Generator ---
        function createCow() {
            cowGroup = new THREE.Group();
            scene.add(cowGroup);
            cowGroup.position.set(0, 1.7, 0);

            // Materials
            const whiteFurMat = new THREE.MeshStandardMaterial({
                color: 0xf5f5f5,
                roughness: 0.7,
                metalness: 0.05
            });

            const blackSpotMat = new THREE.MeshStandardMaterial({
                color: 0x18181b,
                roughness: 0.6,
                metalness: 0.05
            });

            const pinkSkinMat = new THREE.MeshStandardMaterial({
                color: 0xffb6c1,
                roughness: 0.5
            });

            const hornMat = new THREE.MeshStandardMaterial({
                color: 0xdfd3c3,
                roughness: 0.3
            });

            const hoofMat = new THREE.MeshStandardMaterial({
                color: 0x27272a,
                roughness: 0.4
            });

            const eyeMat = new THREE.MeshStandardMaterial({
                color: 0x09090b,
                roughness: 0.1
            });

            // Main Body Torso (Smooth Curved Box Geometry)
            const bodyGeo = new THREE.BoxGeometry(1.6, 1.4, 2.6, 8, 8, 8);
            // Deform vertices organically for rounded cow body shape
            const pos = bodyGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                // Belly sag
                if (y < 0) y *= 1.15;
                // Rear rounding
                if (z < -0.8) x *= 0.9;
                
                pos.setXYZ(i, x, y, z);
            }
            bodyGeo.computeVertexNormals();

            cowBody = new THREE.Mesh(bodyGeo, whiteFurMat);
            cowBody.castShadow = true;
            cowBody.receiveShadow = true;
            cowGroup.add(cowBody);

            // Procedural Spot Meshes overlay on torso
            const spot1 = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), blackSpotMat);
            spot1.scale.set(1.2, 0.8, 1.4);
            spot1.position.set(0.6, 0.3, 0.4);
            cowBody.add(spot1);

            const spot2 = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), blackSpotMat);
            spot2.scale.set(0.9, 1.1, 1.1);
            spot2.position.set(-0.65, -0.1, -0.3);
            cowBody.add(spot2);

            const spot3 = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), blackSpotMat);
            spot3.position.set(0.5, 0.4, -0.7);
            cowBody.add(spot3);

            // Udder
            const udder = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), pinkSkinMat);
            udder.position.set(0, -0.6, -0.3);
            udder.scale.set(1, 0.7, 1.2);
            cowBody.add(udder);

            // Neck & Head Assembly
            const neckGroup = new THREE.Group();
            neckGroup.position.set(0, 0.5, 1.2);
            cowBody.add(neckGroup);

            const neckGeo = new THREE.CylinderGeometry(0.5, 0.7, 0.9, 12);
            const neck = new THREE.Mesh(neckGeo, whiteFurMat);
            neck.position.set(0, 0.3, 0.2);
            neck.rotation.x = Math.PI / 4;
            neck.castShadow = true;
            neckGroup.add(neck);

            headGroup = new THREE.Group();
            headGroup.position.set(0, 0.7, 0.5);
            neckGroup.add(headGroup);

            // Head Core Geometry
            const headGeo = new THREE.BoxGeometry(0.9, 0.85, 1.0, 6, 6, 6);
            const headMesh = new THREE.Mesh(headGeo, whiteFurMat);
            headMesh.castShadow = true;
            headGroup.add(headMesh);

            // Black patch over left eye
            const headSpot = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), blackSpotMat);
            headSpot.position.set(-0.25, 0.15, 0.25);
            headGroup.add(headSpot);

            // Snout / Muzzle
            const snoutGeo = new THREE.BoxGeometry(0.75, 0.45, 0.55);
            const snout = new THREE.Mesh(snoutGeo, pinkSkinMat);
            snout.position.set(0, -0.22, 0.55);
            snout.castShadow = true;
            headGroup.add(snout);

            // Nostrils
            const nostrilGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const nostrilL = new THREE.Mesh(nostrilGeo, hoofMat);
            nostrilL.position.set(0.18, -0.2, 0.82);
            const nostrilR = nostrilL.clone();
            nostrilR.position.x = -0.18;
            headGroup.add(nostrilL);
            headGroup.add(nostrilR);

            // Expressive Eyes with Highlights
            const eyeGeo = new THREE.SphereGeometry(0.1, 12, 12);
            const pupilGeo = new THREE.SphereGeometry(0.03, 8, 8);
            const shinyMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(0.44, 0.12, 0.25);
            const shineL = new THREE.Mesh(pupilGeo, shinyMat);
            shineL.position.set(0.06, 0.04, 0.07);
            eyeL.add(shineL);
            headGroup.add(eyeL);

            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(-0.44, 0.12, 0.25);
            const shineR = new THREE.Mesh(pupilGeo, shinyMat);
            shineR.position.set(-0.06, 0.04, 0.07);
            eyeR.add(shineR);
            headGroup.add(eyeR);

            // Curved Horns
            for (let side of [-1, 1]) {
                const hornCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(side * 0.25, 0.25, -0.05),
                    new THREE.Vector3(side * 0.45, 0.45, -0.15)
                ]);
                const hornGeo = new THREE.TubeGeometry(hornCurve, 12, 0.07, 8, false);
                const horn = new THREE.Mesh(hornGeo, hornMat);
                horn.position.set(side * 0.35, 0.4, -0.1);
                horn.castShadow = true;
                headGroup.add(horn);
            }

            // Ears (Wiggling dynamic components)
            for (let side of [-1, 1]) {
                const earPivot = new THREE.Group();
                earPivot.position.set(side * 0.45, 0.25, -0.1);

                const earGeo = new THREE.ConeGeometry(0.16, 0.5, 8);
                earGeo.rotateZ(-side * Math.PI / 3);
                const ear = new THREE.Mesh(earGeo, whiteFurMat);
                ear.position.set(side * 0.2, 0, 0);
                ear.scale.set(1, 1, 0.4);
                ear.castShadow = true;

                earPivot.add(ear);
                headGroup.add(earPivot);
                ears.push(earPivot);
            }

            // Legs Construction (Front-Left, Front-Right, Back-Left, Back-Right)
            const legPositions = [
                { name: 'FL', x:  0.55, z:  0.8 },
                { name: 'FR', x: -0.55, z:  0.8 },
                { name: 'BL', x:  0.55, z: -0.8 },
                { name: 'BR', x: -0.55, z: -0.8 }
            ];

            legs = legPositions.map(pos => {
                const hipPivot = new THREE.Group();
                hipPivot.position.set(pos.x, -0.4, pos.z);
                cowBody.add(hipPivot);

                // Upper Thigh
                const thighGeo = new THREE.CylinderGeometry(0.22, 0.17, 0.7, 10);
                thighGeo.translate(0, -0.35, 0);
                const thigh = new THREE.Mesh(thighGeo, whiteFurMat);
                thigh.castShadow = true;
                hipPivot.add(thigh);

                // Knee/Knee-joint pivot
                const kneePivot = new THREE.Group();
                kneePivot.position.set(0, -0.7, 0);
                hipPivot.add(kneePivot);

                // Lower Shin
                const shinGeo = new THREE.CylinderGeometry(0.16, 0.13, 0.65, 10);
                shinGeo.translate(0, -0.3, 0);
                const shin = new THREE.Mesh(shinGeo, whiteFurMat);
                shin.castShadow = true;
                kneePivot.add(shin);

                // Hoof
                const hoofGeo = new THREE.BoxGeometry(0.24, 0.22, 0.28);
                const hoof = new THREE.Mesh(hoofGeo, hoofMat);
                hoof.position.set(0, -0.65, 0.03);
                hoof.castShadow = true;
                kneePivot.add(hoof);

                return {
                    hip: hipPivot,
                    knee: kneePivot,
                    type: pos.name
                };
            });

            // Tail Setup
            const tailPivot = new THREE.Group();
            tailPivot.position.set(0, 0.4, -1.3);
            cowBody.add(tailPivot);

            const tailCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, -0.5, -0.1),
                new THREE.Vector3(0, -1.0, 0.05)
            ]);
            const tailGeo = new THREE.TubeGeometry(tailCurve, 10, 0.04, 6, false);
            const tailMesh = new THREE.Mesh(tailGeo, whiteFurMat);
            tailPivot.add(tailMesh);

            // Tail Brush
            const brushGeo = new THREE.ConeGeometry(0.1, 0.3, 8);
            const brush = new THREE.Mesh(brushGeo, blackSpotMat);
            brush.position.set(0, -1.05, 0.08);
            brush.rotation.x = Math.PI;
            tailPivot.add(brush);

            tail = tailPivot;
        }

        // --- Rolling Terrain Generation ---
        function createTerrain() {
            const geo = new THREE.PlaneGeometry(MEADOW_SIZE, MEADOW_SIZE, 120, 120);
            geo.rotateX(-Math.PI / 2);

            // Add gentle undulating hills via vertex displacement
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const y = Math.sin(x * 0.04) * Math.cos(z * 0.04) * 2.2 + Math.sin(x * 0.01) * 3.0;
                pos.setY(i, y);
            }
            geo.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({
                color: 0x3d7428,
                roughness: 0.95,
                metalness: 0.05,
                flatShading: false
            });

            terrainMesh = new THREE.Mesh(geo, mat);
            terrainMesh.receiveShadow = true;
            terrainMesh.position.y = -1.2;
            scene.add(terrainMesh);
        }

        // --- Instanced Blades of Grass ---
        function createInstancedGrass() {
            // Blade Geometry (Single blade triangle ribbon)
            const bladeGeo = new THREE.ConeGeometry(0.08, 0.85, 3);
            bladeGeo.translate(0, 0.42, 0);

            const bladeMat = new THREE.MeshStandardMaterial({
                color: 0x4ade80,
                roughness: 0.8,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            grassInstancedMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, GRASS_COUNT);

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            const grassColors = [0x34d399, 0x4ade80, 0x22c55e, 0x15803d, 0xa3e635];

            for (let i = 0; i < GRASS_COUNT; i++) {
                // Scatter in ring/square around track
                const x = (Math.random() - 0.5) * MEADOW_SIZE;
                const z = (Math.random() - 0.5) * MEADOW_SIZE;

                // Height map lookup match
                const y = Math.sin(x * 0.04) * Math.cos(z * 0.04) * 2.2 + Math.sin(x * 0.01) * 3.0 - 1.2;

                dummy.position.set(x, y, z);
                dummy.rotation.y = Math.random() * Math.PI * 2;
                dummy.rotation.z = (Math.random() - 0.5) * 0.2;
                dummy.rotation.x = (Math.random() - 0.5) * 0.2;

                const scale = 0.6 + Math.random() * 0.8;
                dummy.scale.set(scale, scale * (0.8 + Math.random() * 0.5), scale);
                dummy.updateMatrix();

                grassInstancedMesh.setMatrixAt(i, dummy.matrix);

                // Variety of green hues
                color.setHex(grassColors[Math.floor(Math.random() * grassColors.length)]);
                grassInstancedMesh.setColorAt(i, color);
            }

            grassInstancedMesh.receiveShadow = true;
            scene.add(grassInstancedMesh);
        }

        // --- Instanced Meadow Flowers ---
        function createInstancedFlowers() {
            const flowerGeo = new THREE.DodecahedronGeometry(0.12);
            const flowerMat = new THREE.MeshStandardMaterial({ roughness: 0.5 });

            flowerInstancedMesh = new THREE.InstancedMesh(flowerGeo, flowerMat, FLOWER_COUNT);

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            const flowerPalette = [0xfacc15, 0xf43f5e, 0xa855f7, 0x38bdf8, 0xffffff];

            for (let i = 0; i < FLOWER_COUNT; i++) {
                const x = (Math.random() - 0.5) * (MEADOW_SIZE * 0.85);
                const z = (Math.random() - 0.5) * (MEADOW_SIZE * 0.85);
                const y = Math.sin(x * 0.04) * Math.cos(z * 0.04) * 2.2 + Math.sin(x * 0.01) * 3.0 - 0.5;

                dummy.position.set(x, y, z);
                const s = 0.8 + Math.random() * 0.7;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();

                flowerInstancedMesh.setMatrixAt(i, dummy.matrix);

                color.setHex(flowerPalette[Math.floor(Math.random() * flowerPalette.length)]);
                flowerInstancedMesh.setColorAt(i, color);
            }

            flowerInstancedMesh.castShadow = true;
            scene.add(flowerInstancedMesh);
        }

        // --- Procedural 3D Atmospheric Clouds ---
        function createClouds() {
            cloudsGroup = new THREE.Group();
            scene.add(cloudsGroup);

            const cloudMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.9,
                transparent: true,
                opacity: 0.85
            });

            // Build multiple fluffy volumetric cloud clusters
            for (let c = 0; c < 18; c++) {
                const singleCloud = new THREE.Group();
                const puffCount = 5 + Math.floor(Math.random() * 6);

                for (let p = 0; p < puffCount; p++) {
                    const radius = 6 + Math.random() * 8;
                    const puffGeo = new THREE.SphereGeometry(radius, 8, 8);
                    const puff = new THREE.Mesh(puffGeo, cloudMat);

                    puff.position.set(
                        (Math.random() - 0.5) * 16,
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 12
                    );
                    singleCloud.add(puff);
                }

                // Random sky distribution
                singleCloud.position.set(
                    (Math.random() - 0.5) * 240,
                    25 + Math.random() * 20,
                    (Math.random() - 0.5) * 240
                );

                cloudsGroup.add(singleCloud);
            }
        }

        // --- Floating Pollen Particle System ---
        function createPollen() {
            const count = 300;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                pos[i] = (Math.random() - 0.5) * 40;
                pos[i + 1] = Math.random() * 10;
                pos[i + 2] = (Math.random() - 0.5) * 40;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({
                color: 0xfef08a,
                size: 0.15,
                transparent: true,
                opacity: 0.75
            });

            pollenParticles = new THREE.Points(geo, mat);
            scene.add(pollenParticles);
        }

        // --- Camera Orbit & Follow Modes ---
        function updateCameraPosition() {
            if (!camera) return;

            switch (CONFIG.camMode) {
                case 'front':
                    camera.position.set(2.5, 2.2, 7.5);
                    camera.lookAt(0, 1.2, 0);
                    break;
                case 'close':
                    camera.position.set(-2.2, 1.6, 3.2);
                    camera.lookAt(0, 1.4, 0.5);
                    break;
                case 'tracking':
                default:
                    // Cinematic 3/4 Side tracking angle
                    camera.position.set(-6.5, 3.2, 6.0);
                    camera.lookAt(0, 1.1, 0);
                    break;
            }
        }

        // --- Procedural Gait & Run Cycle Mathematics ---
        let runTime = 0;
        let lastHoofStep = 0;

        function animateCow(delta) {
            if (!CONFIG.isPlaying) return;

            const speedMultiplier = CONFIG.speed;
            runTime += delta * 9.0 * speedMultiplier;

            // 1. Vertical Body Bobbing & Pitch Sway
            const bodyBob = Math.sin(runTime * 2) * 0.12;
            const bodyPitch = Math.sin(runTime * 2) * 0.05;
            const bodyRoll = Math.cos(runTime) * 0.04;

            cowBody.position.y = bodyBob;
            cowBody.rotation.x = bodyPitch;
            cowBody.rotation.z = bodyRoll;

            // 2. Synchronized Trot/Gallop Joint Angles
            legs.forEach(leg => {
                let phase = 0;
                // Diagonal leg synchronization (FL & BR, FR & BL)
                if (leg.type === 'FL' || leg.type === 'BR') phase = 0;
                else phase = Math.PI;

                const legAngle = Math.sin(runTime + phase);
                const kneeAngle = Math.max(0, Math.sin(runTime + phase + Math.PI / 4));

                // Hip rotation (forward/back leg swing)
                leg.hip.rotation.x = legAngle * 0.65;
                // Knee bending (backward joint flex)
                leg.knee.rotation.x = -kneeAngle * 0.85;

                // Hoof step sound trigger on ground contact
                if (leg.type === 'FL' && legAngle > 0.9 && (runTime - lastHoofStep > 0.35 / speedMultiplier)) {
                    audio.playHoofStep(0.35);
                    lastHoofStep = runTime;
                }
            });

            // 3. Head & Neck Reaction Motion
            if (headGroup) {
                headGroup.rotation.x = Math.sin(runTime * 2 - 0.5) * 0.08;
                headGroup.rotation.y = Math.cos(runTime) * 0.05;
            }

            // 4. Ear Wiggle Dynamics
            ears.forEach((ear, idx) => {
                ear.rotation.z = Math.sin(runTime * 3 + idx) * 0.15;
            });

            // 5. Tail Pendulum Swing
            if (tail) {
                tail.rotation.z = Math.cos(runTime * 1.5) * 0.35;
                tail.rotation.x = Math.sin(runTime * 2) * 0.15;
            }
        }

        // --- Endless Infinite Meadow Loop Effect ---
        function animateEnvironment(delta) {
            if (!CONFIG.isPlaying) return;

            const moveSpeed = delta * 6.5 * CONFIG.speed;

            // Endless grass translation
            if (grassInstancedMesh) {
                grassInstancedMesh.position.z -= moveSpeed;
                if (grassInstancedMesh.position.z < -20) {
                    grassInstancedMesh.position.z += 20;
                }
            }

            // Endless flower translation
            if (flowerInstancedMesh) {
                flowerInstancedMesh.position.z -= moveSpeed;
                if (flowerInstancedMesh.position.z < -20) {
                    flowerInstancedMesh.position.z += 20;
                }
            }

            // Endless terrain translation
            if (terrainMesh) {
                terrainMesh.position.z -= moveSpeed;
                if (terrainMesh.position.z < -20) {
                    terrainMesh.position.z += 20;
                }
            }

            // Slow Cloud drift overhead
            if (cloudsGroup) {
                cloudsGroup.position.z -= delta * 0.8;
                if (cloudsGroup.position.z < -100) cloudsGroup.position.z += 200;
            }

            // Floating Pollen particles move around
            if (pollenParticles) {
                const pos = pollenParticles.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    let y = pos.getY(i) - delta * 0.3;
                    if (y < 0) y = 10;
                    pos.setY(i, y);
                }
                pollenParticles.geometry.attributes.position.needsUpdate = true;
            }
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Run character animation & background motion
            animateCow(delta);
            animateEnvironment(delta);

            // Subtle camera sway for dynamic cinematic feel
            if (camera && CONFIG.isPlaying) {
                camera.position.y += Math.sin(clock.getElapsedTime() * 1.5) * 0.0015;
            }

            renderer.render(scene, camera);
        }

        // --- Screen Resize Handler ---
        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- User Interface & Interaction Controllers ---
        function setupUI() {
            // Lucide Icon Loader
            if (window.lucide) lucide.createIcons();

            // Play / Pause Toggle
            const btnPlay = document.getElementById('btn-play');
            const iconPause = document.getElementById('icon-pause');
            const iconPlay = document.getElementById('icon-play');
            const labelPlay = document.getElementById('label-play');

            btnPlay.addEventListener('click', () => {
                CONFIG.isPlaying = !CONFIG.isPlaying;
                if (CONFIG.isPlaying) {
                    iconPause.classList.remove('hidden');
                    iconPlay.classList.add('hidden');
                    labelPlay.textContent = 'Pause';
                } else {
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                    labelPlay.textContent = 'Play';
                }
            });

            // Speed Slider
            const sliderSpeed = document.getElementById('slider-speed');
            const valSpeed = document.getElementById('val-speed');

            sliderSpeed.addEventListener('input', (e) => {
                CONFIG.speed = parseFloat(e.target.value);
                valSpeed.textContent = CONFIG.speed.toFixed(1) + 'x';
            });

            // Audio Toggle Button
            const btnSound = document.getElementById('btn-sound');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const audioHint = document.getElementById('audio-hint');

            btnSound.addEventListener('click', () => {
                const active = audio.toggleSound();
                if (active) {
                    iconSoundOff.classList.add('hidden');
                    iconSoundOn.classList.remove('hidden');
                    audioHint.classList.add('opacity-0');
                } else {
                    iconSoundOff.classList.remove('hidden');
                    iconSoundOn.classList.add('hidden');
                }
            });

            // First User Interaction Activates Audio Context & hides audio hint overlay
            window.addEventListener('click', () => {
                if (!audio.initialized) {
                    audio.init();
                }
                setTimeout(() => {
                    audioHint.classList.add('opacity-0');
                }, 2000);
            }, { once: true });

            // Graphic Quality Mode Toggle (Antialiasing/Pixel Density switch)
            const btnQuality = document.getElementById('btn-quality');
            btnQuality.addEventListener('click', () => {
                CONFIG.highQuality = !CONFIG.highQuality;
                btnQuality.textContent = CONFIG.highQuality ? 'HIGH FX' : 'PERF FX';
                renderer.setPixelRatio(CONFIG.highQuality ? Math.min(window.devicePixelRatio, 2) : 1);
            });

            // Camera Viewport Angle Selector Buttons
            const camBtns = document.querySelectorAll('[data-cam]');
            camBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    camBtns.forEach(b => b.classList.remove('text-emerald-400'));
                    btn.classList.add('text-emerald-400');
                    CONFIG.camMode = btn.getAttribute('data-cam');
                    updateCameraPosition();
                });
            });

            // Fullscreen Toggle Button
            const btnFullscreen = document.getElementById('btn-fullscreen');
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });
        }

        // --- Application Entry Point ---
        window.onload = function() {
            initScene();
            setupUI();
            animate();
        };
    </script>
</body>
</html>
