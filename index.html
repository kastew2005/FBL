    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameOver = false;
        let score = 0;
        let lastSpawn = 0;
        let lastShot = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 16,
            hp: 100,
            maxHp: 100,
            speed: 3.5,
            angle: 0
        };

        let zombies = [];
        let bullets = [];

        // Виртуальный джойстик
        let joystick = {
            active: false,
            touchId: null,
            baseX: 0,
            baseY: 0,
            currX: 0,
            currY: 0,
            dx: 0,
            dy: 0
        };

        window.addEventListener('touchstart', (e) => {
            if (gameOver) {
                resetGame();
                return;
            }
            for (let touch of e.changedTouches) {
                if (!joystick.active) {
                    joystick.active = true;
                    joystick.touchId = touch.identifier;
                    joystick.baseX = touch.clientX;
                    joystick.baseY = touch.clientY;
                    joystick.currX = touch.clientX;
                    joystick.currY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) {
                    joystick.currX = touch.clientX;
                    joystick.currY = touch.clientY;
                    let dx = joystick.currX - joystick.baseX;
                    let dy = joystick.currY - joystick.baseY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 50;
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    joystick.dx = dx / maxDist;
                    joystick.dy = dy / maxDist;
                }
            }
        });

        function resetJoystick() {
            joystick.active = false;
            joystick.touchId = null;
            joystick.dx = 0;
            joystick.dy = 0;
        }

        window.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) resetJoystick();
            }
        });
        window.addEventListener('touchcancel', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) resetJoystick();
            }
        });

        // Управление клавиатурой для ПК-теста
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }
            zombies.push({
                x: x,
                y: y,
                radius: 14,
                hp: 3,
                speed: 1.2 + Math.random() * 0.8
            });
        }
