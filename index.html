<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Open World Survival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050705; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Размеры большого мира
        const WORLD = { width: 3200, height: 3200 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ЗВУКОВАЯ СИСТЕМА ---
        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playShoot() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.06, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, t);
                filter.frequency.exponentialRampToValueAtTime(150, t + 0.06);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start(t);
            },
            playHit() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, t);
                osc.frequency.exponentialRampToValueAtTime(30, t + 0.08);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(t); osc.stop(t + 0.08);
            }
        };

        // --- СОСТОЯНИЕ ИГРЫ ---
        let gameState = 'PLAYING';
        let score = 0;
        let lastShot = 0;

        const player = {
            x: WORLD.width / 2,
            y: WORLD.height / 2,
            radius: 16,
            hp: 100,
            maxHp: 100,
            speed: 210,
            angle: 0
        };

        const camera = { x: 0, y: 0 };

        let zombies = [];
        let bullets = [];
        let environment = { trees: [], rocks: [], buildings: [], dirtPatches: [] };

        const joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };

        // --- ГЕНЕРАЦИЯ КАРТЫ (Деревья, Камни, Здания, Зомби) ---
        function generateMap() {
            environment = { trees: [], rocks: [], buildings: [], dirtPatches: [] };
            zombies = [];

            // Пятна земли/грязи
            for (let i = 0; i < 40; i++) {
                environment.dirtPatches.push({
                    x: Math.random() * WORLD.width,
                    y: Math.random() * WORLD.height,
                    radius: Math.random() * 80 + 40
                });
            }

            // Здания
            for (let i = 0; i < 12; i++) {
                let w = Math.random() * 200 + 150;
                let h = Math.random() * 200 + 150;
                let x = Math.random() * (WORLD.width - w - 200) + 100;
                let y = Math.random() * (WORLD.height - h - 200) + 100;
                // Не спавнить в центре около игрока
                if (Math.hypot(x + w/2 - player.x, y + h/2 - player.y) > 300) {
                    environment.buildings.push({ x, y, w, h });
                }
            }

            // Камни
            for (let i = 0; i < 60; i++) {
                environment.rocks.push({
                    x: Math.random() * WORLD.width,
                    y: Math.random() * WORLD.height,
                    radius: Math.random() * 18 + 10
                });
            }

            // Деревья
            for (let i = 0; i < 120; i++) {
                environment.trees.push({
                    x: Math.random() * WORLD.width,
                    y: Math.random() * WORLD.height,
                    radius: Math.random() * 25 + 25
                });
            }

            // Спавн зомби редкими группами по всей карте
            for (let i = 0; i < 45; i++) {
                let x = Math.random() * WORLD.width;
                let y = Math.random() * WORLD.height;

                // Не спавнить слишком близко к игроку при старте
                if (Math.hypot(x - player.x, y - player.y) > 400) {
                    let isRunner = Math.random() < 0.25;
                    zombies.push({
                        x, y,
                        radius: isRunner ? 13 : 16,
                        hp: isRunner ? 2 : 4,
                        maxHp: isRunner ? 2 : 4,
                        speed: isRunner ? 130 : 75,
                        color: isRunner ? '#6a1b9a' : '#2e7d32',
                        shirtColor: isRunner ? '#4a148c' : '#1b5e20',
                        alerted: false
                    });
                }
            }
        }

        // --- ОБРАБОТКА ВВОДА ---
        function handleTouchStart(e) {
            e.preventDefault();
            Sound.init();
            if (gameState === 'GAMEOVER') { resetGame(); return; }

            for (let touch of e.changedTouches) {
                if (!joystick.active) {
                    joystick.active = true;
                    joystick.touchId = touch.identifier;
                    joystick.baseX = touch.clientX;
                    joystick.baseY = touch.clientY;
                    joystick.dx = 0; joystick.dy = 0;
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) {
                    let dx = touch.clientX - joystick.baseX;
                    let dy = touch.clientY - joystick.baseY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 50;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystick.dx = dx / maxDist;
                    joystick.dy = dy / maxDist;
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) {
                    joystick.active = false; joystick.touchId = null; joystick.dx = 0; joystick.dy = 0;
                }
            }
        }

        window.addEventListener('touchstart', handleTouchStart, { passive: false });
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('touchend', handleTouchEnd, { passive: false });

        const keys = {};
        window.addEventListener('keydown', e => { Sound.init(); keys[e.key] = true; });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // --- СТРЕЛЬБА ---
        function shoot() {
            let nearest = null;
            let minDist = 350; // Дистанция видимости/агро

            for (let z of zombies) {
                let d = Math.hypot(z.x - player.x, z.y - player.y);
                if (d < minDist) {
                    minDist = d;
                    nearest = z;
                }
            }

            if (nearest) {
                let angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                player.angle = angle;
                bullets.push({
                    x: player.x + Math.cos(angle) * 18,
                    y: player.y + Math.sin(angle) * 18,
                    vx: Math.cos(angle) * 800,
                    vy: Math.sin(angle) * 800
                });
                Sound.playShoot();

                // Агрим ближайших зомби на звук выстрела
                for (let z of zombies) {
                    if (Math.hypot(z.x - player.x, z.y - player.y) < 500) {
                        z.alerted = true;
                    }
                }
            }
        }

        function resetGame() {
            player.x = WORLD.width / 2;
            player.y = WORLD.height / 2;
            player.hp = player.maxHp;
            score = 0;
            gameState = 'PLAYING';
            generateMap();
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        let lastTime = performance.now();

        function update(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = now;

            if (gameState === 'PLAYING') {
                // Движение игрока
                let moveX = joystick.dx;
                let moveY = joystick.dy;

                if (keys['w'] || keys['W'] || keys['ArrowUp']) moveY = -1;
                if (keys['s'] || keys['S'] || keys['ArrowDown']) moveY = 1;
                if (keys['a'] || keys['A'] || keys['ArrowLeft']) moveX = -1;
                if (keys['d'] || keys['D'] || keys['ArrowRight']) moveX = 1;

                let len = Math.hypot(moveX, moveY);
                if (len > 1) { moveX /= len; moveY /= len; }

                player.x += moveX * player.speed * dt;
                player.y += moveY * player.speed * dt;

                // Ограничения карты
                player.x = Math.max(player.radius, Math.min(WORLD.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(WORLD.height - player.radius, player.y));

                if (len > 0) player.angle = Math.atan2(moveY, moveX);

                // Камера следит за игроком
                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                // Автострельба
                if (now - lastShot > 220) {
                    shoot();
                    lastShot = now;
                }

                // Логика зомби
                for (let i = zombies.length - 1; i >= 0; i--) {
                    let z = zombies[i];
                    let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);

                    // Если зомби увидел игрока близко — агрится
                    if (distToPlayer < 250) z.alerted = true;

                    if (z.alerted) {
                        let angle = Math.atan2(player.y - z.y, player.x - z.x);
                        z.x += Math.cos(angle) * z.speed * dt;
                        z.y += Math.sin(angle) * z.speed * dt;

                        if (distToPlayer < player.radius + z.radius) {
                            player.hp -= 15 * dt;
                            if (player.hp <= 0) gameState = 'GAMEOVER';
                        }
                    }
                }

                // Поведение пуль
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;

                    for (let j = zombies.length - 1; j >= 0; j--) {
                        let z = zombies[j];
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
                            z.hp--;
                            z.alerted = true;
                            Sound.playHit();
                            bullets.splice(i, 1);
                            if (z.hp <= 0) {
                                zombies.splice(j, 1);
                                score += 10;
                            }
                            break;
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ГРАФИКА И ОТРИСОВКА ---
        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трава (Основной фон)
            ctx.fillStyle = '#2d4c1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Сдвиг камеры
            ctx.translate(-camera.x, -camera.y);

            // Отрисовка пятен земли
            ctx.fillStyle = '#3d3118';
            for (let d of environment.dirtPatches) {
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Отрисовка зданий
            for (let b of environment.buildings) {
                ctx.fillStyle = '#1c1d22'; // Крыша
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#454954'; // Стены/Обводка
                ctx.lineWidth = 6;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            }

            // Отрисовка камней
            ctx.fillStyle = '#5a6266';
            for (let r of environment.rocks) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Отрисовка пуль
            ctx.fillStyle = '#fff566';
            for (let b of bullets) {
                ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
            }

            // Отрисовка Зомби (Реалистичные детали: одежда, разложение)
            for (let z of zombies) {
                ctx.save();
                ctx.translate(z.x, z.y);
                let angle = Math.atan2(player.y - z.y, player.x - z.x);
                ctx.rotate(angle);

                // Руки зомби
                ctx.fillStyle = z.color;
                ctx.fillRect(8, -z.radius + 2, 10, 4);
                ctx.fillRect(8, z.radius - 6, 10, 4);

                // Плечи/Одежда
                ctx.fillStyle = z.shirtColor;
                ctx.beginPath();
                ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
                ctx.fill();

                // Голова зомби (с пятнами)
                ctx.fillStyle = z.color;
                ctx.beginPath();
                ctx.arc(0, 0, z.radius - 4, 0, Math.PI * 2);
                ctx.fill();

                // Светящиеся глаза
                ctx.fillStyle = '#ff1744';
                ctx.fillRect(4, -4, 2, 2);
                ctx.fillRect(4, 2, 2, 2);

                ctx.restore();
            }

            // Отрисовка Человека (Выжившего)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Оружие (Автомат)
            ctx.fillStyle = '#111';
            ctx.fillRect(8, 5, 14, 3);

            // Руки человека (Кожа)
            ctx.fillStyle = '#e0a96d';
            ctx.fillRect(6, -player.radius + 2, 8, 4);
            ctx.fillRect(6, player.radius - 6, 8, 4);

            // Торс (Тактическая куртка)
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Голова и Кепка/Прическа
            ctx.fillStyle = '#e0a96d'; // Кожа
            ctx.beginPath();
            ctx.arc(-2, 0, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#263238'; // Кепка
            ctx.beginPath();
            ctx.arc(-3, 0, 7.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Отрисовка деревьев (Верхушки над объектами)
            for (let t of environment.trees) {
                // Тень дерева
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.arc(t.x + 8, t.y + 8, t.radius, 0, Math.PI * 2);
                ctx.fill();

                // Крона дерева
                ctx.fillStyle = '#1b3811';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#285119';
                ctx.beginPath();
                ctx.arc(t.x - 3, t.y - 3, t.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore(); // Сброс камеры

            // HUD
            if (gameState === 'PLAYING') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(20, 20, 160, 16);
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(22, 22, Math.max(0, player.hp / player.maxHp) * 156, 12);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`Уничтожено зомби: ${score / 10}`, 20, 54);
            }

            // Джойстик
            if (joystick.active) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(joystick.baseX, joystick.baseY, 50, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(
                    joystick.baseX + joystick.dx * 50,
                    joystick.baseY + joystick.dy * 50,
                    22, 0, Math.PI * 2
                );
                ctx.fill();
            }

            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ВАС СЪЕЛИ', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#fff';
                ctx.font = '16px sans-serif';
                ctx.fillText('Нажмите для перезапуска', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }

        generateMap();
        requestAnimationFrame(update);
    </script>
</body>
</html>
