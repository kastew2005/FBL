<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Teardown Mobile</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
            background: #222;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 18px; text-shadow: 1px 1px 2px black; }
        p { margin: 5px 0 0; font-size: 12px; opacity: 0.8; }
        
        /* Мобильные кнопки управления */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: auto;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        .btn:active {
            background: rgba(255, 100, 0, 0.6);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Mini Teardown: Mobile</h1>
        <p>Сломай стены, доберись до цели!</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button class="btn" id="btnTool">Инструмент: Кувалда</button>
        <button class="btn" id="btnReset">Сброс</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Настройка размера экрана под мобилки
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Игровой мир (карта из блоков/вокселей)
        const tileSize = 20;
        let map = [];
        let particles = [];
        let player = { x: 50, y: 50, radius: 8, speed: 3 };
        let target = { x: 0, y: 0, size: 20 };
        
        let keys = { w: false, a: false, s: false, d: false };
        let touchMove = { x: 0, y: 0 };

        function initMap() {
            map = [];
            let cols = Math.floor(canvas.width / tileSize);
            let rows = Math.floor(canvas.height / tileSize);

            for (let r = 0; r < rows; r++) {
                map[r] = [];
                for (let c = 0; c < cols; c++) {
                    // Создаем стены по периметру и преграды внутри
                    let isWall = 0;
                    if (r === 0 || c === 0 || r === rows - 1 || c === cols - 1) {
                        isWall = 1; // Внешние стены
                    } else if (Math.random() < 0.2 && (c > 5 || r > 5)) {
                        isWall = 1; // Рандомные разрушаемые стены
                    }
                    map[r][c] = isWall;
                }
            }

            // Позиция игрока
            player.x = tileSize * 2.5;
            player.y = tileSize * 2.5;

            // Цель (сейф/выход) в другом конце карты
            target.x = canvas.width - tileSize * 3;
            target.y = canvas.height - tileSize * 3;
        }

        initMap();

        // Управление с телефона (Тач-джойстик / Клик для разрушения)
        canvas.addEventListener('touchstart', handleTouch, {passive: false});
        canvas.addEventListener('touchmove', handleTouch, {passive: false});
        canvas.addEventListener('touchend', () => { touchMove = {x: 0, y: 0}; });

        function handleTouch(e) {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = canvas.getBoundingClientRect();
            let tx = touch.clientX - rect.left;
            let ty = touch.clientY - rect.top;

            // Если касание в нижней зоне управления — не двигаем игрока
            if (touch.clientY > canvas.height - 120) return;

            // Разрушение блоков по тачу (кувалда)
            breakBlockAt(tx, ty);
        }

        function breakBlockAt(px, py) {
            let c = Math.floor(px / tileSize);
            let r = Math.floor(py / tileSize);

            if (map[r] && map[r][c] === 1) {
                map[r][c] = 0; // Снос блока!
                createDebris(px, py);
            }
        }

        // Создание осколков (эффект разрушения Teardown)
        function createDebris(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    life: 30
                });
            }
        }

        // Кнопка сброса карты
        document.getElementById('btnReset').addEventListener('click', () => {
            initMap();
            particles = [];
        });

        // Простой виртуальный джойстик (тянуть пальцем по экрану для движения)
        let isDragging = false;
        let startDragX = 0, startDragY = 0;

        canvas.addEventListener('pointerdown', (e) => {
            if (e.clientY > canvas.height - 150) return;
            isDragging = true;
            startDragX = e.clientX;
            startDragY = e.clientY;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            touchMove.x = (e.clientX - startDragX) * 0.05;
            touchMove.y = (e.clientY - startDragY) * 0.05;
            // Ограничение скорости
            touchMove.x = Math.max(-1, Math.min(1, touchMove.x));
            touchMove.y = Math.max(-1, Math.min(1, touchMove.y));
        });

        canvas.addEventListener('pointerup', () => {
            isDragging = false;
            touchMove = {x: 0, y: 0};
        });


        // Игровой цикл
        function update() {
            // Движение игрока с учетом коллизий (стен)
            let nextX = player.x + touchMove.x * player.speed;
            let nextY = player.y + touchMove.y * player.speed;

            // Проверка столкновений со стенами по X
            let c = Math.floor(nextX / tileSize);
            let r = Math.floor(player.y / tileSize);
            if (!map[r] || map[r][c] !== 1) {
                player.x = nextX;
            }

            // Проверка столкновений со стенами по Y
            c = Math.floor(player.x / tileSize);
            r = Math.floor(nextY / tileSize);
            if (!map[r] || map[r][c] !== 1) {
                player.y = nextY;
            }

            // Обновление частиц (обломков)
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Проверка победы (достигли цели)
            let dist = Math.hypot(player.x - target.x, player.y - target.y);
            if (dist < target.size) {
                alert('Уровень пройден! Сейф украден!');
                initMap();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем карту (стены)
            for (let r = 0; r < map.length; r++) {
                for (let c = 0; c < map[r].length; c++) {
                    if (map[r][c] === 1) {
                        ctx.fillStyle = '#666'; // Цвет бетона/стены
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
                        // Добавим эффект объема в стиле вокселей
                        ctx.fillStyle = '#888';
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, 4);
                    }
                }
            }

            // Рисуем цель (сейф)
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(target.x - 10, target.y - 10, target.size, target.size);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText('ЦЕЛЬ', target.x - 12, target.y - 14);

            // Рисуем частицы (обломки кирпичей/бетона)
            ctx.fillStyle = '#aaa';
            for (let p of particles) {
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            // Рисуем игрока
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Направление взгляда / прицел
            if (isDragging) {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + touchMove.x * 30, player.y + touchMove.y * 30);
                ctx.stroke();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
