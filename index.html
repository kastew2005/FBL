<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Flappy Bird</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#70c5ce;margin:0}
canvas{background:#70c5ce;display:block}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=cvs.width,H=cvs.height;
let bird={x:80,y:H/2,r:14,vy:0},g=0.6,jump=-10,frames=0,score=0,high=0;
let pipes=[];let gap=140,pipeW=60,spd=2,gameOver=false,started=false;
function reset(){bird.y=H/2;bird.vy=0;pipes=[];frames=0;score=0;gameOver=false;started=false;}
function spawn(){let top = 50 + Math.random()*(H-gap-150); pipes.push({x:W,top:top});}
function draw(){
 ctx.clearRect(0,0,W,H);
 // bird
 ctx.fillStyle="#FFD54A";ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.fill();
 // pipes
 ctx.fillStyle="#3EA055"; for(let p of pipes){
   ctx.fillRect(p.x,0,pipeW,p.top); ctx.fillRect(p.x,p.top+gap,pipeW,H);
 }
 // ground
 ctx.fillStyle="#DEB887";ctx.fillRect(0,H-40,W,40);
 // score
 ctx.fillStyle="#fff";ctx.font="30px Arial";ctx.fillText(score,10,50);
 if(!started){ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText("Клик или пробел чтобы стартовать",50,H/2);}
 if(gameOver){ctx.fillStyle="#fff";ctx.font="30px Arial";ctx.fillText("Game Over - клик для рестарта",20,H/2+40);}
}
function update(){
 if(!started) return;
 bird.vy += g; bird.y += bird.vy;
 if(bird.y+bird.r>H-40) {gameOver=true;started=false; high=Math.max(high,score);}
 if(bird.y-bird.r<0) bird.y=bird.r, bird.vy=0;
 if(frames%90==0) spawn();
 for(let i=pipes.length-1;i>=0;i--){
   let p=pipes[i]; p.x -= spd;
   if(p.x+pipeW<0) pipes.splice(i,1);
   // score
   if(!p.passed && p.x+pipeW < bird.x){ score++; p.passed=true;}
   // collision
   if(bird.x+bird.r>p.x && bird.x-bird.r<p.x+pipeW){
     if(bird.y-bird.r < p.top || bird.y+bird.r > p.top+gap){ gameOver=true; started=false; high=Math.max(high,score);}
   }
 }
 frames++;
}
function loop(){update();draw(); requestAnimationFrame(loop);}
cvs.addEventListener('click',()=>{
 if(gameOver) reset();
 if(!started) started=true;
 bird.vy=jump;
});
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); if(gameOver) reset(); if(!started) started=true; bird.vy=jump;}});
reset();loop();
</script>
</body>
</html>
