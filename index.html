<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft PE Ultra HD</title>
    
    <!-- Подключение Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <div class="loader-content">
            <h1 class="mc-title">ГЕНЕРАЦИЯ МИРА...</h1>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <p id="loading-tip">Загрузка ресурсов и структуры...</p>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen">
        <div class="menu-card">
            <div class="mc-title">MINECRAFT<br><span class="subtitle">ULTRA HD EDITION</span></div>
            
            <div class="menu-options">
                <label>Режим:</label>
                <select id="game-mode">
                    <option value="survival">Выживание</option>
                    <option value="creative">Творчество</option>
                </select>
            </div>

            <button class="mc-btn" id="start-btn">ИГРАТЬ</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen">
        <div id="crosshair"></div>
        <div id="water-overlay"></div>
        <div id="aura-status">✨ АУРА ДРАКОНА АКТИВНА [F]</div>
        
        <div id="hud-bottom">
            <div id="hotbar">
                <div class="hotbar-slot active">1</div>
                <div class="hotbar-slot">2</div>
                <div class="hotbar-slot">3</div>
                <div class="hotbar-slot">4</div>
                <div class="hotbar-slot">5</div>
            </div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Подключение модулей в нужном порядке -->
    <script src="textures.js"></script>
    <script src="physics.js"></script>
    <script src="world.js"></script>
    <script src="mobs.js"></script>
    <script src="effects.js"></script>
    <script src="player.js"></script>
    <script src="game.js"></script>
</body>
</html>
