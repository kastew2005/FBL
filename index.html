<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft PE Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
        
        #menu-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 1000; display: flex;
            align-items: center; justify-content: center; flex-direction: column; gap: 15px; color: #fff;
        }
        .start-btn {
            padding: 15px 30px; font-size: 18px; background: #55ff55; border: none;
            color: #000; font-weight: bold; border-radius: 5px; cursor: pointer;
        }

        #hud { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); border: 2px solid #fff; border-radius: 50%; }
        #aura-info { position: absolute; top: 10px; left: 10px; color: #ff00ff; font-weight: bold; font-size: 14px; display: none; background: rgba(0,0,0,0.5); padding: 5px; }

        /* Touch Controls */
        #mobile-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 200; pointer-events: auto; display: none; }
        #joy-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid #fff; }
        #joy-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #fff; border-radius: 50%; }
        #btn-jump { position: absolute; bottom: 40px; right: 30px; width: 70px; height: 70px; background: rgba(255,255,255,0.4); border: 2px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        #btn-aura { position: absolute; bottom: 120px; right: 30px; width: 70px; height: 70px; background: rgba(138,43,226,0.6); border: 2px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>MINECRAFT ENGINE FIX</h1>
        <p>Исправлен спавн, коллизии и тач-интерфейс</p>
        <button class="start-btn" id="btn-start">ИГРАТЬ</button>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="aura-info">✨ АУРА ДРАКОНА [АКТИВНА]</div>
    </div>

    <div id="mobile-layer">
        <div id="joy-zone"><div id="joy-stick"></div></div>
        <div id="btn-jump">JUMP</div>
        <div id="btn-aura">AURA</div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        let scene, camera, renderer, worldBlocks = new Map();
        let playerPos = new THREE.Vector3(0, 18, 0);
        let playerVel = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        let auraActive = false;
        let auraParticles = [];

        // ТЕКСТУРЫ
        function makeTexture(colorHex, detailHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.fillRect(0,0,64,64);
            ctx.fillStyle = detailHex;
            for(let i=0; i<100; i++) {
                ctx.fillRect(Math.random()*64, Math.random()*64, 4, 4);
            }
            const t = new THREE.CanvasTexture(canvas);
            t.magFilter = THREE.NearestFilter;
            return t;
        }

        const materials = {
            grass: new THREE.MeshLambertMaterial({ map: makeTexture('#4a8505', '#2d5202') }),
            dirt: new THREE.MeshLambertMaterial({ map: makeTexture('#573d26', '#362414') }),
            stone: new THREE.MeshLambertMaterial({ map: makeTexture('#737373', '#4a4a4a') }),
            wood: new THREE.MeshLambertMaterial({ map: makeTexture('#614322', '#3b2813') }),
            leaves: new THREE.MeshLambertMaterial({ map: makeTexture('#1e5210', '#0e2b07') }),
            altar: new THREE.MeshLambertMaterial({ map: makeTexture('#8a2be2', '#4b0082') })
        };

        // ИНИЦИАЛИЗАЦИЯ
        function init() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(playerPos);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(20, 40, 10);
            scene.add(ambient, sun);

            generateWorld();
            setupControls();

            // Детекция сенсорного экрана
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-layer').style.display = 'block';
            }

            animate();
        }

        // ГЕНЕРАЦИЯ МИРА БЕЗ ЗАСТРЕВАНИЯ
        function getKey(x, y, z) { return `${x},${y},${z}`; }

        function setBlock(x, y, z, mat) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            scene.add(mesh);
            worldBlocks.set(getKey(Math.floor(x), Math.floor(y), Math.floor(z)), true);
        }

        function generateWorld() {
            for (let x = -12; x <= 12; x++) {
                for (let z = -12; z <= 12; z++) {
                    let h = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 3) + 6;
                    for (let y = 0; y <= h; y++) {
                        let mat = (y === h) ? materials.grass : (y > h - 3 ? materials.dirt : materials.stone);
                        setBlock(x, y, z, mat);
                    }
                }
            }
            // Алтарь дракона
            setBlock(2, 7, 2, materials.altar);
        }

        // УПРАВЛЕНИЕ И СЕНСОР
        let keys = {};
        let moveFwd = 0, moveSide = 0;
        let lookTouchId = null, lastX = 0, lastY = 0;

        function setupControls() {
            document.getElementById('btn-start').addEventListener('click', () => {
                document.getElementById('menu-screen').style.display = 'none';
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                if (document.getElementById('mobile-layer').style.display !== 'block') {
                    document.getElementById('game-canvas').requestPointerLock();
                }
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyF') toggleAura();
                if (e.code === 'Space' && isGrounded) playerVel.y = 8;
            });
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.getElementById('game-canvas')) {
                    camera.rotation.y -= e.movementX * 0.0025;
                    camera.rotation.x -= e.movementY * 0.0025;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            // Мобильный джойстик
            const joyZone = document.getElementById('joy-zone');
            const joyStick = document.getElementById('joy-stick');

            joyZone.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
            joyZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joyZone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                let dx = touch.clientX - cx;
                let dy = touch.clientY - cy;
                const dist = Math.min(Math.hypot(dx, dy), 40);
                const angle = Math.atan2(dy, dx);

                const mx = Math.cos(angle) * dist;
                const my = Math.sin(angle) * dist;
                joyStick.style.transform = `translate(${mx}px, ${my}px)`;

                moveSide = mx / 40;
                moveFwd = -my / 40;
            }, { passive: false });

            const resetJoy = () => {
                joyStick.style.transform = 'translate(0px, 0px)';
                moveFwd = 0; moveSide = 0;
            };
            joyZone.addEventListener('touchend', resetJoy);
            joyZone.addEventListener('touchcancel', resetJoy);

            // Сенсорный обзор
            window.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2 && lookTouchId === null) {
                        lookTouchId = t.identifier;
                        lastX = t.clientX; lastY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === lookTouchId) {
                        let dx = t.clientX - lastX;
                        let dy = t.clientY - lastY;
                        camera.rotation.y -= dx * 0.006;
                        camera.rotation.x -= dy * 0.006;
                        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                        lastX = t.clientX; lastY = t.clientY;
                    }
                }
            });

            const clearTouch = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === lookTouchId) lookTouchId = null;
                }
            };
            window.addEventListener('touchend', clearTouch);
            window.addEventListener('touchcancel', clearTouch);

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded) playerVel.y = 8;
            });

            document.getElementById('btn-aura').addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleAura();
            });
        }

        function toggleAura() {
            auraActive = !auraActive;
            document.getElementById('aura-info').style.display = auraActive ? 'block' : 'none';
        }

        // ФИЗИКА И ДВИЖЕНИЕ
        function updatePhysics(dt) {
            let speed = auraActive ? 0.22 : 0.12;

            // Клавиатура / Сенсор
            if (keys['KeyW']) camera.translateZ(-speed);
            if (keys['KeyS']) camera.translateZ(speed);
            if (keys['KeyA']) camera.translateX(-speed);
            if (keys['KeyD']) camera.translateX(speed);

            if (moveFwd !== 0) camera.translateZ(-moveFwd * speed);
            if (moveSide !== 0) camera.translateX(moveSide * speed);

            // Гравитация и Проверка блока под ногами
            playerVel.y -= 22.0 * dt;
            playerPos.y += playerVel.y * dt;

            let checkX = Math.floor(camera.position.x);
            let checkY = Math.floor(playerPos.y - 1.6);
            let checkZ = Math.floor(camera.position.z);

            if (worldBlocks.has(getKey(checkX, checkY, checkZ))) {
                playerPos.y = checkY + 1 + 1.6;
                playerVel.y = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            camera.position.x = playerPos.x;
            camera.position.y = playerPos.y;
            camera.position.z = playerPos.z;

            // Частицы Ауры
            if (auraActive) {
                const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const pMat = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(
                    camera.position.x + (Math.random() - 0.5) * 1.5,
                    camera.position.y - 0.5 + Math.random(),
                    camera.position.z + (Math.random() - 0.5) * 1.5
                );
                scene.add(p);
                setTimeout(() => scene.remove(p), 350);
            }
        }

        // ЦИКЛ
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            let now = performance.now();
            let dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePhysics(dt);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
