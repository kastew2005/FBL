<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MiniCraft - Браузерная 3D игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="crosshair">+</div>
        <div id="toolbar">
            <div class="tool active" data-block="grass">🌱</div>
            <div class="tool" data-block="dirt">🟫</div>
            <div class="tool" data-block="stone">🪨</div>
            <div class="tool" data-block="wood">🪵</div>
            <div class="tool" data-block="sand">🏖️</div>
        </div>
        <div id="info">
            <div id="controls">
                <p>WASD - движение</p>
                <p>Пробел - прыжок</p>
                <p>Клик - поставить/убрать блок</p>
                <p>Правая кнопка - убрать блок</p>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
