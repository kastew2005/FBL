<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zombie Open World 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Экранный джойстик для мобильных устройств */
        #ui { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.2); border: 2px solid #fff; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; touch-action: manipulation; }
        .btn:active { background: rgba(255, 255, 255, 0.5); }
        #hud { position: absolute; top: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 16px; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <div id="hud">Зомби вокруг: <span id="zombie-count">0</span> | Здоровье: <span id="hp">100</span>%</div>
    <div id="canvas-container"></div>
    
    <!-- Мобильное управление -->
    <div id="ui">
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="btn-left">◄</div>
            <div class="btn" id="btn-right">►</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="btn-gas">▲</div>
            <div class="btn" id="btn-brake">▼</div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015); // Туман апокалипсиса

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Освещение (ночной апокалипсис)
        const ambientLight = new THREE.AmbientLight(0x222233);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x444466, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Генерация Открытого Мира (Земля)
        const WORLD_SIZE = 400;
        const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111511, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Разрушенные здания (Декорации мира)
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        for (let i = 0; i < 40; i++) {
            const b = new THREE.Mesh(buildingGeo, buildingMat);
            const w = 10 + Math.random() * 15;
            const h = 5 + Math.random() * 25;
            const d = 10 + Math.random() * 15;
            b.scale.set(w, h, d);
            b.position.set((Math.random() - 0.5) * (WORLD_SIZE - 40), h / 2, (Math.random() - 0.5) * (WORLD_SIZE - 40));
            b.castShadow = true;
            b.receiveShadow = true;
            scene.add(b);
        }

        // Игрок (Машина)
        const carGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.5;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Фары машины
        const headlight = new THREE.SpotLight(0xffffff, 2, 40, Math.PI / 6, 0.5);
        headlight.position.set(0, 0.8, -1.8);
        headlight.target.position.set(0, 0, -10);
        carGroup.add(headlight);
        carGroup.add(headlight.target);

        scene.add(carGroup);

        // Зомби
        const zombies = [];
        const zombieMat = new THREE.MeshStandardMaterial({ color: 0x2e5c1e });
        const zombieGeo = new THREE.BoxGeometry(1, 2, 1);

        function spawnZombies(count) {
            for (let i = 0; i < count; i++) {
                const z = new THREE.Mesh(zombieGeo, zombieMat);
                z.position.set((Math.random() - 0.5) * (WORLD_SIZE - 20), 1, (Math.random() - 0.5) * (WORLD_SIZE - 20));
                z.castShadow = true;
                scene.add(z);
                zombies.push(z);
            }
            document.getElementById('zombie-count').innerText = zombies.length;
        }
        spawnZombies(60);

        // Управление (Клавиатура + Тачскрин)
        const input = { forward: 0, turn: 0 };
        
        // Обработка кнопки мыши/тачей
        const bindBtn = (id, action, val) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); input[action] = val; };
            const end = (e) => { e.preventDefault(); input[action] = 0; };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        };

        bindBtn('btn-gas', 'forward', 1);
        bindBtn('btn-brake', 'forward', -1);
        bindBtn('btn-left', 'turn', 1);
        bindBtn('btn-right', 'turn', -1);

        // Физика и состояние
        let speed = 0;
        let health = 100;
        const carStats = { maxSpeed: 0.6, accel: 0.02, turnSpeed: 0.03, friction: 0.96 };

        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            // Движение машины
            if (input.forward !== 0) {
                speed = THREE.MathUtils.clamp(speed + input.forward * carStats.accel, -carStats.maxSpeed / 2, carStats.maxSpeed);
            } else {
                speed *= carStats.friction;
            }

            if (Math.abs(speed) > 0.001) {
                carGroup.rotation.y += input.turn * carStats.turnSpeed * Math.sign(speed);
            }

            carGroup.translateZ(-speed);

            // Ограничение границами мира
            const border = WORLD_SIZE / 2 - 2;
            carGroup.position.x = THREE.MathUtils.clamp(carGroup.position.x, -border, border);
            carGroup.position.z = THREE.MathUtils.clamp(carGroup.position.z, -border, border);

            // Камера следит за машиной
            const cameraOffset = new THREE.Vector3(0, 5, 12).applyMatrix4(carGroup.matrixWorld);
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            // Поведение зомби
            zombies.forEach((z, index) => {
                // Идти к машине
                const dir = new THREE.Vector3().subVectors(carGroup.position, z.position);
                dir.y = 0;
                if (dir.length() < 50) { // Видят игрока неподалеку
                    dir.normalize();
                    z.position.addScaledVector(dir, 0.08);
                    z.lookAt(carGroup.position.x, 1, carGroup.position.z);
                }

                // Проверка столкновения
                const dist = z.position.distanceTo(carGroup.position);
                if (dist < 2) {
                    if (Math.abs(speed) > 0.2) {
                        // Сбить зомби на скорости
                        scene.remove(z);
                        zombies.splice(index, 1);
                        document.getElementById('zombie-count').innerText = zombies.length;
                    } else {
                        // Зомби атакуют стоячую машину
                        health = Math.max(0, health - 0.1);
                        document.getElementById('hp').innerText = Math.floor(health);
                    }
                }
            });

            renderer.render(scene, camera);
        }

        // Адаптация под размер экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
