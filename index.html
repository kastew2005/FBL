<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival HD - Extended Apocalypse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050705; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        .ui-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 20, 28, 0.95); border: 2px solid #ff9800;
            border-radius: 12px; padding: 20px; color: #fff;
            box-shadow: 0 0 25px rgba(0,0,0,0.9); z-index: 100;
            width: 90%; max-width: 420px;
        }

        .ui-header { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #37474f; padding-bottom: 10px; color: #ffb74d; }
        .item-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.06); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-action { background: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; }
        .btn-close { margin-top: 15px; width: 100%; background: #d32f2f; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; }

        #mainMenu {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a237e 0%, #050705 100%); z-index: 200;
        }
        #mainMenu h1 { font-size: 36px; color: #ff5722; text-shadow: 0 0 20px rgba(255,87,34,0.8); margin-bottom: 10px; text-align: center; }
        #mainMenu p { color: #b0bec5; margin-bottom: 30px; text-align: center; padding: 0 10px; }
        .menu-btn {
            width: 240px; padding: 16px; margin: 10px; background: #263238; color: #fff;
            border: 2px solid #ff9800; border-radius: 30px; font-size: 18px; font-weight: bold; text-align: center;
        }

        /* Кнопки интерфейса */
        .hud-btn {
            position: absolute; background: rgba(0,0,0,0.65); color: #fff; border: 1px solid #ff9800;
            padding: 8px 14px; border-radius: 20px; font-weight: bold; z-index: 50; font-size: 13px;
        }
        #invBtn { top: 15px; left: 15px; }
        #achBtn { top: 15px; left: 130px; }

        #actionBtn {
            display: none; position: absolute; bottom: 120px; right: 30px;
            background: rgba(255, 152, 0, 0.9); color: #fff;
            border: 2px solid #fff; padding: 16px 24px; border-radius: 50px;
            font-weight: bold; font-size: 16px; z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Уведомление о достижениях */
        #achToast {
            position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
            background: #2e7d32; border: 2px solid #ffb74d; color: white;
            padding: 12px 24px; border-radius: 25px; font-weight: bold; z-index: 300;
            transition: top 0.5s ease-in-out; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="mainMenu">
        <h1>ZOMBIE SURVIVAL</h1>
        <p>Исследуйте дороги, машины и заброшенный город</p>
        <div class="menu-btn" onclick="startGame()">ИГРАТЬ</div>
    </div>

    <button id="invBtn" class="hud-btn" style="display:none;" onclick="openInventory()">🎒 Инвентарь</button>
    <button id="achBtn" class="hud-btn" style="display:none;" onclick="openAchievements()">🏆 Ачивки</button>
    <button id="actionBtn" onclick="triggerAction()">ОБЫСКАТЬ</button>

    <div id="achToast">🏆 Достижение разблокировано!</div>

    <div id="lootMenu" class="ui-panel">
        <div class="ui-header" id="lootHeader">📦 Тайник</div>
        <div id="lootList" class="item-list"></div>
        <button class="btn-close" onclick="closeLootMenu()">Закрыть</button>
    </div>

    <div id="inventoryMenu" class="ui-panel">
        <div class="ui-header">🎒 Инвентарь</div>
        <div id="inventoryStats" style="margin-bottom: 10px; font-size: 14px; color: #b0bec5;"></div>
        <div id="inventoryList" class="item-list"></div>
        <button class="btn-close" onclick="closeInventory()">Закрыть</button>
    </div>

    <div id="achievementsMenu" class="ui-panel">
        <div class="ui-header">🏆 Достижения</div>
        <div id="achievementsList" class="item-list"></div>
        <button class="btn-close" onclick="closeAchievements()">Закрыть</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const actionBtn = document.getElementById('actionBtn');

        const WORLD = { width: 4000, height: 4000 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);
        resize();

        // Оружие с ограниченной дальностью (maxRange)
        const ITEMS = {
            pistol: { name: 'Пистолет', type: 'weapon', fireRate: 250, damage: 1.5, speed: 850, count: 1, spread: 0.05, maxRange: 450, ammoType: '9mm' },
            shotgun: { name: 'Дробовик', type: 'weapon', fireRate: 750, damage: 1.2, speed: 700, count: 6, spread: 0.35, maxRange: 280, ammoType: '12cal' },
            rifle: { name: 'Автомат', type: 'weapon', fireRate: 110, damage: 1.1, speed: 950, count: 1, spread: 0.08, maxRange: 650, ammoType: '5.56mm' },
            medkit: { name: 'Аптечка (+50 HP)', type: 'heal', healVal: 50 },
            ammo_9mm: { name: 'Патроны 9mm (+30)', type: 'ammo', ammoKey: '9mm', count: 30 },
            ammo_12cal: { name: 'Патроны 12cal (+12)', type: 'ammo', ammoKey: '12cal', count: 12 },
            ammo_556mm: { name: 'Патроны 5.56mm (+45)', type: 'ammo', ammoKey: '5.56mm', count: 45 },
            armor: { name: 'Бронежилет', type: 'armor', armorVal: 50 }
        };

        const ACHIEVEMENTS = [
            { id: 'first_kill', name: 'Первая кровь', desc: 'Убейте первого зомби', unlocked: false },
            { id: 'zombie_slayer', name: 'Охотник на зомби', desc: 'Убейте 10 мутантов', unlocked: false },
            { id: 'looter', name: 'Мародер', desc: 'Обыщите 3 машины или тайника', unlocked: false },
            { id: 'survivor', name: 'Выживший', desc: 'Используйте аптечку', unlocked: false }
        ];

        let gameState = 'MENU';
        let lastShot = 0;
        let activeContainer = null;
        let killsCount = 0;
        let lootedCount = 0;

        const player = {
            x: WORLD.width / 2, y: WORLD.height / 2,
            radius: 16, hp: 100, maxHp: 100, armor: 0,
            speed: 190, angle: 0, walking: false, stepAnim: 0,
            currentWeapon: 'pistol',
            ammo: { '9mm': 90, '12cal': 24, '5.56mm': 60 },
            inventory: ['pistol', 'medkit']
        };

        const camera = { x: 0, y: 0 };
        let zombies = [];
        let bullets = [];
        let bloodSplatters = [];
        let environment = { lakes: [], trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [], roads: [], cars: [] };

        const moveJoystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const aimJoystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };

        function unlockAchievement(id) {
            let ach = ACHIEVEMENTS.find(a => a.id === id);
            if (ach && !ach.unlocked) {
                ach.unlocked = true;
                const toast = document.getElementById('achToast');
                toast.innerText = `🏆 Достижение: ${ach.name}!`;
                toast.style.top = '20px';
                setTimeout(() => { toast.style.top = '-80px'; }, 3500);
            }
        }

        function generateMap() {
            environment = { lakes: [], trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [], roads: [], cars: [] };
            zombies = []; bloodSplatters = [];

            // 1. Дороги
            environment.roads.push({ x: 0, y: WORLD.height / 2 - 50, w: WORLD.width, h: 100 });
            environment.roads.push({ x: WORLD.width / 2 - 50, y: 0, w: 100, h: WORLD.height });

            // 2. Машины (с 5% шансом супер-лута)
            for (let i = 0; i < 28; i++) {
                let onVertRoad = Math.random() > 0.5;
                let cx = onVertRoad ? WORLD.width / 2 + (Math.random() > 0.5 ? -25 : 10) : Math.random() * (WORLD.width - 200) + 100;
                let cy = onVertRoad ? Math.random() * (WORLD.height - 200) + 100 : WORLD.height / 2 + (Math.random() > 0.5 ? -25 : 10);

                let hasLoot = Math.random() < 0.05; // 5% Шанс
                let items = [];
                if (hasLoot) {
                    items = ['rifle', 'ammo_556mm', 'medkit', 'armor'];
                } else if (Math.random() < 0.4) {
                    items = ['ammo_9mm', 'medkit'];
                }

                environment.cars.push({
                    x: cx, y: cy, w: 45, h: 80, angle: Math.random() * Math.PI,
                    color: ['#37474f', '#4e342e', '#263238', '#1b5e20'][Math.floor(Math.random()*4)],
                    hasLoot, items, looted: false
                });
            }

            // 3. Озера
            for (let i = 0; i < 4; i++) {
                environment.lakes.push({
                    x: Math.random() * (WORLD.width - 800) + 400, y: Math.random() * (WORLD.height - 800) + 400,
                    radius: Math.random() * 80 + 130
                });
            }

            // 4. Деревья и Камни
            for (let i = 0; i < 70; i++) environment.trees.push({ x: Math.random() * WORLD.width, y: Math.random() * WORLD.height, radius: 32 });
            for (let i = 0; i < 40; i++) environment.rocks.push({ x: Math.random() * WORLD.width, y: Math.random() * WORLD.height, radius: 15 });

            // 5. Зомби
            for (let i = 0; i < 60; i++) {
                zombies.push({
                    x: Math.random() * WORLD.width, y: Math.random() * WORLD.height,
                    radius: 16, hp: 5, speed: 65 + Math.random() * 45, alerted: false
                });
            }
        }

        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('invBtn').style.display = 'block';
            document.getElementById('achBtn').style.display = 'block';
            gameState = 'PLAYING';
            generateMap();
        }

        // --- УПРАВЛЕНИЕ (TOUCH) ---
        window.addEventListener('touchstart', e => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-panel')) return;
            for (let touch of e.changedTouches) {
                if (touch.clientX < window.innerWidth / 2 && !moveJoystick.active) {
                    moveJoystick.active = true; moveJoystick.touchId = touch.identifier;
                    moveJoystick.baseX = touch.clientX; moveJoystick.baseY = touch.clientY;
                    moveJoystick.dx = 0; moveJoystick.dy = 0;
                } else if (touch.clientX >= window.innerWidth / 2 && !aimJoystick.active) {
                    aimJoystick.active = true; aimJoystick.touchId = touch.identifier;
                    aimJoystick.baseX = touch.clientX; aimJoystick.baseY = touch.clientY;
                    aimJoystick.dx = 0; aimJoystick.dy = 0;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoystick.touchId) {
                    let dx = touch.clientX - moveJoystick.baseX, dy = touch.clientY - moveJoystick.baseY;
                    let dist = Math.hypot(dx, dy), maxD = 50;
                    moveJoystick.dx = (dist > maxD ? (dx / dist) * maxD : dx) / maxD;
                    moveJoystick.dy = (dist > maxD ? (dy / dist) * maxD : dy) / maxD;
                }
                if (touch.identifier === aimJoystick.touchId) {
                    let dx = touch.clientX - aimJoystick.baseX, dy = touch.clientY - aimJoystick.baseY;
                    let dist = Math.hypot(dx, dy), maxD = 50;
                    aimJoystick.dx = (dist > maxD ? (dx / dist) * maxD : dx) / maxD;
                    aimJoystick.dy = (dist > maxD ? (dy / dist) * maxD : dy) / maxD;
                }
            }
        });

        const resetTouch = (id) => {
            if (id === moveJoystick.touchId) { moveJoystick.active = false; moveJoystick.dx = 0; moveJoystick.dy = 0; }
            if (id === aimJoystick.touchId) { aimJoystick.active = false; aimJoystick.dx = 0; aimJoystick.dy = 0; }
        };
        window.addEventListener('touchend', e => { for (let t of e.changedTouches) resetTouch(t.identifier); });

        function resolveCollisions(entity) {
            for (let lake of environment.lakes) {
                let dist = Math.hypot(entity.x - lake.x, entity.y - lake.y);
                if (dist < lake.radius + entity.radius) {
                    let overlap = (lake.radius + entity.radius) - dist;
                    let angle = Math.atan2(entity.y - lake.y, entity.x - lake.x);
                    entity.x += Math.cos(angle) * overlap;
                    entity.y += Math.sin(angle) * overlap;
                }
            }
        }

        function triggerAction() {
            if (activeContainer) openLootMenu(activeContainer);
        }

        function openLootMenu(container) {
            activeContainer = container;
            const list = document.getElementById('lootList');
            document.getElementById('lootHeader').innerText = container.hasLoot ? '🚘 Ценный Багажник!' : '📦 Контейнер';
            list.innerHTML = container.items.length === 0 ? '<div style="text-align:center;">Пусто</div>' : '';
            container.items.forEach((itemKey, idx) => {
                const item = ITEMS[itemKey];
                list.innerHTML += `<div class="item-card"><span>${item.name}</span><button class="btn-action" onclick="takeLoot(${idx})">Забрать</button></div>`;
            });
            document.getElementById('lootMenu').style.display = 'block';
        }
        function closeLootMenu() { document.getElementById('lootMenu').style.display = 'none'; }

        function takeLoot(idx) {
            let key = activeContainer.items[idx];
            let item = ITEMS[key];
            if (item.type === 'ammo') player.ammo[item.ammoKey] += item.count;
            else player.inventory.push(key);
            activeContainer.items.splice(idx, 1);
            lootedCount++;
            if (lootedCount >= 3) unlockAchievement('looter');
            openLootMenu(activeContainer);
        }

        function openInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            document.getElementById('inventoryStats').innerHTML = `HP: ${Math.round(player.hp)} | Броня: ${player.armor}`;
            player.inventory.forEach((key) => {
                let item = ITEMS[key];
                list.innerHTML += `<div class="item-card"><span>${item.name}</span><button class="btn-action" onclick="useItem('${key}')">Использовать</button></div>`;
            });
            document.getElementById('inventoryMenu').style.display = 'block';
        }
        function closeInventory() { document.getElementById('inventoryMenu').style.display = 'none'; }

        function useItem(key) {
            let item = ITEMS[key];
            if (item.type === 'weapon') player.currentWeapon = key;
            if (item.type === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + item.healVal);
                player.inventory.splice(player.inventory.indexOf(key), 1);
                unlockAchievement('survivor');
            }
            if (item.type === 'armor') { player.armor = item.armorVal; player.inventory.splice(player.inventory.indexOf(key), 1); }
            openInventory();
        }

        function openAchievements() {
            const list = document.getElementById('achievementsList');
            list.innerHTML = '';
            ACHIEVEMENTS.forEach(a => {
                list.innerHTML += `<div class="item-card" style="opacity: ${a.unlocked ? 1 : 0.5}">
                    <div><b>${a.name}</b><br><small>${a.desc}</small></div>
                    <span>${a.unlocked ? '✅' : '🔒'}</span>
                </div>`;
            });
            document.getElementById('achievementsMenu').style.display = 'block';
        }
        function closeAchievements() { document.getElementById('achievementsMenu').style.display = 'none'; }

        function shoot() {
            const wpn = ITEMS[player.currentWeapon];
            if ((player.ammo[wpn.ammoType] || 0) <= 0) return;
            player.ammo[wpn.ammoType]--;

            for (let i = 0; i < wpn.count; i++) {
                let finalAngle = player.angle + (Math.random() - 0.5) * wpn.spread;
                bullets.push({
                    startX: player.x, startY: player.y,
                    x: player.x, y: player.y,
                    vx: Math.cos(finalAngle) * wpn.speed, vy: Math.sin(finalAngle) * wpn.speed,
                    damage: wpn.damage, maxRange: wpn.maxRange
                });
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        let lastTime = performance.now();

        function update(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = now;

            if (gameState === 'PLAYING') {
                player.x += moveJoystick.dx * player.speed * dt;
                player.y += moveJoystick.dy * player.speed * dt;
                resolveCollisions(player);

                if (aimJoystick.active) {
                    player.angle = Math.atan2(aimJoystick.dy, aimJoystick.dx);
                    const wpn = ITEMS[player.currentWeapon];
                    if (now - lastShot > wpn.fireRate) { shoot(); lastShot = now; }
                } else if (moveJoystick.active) {
                    player.angle = Math.atan2(moveJoystick.dy, moveJoystick.dx);
                }

                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                // Нахождение рядом с машиной
                activeContainer = environment.cars.find(c => Math.hypot(player.x - c.x, player.y - c.y) < 50 && c.items.length > 0);
                actionBtn.style.display = activeContainer ? 'block' : 'none';

                // Зомби
                for (let z of zombies) {
                    let d = Math.hypot(player.x - z.x, player.y - z.y);
                    if (d < 280) z.alerted = true;
                    if (z.alerted) {
                        let a = Math.atan2(player.y - z.y, player.x - z.x);
                        z.x += Math.cos(a) * z.speed * dt;
                        z.y += Math.sin(a) * z.speed * dt;
                        resolveCollisions(z);
                        if (d < player.radius + z.radius) player.hp -= 15 * dt;
                    }
                }

                // Пули с проверкой ДАЛЬНОСТИ (maxRange)
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx * dt; b.y += b.vy * dt;

                    let distTraveled = Math.hypot(b.x - b.startX, b.y - b.startY);
                    if (distTraveled >= b.maxRange) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    for (let z of zombies) {
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
                            z.hp -= b.damage; z.alerted = true;
                            bloodSplatters.push({ x: z.x, y: z.y, r: Math.random() * 8 + 4 });
                            bullets.splice(i, 1);
                            if (z.hp <= 0) {
                                zombies.splice(zombies.indexOf(z), 1);
                                killsCount++;
                                if (killsCount >= 1) unlockAchievement('first_kill');
                                if (killsCount >= 10) unlockAchievement('zombie_slayer');
                            }
                            break;
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ГРАФИКА ---
        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2d3827'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(-camera.x, -camera.y);

            // 1. ДОРОГИ
            ctx.fillStyle = '#37474f';
            for (let r of environment.roads) ctx.fillRect(r.x, r.y, r.w, r.h);

            // 2. ПЯТНА КРОВИ
            ctx.fillStyle = '#800000';
            for (let b of bloodSplatters) {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
            }

            // 3. ОЗЕРА
            for (let l of environment.lakes) {
                ctx.fillStyle = '#c2b280'; ctx.beginPath(); ctx.arc(l.x, l.y, l.radius + 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#1e88e5'; ctx.beginPath(); ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 4. ЗАБРОШЕННЫЕ МАШИНЫ
            for (let c of environment.cars) {
                ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
                ctx.fillStyle = c.color; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
                ctx.fillStyle = '#111'; ctx.fillRect(-c.w/2 + 2, -c.h/2 + 10, c.w - 4, 15); // Стекло
                if (c.hasLoot && c.items.length > 0) {
                    ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(0, c.h/2 - 5, 4, 0, Math.PI*2); ctx.fill(); // Подсветка лута
                }
                ctx.restore();
            }

            // 5. ПУЛИ
            ctx.fillStyle = '#ffeb3b';
            for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }

            // 6. ЗОМБИ
            for (let z of zombies) {
                ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(Math.atan2(player.y - z.y, player.x - z.x));
                ctx.fillStyle = '#558b2f'; ctx.beginPath(); ctx.arc(0, 0, z.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff1744'; ctx.fillRect(3, -3, 3, 2); ctx.fillRect(3, 1, 3, 2);
                ctx.restore();
            }

            // 7. ИГРОК
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#1565c0'; ctx.fillRect(-10, -8, 14, 16);
            ctx.fillStyle = '#ffcc80'; ctx.beginPath(); ctx.arc(-1, 0, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#212121'; ctx.fillRect(4, 3, 12, 4);
            ctx.restore();

            ctx.restore();

            // 8. МИНИКАРТА
            if (gameState === 'PLAYING') {
                const mapSize = 100;
                const mapX = canvas.width - mapSize - 15;
                const mapY = 15;
                const scale = mapSize / WORLD.width;

                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(mapX, mapY, mapSize, mapSize);
                ctx.strokeStyle = '#ff9800'; ctx.strokeRect(mapX, mapY, mapSize, mapSize);

                ctx.fillStyle = '#00e676';
                ctx.beginPath(); ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // ДЖОЙСТИКИ
                [moveJoystick, aimJoystick].forEach(j => {
                    if (j.active) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(j.baseX, j.baseY, 50, 0, Math.PI * 2); ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.beginPath(); ctx.arc(j.baseX + j.dx * 50, j.baseY + j.dy * 50, 20, 0, Math.PI * 2); ctx.fill();
                    }
                });
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
