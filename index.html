<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival: Open World & Inventory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050705; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Оверлеи */
        .ui-panel {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 24, 30, 0.95);
            border: 2px solid #455a64;
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            width: 90%;
            max-width: 400px;
        }

        .ui-header { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #37474f; padding-bottom: 10px; color: #ffb74d; }
        
        .item-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-action {
            background: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .btn-action:active { background: #1b5e20; }
        .btn-close {
            margin-top: 15px; width: 100%; background: #c62828; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* Главное меню */
        #mainMenu {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a237e 0%, #050705 100%); z-index: 200;
        }
        #mainMenu h1 { font-size: 36px; color: #ff3d00; text-shadow: 0 0 15px rgba(255,61,0,0.6); margin-bottom: 30px; text-align: center; }
        .menu-btn {
            width: 220px; padding: 15px; margin: 10px; background: #37474f; color: #fff;
            border: 2px solid #b0bec5; border-radius: 25px; font-size: 18px; font-weight: bold; text-align: center; cursor: pointer;
        }
        .menu-btn:active { background: #eceff1; color: #000; }

        /* Игровые кнопки HUD */
        #hudButtons { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 50; }
        .hud-btn {
            background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid #fff;
            padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="mainMenu">
        <h1>ZOMBIE SURVIVAL</h1>
        <div class="menu-btn" onclick="startGame()">ИГРАТЬ</div>
        <div class="menu-btn" onclick="alert('Управление:\nWASD или Джойстик - Движение\nE / Кнопки на экране - Инвентарь и Лутание')">ИНСТРУКЦИЯ</div>
    </div>

    <div id="hudButtons" style="display: none;">
        <button class="hud-btn" onclick="openInventory()">🎒 Инвентарь</button>
    </div>

    <div id="lootMenu" class="ui-panel">
        <div class="ui-header">📦 Содержимое тайника</div>
        <div id="lootList" class="item-list"></div>
        <button class="btn-close" onclick="closeLootMenu()">Закрыть</button>
    </div>

    <div id="inventoryMenu" class="ui-panel">
        <div class="ui-header">🎒 Инвентарь выжившего</div>
        <div id="inventoryStats" style="margin-bottom: 10px; font-size: 14px; color: #b0bec5;"></div>
        <div id="inventoryList" class="item-list"></div>
        <button class="btn-close" onclick="closeInventory()">Закрыть</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const WORLD = { width: 3200, height: 3200 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // База данных предметов
        const ITEMS = {
            pistol: { name: 'Пистолет', type: 'weapon', fireRate: 300, damage: 1.5, speed: 750, count: 1, spread: 0.05, ammoType: '9mm' },
            shotgun: { name: 'Дробовик', type: 'weapon', fireRate: 800, damage: 1.2, speed: 650, count: 6, spread: 0.3, ammoType: '12cal' },
            rifle: { name: 'Автомат', type: 'weapon', fireRate: 110, damage: 1.1, speed: 850, count: 1, spread: 0.12, ammoType: '5.56mm' },
            sniper: { name: 'Снайперка', type: 'weapon', fireRate: 1200, damage: 5.0, speed: 1200, count: 1, spread: 0.01, ammoType: '7.62mm' },
            
            ammo_9mm: { name: 'Патроны 9mm (+30)', type: 'ammo', ammoKey: '9mm', count: 30 },
            ammo_12cal: { name: 'Патроны 12cal (+12)', type: 'ammo', ammoKey: '12cal', count: 12 },
            ammo_556mm: { name: 'Патроны 5.56mm (+45)', type: 'ammo', ammoKey: '5.56mm', count: 45 },

            light_armor: { name: 'Легкий бронежилет', type: 'armor', armorVal: 25 },
            heavy_armor: { name: 'Тяжелая броня', type: 'armor', armorVal: 50 },
            jacket: { name: 'Куртка выжившего', type: 'clothes', speedBuff: 1.15 }
        };

        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playShoot() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.08, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                noise.connect(gain); gain.connect(this.ctx.destination);
                noise.start(t);
            }
        };

        let gameState = 'MENU';
        let score = 0;
        let lastShot = 0;
        let activeCrate = null;

        const player = {
            x: WORLD.width / 2,
            y: WORLD.height / 2,
            radius: 14,
            hp: 100, maxHp: 100,
            armor: 0,
            baseSpeed: 190, speedMultiplier: 1.0,
            angle: 0,
            currentWeapon: 'pistol',
            equippedArmor: null,
            equippedClothes: null,
            ammo: { '9mm': 90, '12cal': 24, '5.56mm': 60, '7.62mm': 10 },
            inventory: ['pistol']
        };

        const camera = { x: 0, y: 0 };
        let zombies = [];
        let bullets = [];
        let environment = { trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [] };
        const joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };

        function generateBuilding(x, y, w, h) {
            const wallThick = 12;
            const doorSize = 54;
            const doorX = x + w / 2 - doorSize / 2;

            environment.buildings.push({ x, y, w, h, inside: false });

            // Стены
            environment.walls.push({ x, y: y + h - wallThick, w: w / 2 - doorSize / 2, h: wallThick, bId: environment.buildings.length - 1 });
            environment.walls.push({ x: doorX + doorSize, y: y + h - wallThick, w: w / 2 - doorSize / 2, h: wallThick, bId: environment.buildings.length - 1 });
            environment.walls.push({ x, y, w, h: wallThick, bId: environment.buildings.length - 1 });
            environment.walls.push({ x, y, w: wallThick, h, bId: environment.buildings.length - 1 });
            environment.walls.push({ x: x + w - wallThick, y, w: wallThick, h, bId: environment.buildings.length - 1 });

            // Мебель внутри
            const bId = environment.buildings.length - 1;
            environment.furniture.push({ x: x + w / 2 - 20, y: y + h / 2 - 15, w: 40, h: 30, type: 'table', bId });
            environment.furniture.push({ x: x + 20, y: y + 20, w: 35, h: 50, type: 'bed', bId });

            // Тайник в здании с несколькими предметами
            const pool = ['shotgun', 'rifle', 'sniper', 'ammo_9mm', 'ammo_12cal', 'ammo_556mm', 'light_armor', 'heavy_armor', 'jacket'];
            let loot = [];
            let count = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < count; i++) {
                loot.push(pool[Math.floor(Math.random() * pool.length)]);
            }

            environment.crates.push({
                x: x + w - 45, y: y + h - 45, w: 26, h: 26,
                items: loot, bId
            });
        }

        function generateMap() {
            environment = { trees: [], rocks: [], buildings: [], walls: [], furniture: [], crates: [] };
            zombies = [];

            for (let i = 0; i < 10; i++) {
                let w = 220, h = 220;
                let x = Math.random() * (WORLD.width - w - 400) + 200;
                let y = Math.random() * (WORLD.height - h - 400) + 200;
                if (Math.hypot(x + w/2 - player.x, y + h/2 - player.y) > 350) {
                    generateBuilding(x, y, w, h);
                }
            }

            for (let i = 0; i < 40; i++) {
                environment.rocks.push({ x: Math.random() * WORLD.width, y: Math.random() * WORLD.height, radius: 14 });
            }
            for (let i = 0; i < 80; i++) {
                environment.trees.push({ x: Math.random() * WORLD.width, y: Math.random() * WORLD.height, radius: 25 });
            }
            for (let i = 0; i < 45; i++) {
                let x = Math.random() * WORLD.width, y = Math.random() * WORLD.height;
                if (Math.hypot(x - player.x, y - player.y) > 400) {
                    zombies.push({ x, y, radius: 15, hp: 4, speed: 75, alerted: false });
                }
            }
        }

        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('hudButtons').style.display = 'flex';
            gameState = 'PLAYING';
            resetGame();
        }

        function resetGame() {
            player.x = WORLD.width / 2;
            player.y = WORLD.height / 2;
            player.hp = 100; player.armor = 0;
            player.currentWeapon = 'pistol';
            player.inventory = ['pistol'];
            score = 0;
            generateMap();
        }

        // --- ЛУТАНИЕ И ИНВЕНТАРЬ ---
        function openLootMenu(crate) {
            activeCrate = crate;
            const list = document.getElementById('lootList');
            list.innerHTML = '';
            
            if (crate.items.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 10px;">Ящик пуст</div>';
            } else {
                crate.items.forEach((itemKey, idx) => {
                    const item = ITEMS[itemKey];
                    const div = document.createElement('div');
                    div.className = 'item-card';
                    div.innerHTML = `<span>${item.name}</span><button class="btn-action" onclick="takeLoot(${idx})">Забрать</button>`;
                    list.appendChild(div);
                });
            }
            document.getElementById('lootMenu').style.display = 'block';
        }

        function closeLootMenu() { document.getElementById('lootMenu').style.display = 'none'; activeCrate = null; }

        function takeLoot(index) {
            if (!activeCrate) return;
            const itemKey = activeCrate.items[index];
            const item = ITEMS[itemKey];

            if (item.type === 'ammo') {
                player.ammo[item.ammoKey] = (player.ammo[item.ammoKey] || 0) + item.count;
            } else {
                player.inventory.push(itemKey);
            }

            activeCrate.items.splice(index, 1);
            openLootMenu(activeCrate);
        }

        function openInventory() {
            const list = document.getElementById('inventoryList');
            const stats = document.getElementById('inventoryStats');
            list.innerHTML = '';

            const curWpn = ITEMS[player.currentWeapon];
            stats.innerHTML = `Здоровье: ${Math.round(player.hp)} | Броня: ${player.armor}<br>Патроны (${curWpn.ammoType}): ${player.ammo[curWpn.ammoType] || 0}`;

            player.inventory.forEach((itemKey, idx) => {
                const item = ITEMS[itemKey];
                const div = document.createElement('div');
                div.className = 'item-card';
                
                let btnText = 'Использовать';
                if (item.type === 'weapon') btnText = player.currentWeapon === itemKey ? 'Экипировано' : 'Вооружить';
                
                div.innerHTML = `<span>${item.name}</span><button class="btn-action" onclick="useInventoryItem('${itemKey}')">${btnText}</button>`;
                list.appendChild(div);
            });
            document.getElementById('inventoryMenu').style.display = 'block';
        }

        function closeInventory() { document.getElementById('inventoryMenu').style.display = 'none'; }

        function useInventoryItem(itemKey) {
            const item = ITEMS[itemKey];
            if (item.type === 'weapon') player.currentWeapon = itemKey;
            if (item.type === 'armor') { player.armor = item.armorVal; player.equippedArmor = item.name; }
            if (item.type === 'clothes') { player.speedMultiplier = item.speedBuff; player.equippedClothes = item.name; }
            openInventory();
        }

        // --- ФИЗИКА И ДВИЖЕНИЕ ---
        function checkCircleRectCollision(circle, rect) {
            let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
            let distX = circle.x - closestX, distY = circle.y - closestY;
            let distance = Math.hypot(distX, distY);
            if (distance < circle.radius) {
                let overlap = circle.radius - distance;
                return { hit: true, nx: (distX / distance) || 1, ny: (distY / distance) || 0, overlap };
            }
            return { hit: false };
        }

        function resolveCollisions(entity) {
            for (let wall of environment.walls) {
                let res = checkCircleRectCollision(entity, wall);
                if (res.hit) { entity.x += res.nx * res.overlap; entity.y += res.ny * res.overlap; }
            }
            for (let item of environment.furniture) {
                let res = checkCircleRectCollision(entity, item);
                if (res.hit) { entity.x += res.nx * res.overlap; entity.y += res.ny * res.overlap; }
            }
        }

        // Ввод
        const keys = {};
        window.addEventListener('keydown', e => {
            Sound.init(); keys[e.key] = true;
            if (e.key === 'e' || e.key === 'E') {
                if (activeCrate) openLootMenu(activeCrate);
            }
            if (e.key === 'i' || e.key === 'I') openInventory();
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        window.addEventListener('touchstart', e => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-panel')) return;
            Sound.init();
            let touch = e.changedTouches[0];
            joystick.active = true; joystick.touchId = touch.identifier;
            joystick.baseX = touch.clientX; joystick.baseY = touch.clientY;
            joystick.dx = 0; joystick.dy = 0;
        });
        window.addEventListener('touchmove', e => {
            if (!joystick.active) return;
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) {
                    let dx = touch.clientX - joystick.baseX, dy = touch.clientY - joystick.baseY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 50;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystick.dx = dx / maxDist; joystick.dy = dy / maxDist;
                }
            }
        });
        window.addEventListener('touchend', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; });

        function shoot() {
            const wpn = ITEMS[player.currentWeapon];
            if ((player.ammo[wpn.ammoType] || 0) <= 0) return;

            let nearest = null, minDist = 380;
            for (let z of zombies) {
                let d = Math.hypot(z.x - player.x, z.y - player.y);
                if (d < minDist) { minDist = d; nearest = z; }
            }

            if (nearest) {
                player.ammo[wpn.ammoType]--;
                let baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                player.angle = baseAngle;

                for (let i = 0; i < wpn.count; i++) {
                    let finalAngle = baseAngle + (Math.random() - 0.5) * wpn.spread;
                    bullets.push({
                        x: player.x, y: player.y,
                        vx: Math.cos(finalAngle) * wpn.speed, vy: Math.sin(finalAngle) * wpn.speed,
                        damage: wpn.damage
                    });
                }
                Sound.playShoot();
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        let lastTime = performance.now();

        function update(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = now;

            if (gameState === 'PLAYING') {
                let moveX = joystick.dx, moveY = joystick.dy;
                if (keys['w'] || keys['W']) moveY = -1;
                if (keys['s'] || keys['S']) moveY = 1;
                if (keys['a'] || keys['A']) moveX = -1;
                if (keys['d'] || keys['D']) moveX = 1;

                let len = Math.hypot(moveX, moveY);
                if (len > 1) { moveX /= len; moveY /= len; }

                player.x += moveX * player.baseSpeed * player.speedMultiplier * dt;
                player.y += moveY * player.baseSpeed * player.speedMultiplier * dt;
                resolveCollisions(player);

                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                // Проверка: находится ли игрок внутри зданий
                environment.buildings.forEach(b => {
                    b.inside = (player.x >= b.x && player.x <= b.x + b.w && player.y >= b.y && player.y <= b.y + b.h);
                });

                // Проверка тайников рядом
                activeCrate = null;
                for (let c of environment.crates) {
                    if (Math.hypot(player.x - (c.x + c.w/2), player.y - (c.y + c.h/2)) < 40) {
                        activeCrate = c;
                        break;
                    }
                }

                const wpn = ITEMS[player.currentWeapon];
                if (now - lastShot > wpn.fireRate) {
                    shoot();
                    lastShot = now;
                }

                // Логика Зомби
                for (let z of zombies) {
                    let dist = Math.hypot(player.x - z.x, player.y - z.y);
                    if (dist < 250) z.alerted = true;
                    if (z.alerted) {
                        let angle = Math.atan2(player.y - z.y, player.x - z.x);
                        z.x += Math.cos(angle) * z.speed * dt;
                        z.y += Math.sin(angle) * z.speed * dt;
                        resolveCollisions(z);

                        if (dist < player.radius + z.radius) {
                            let dmg = 15 * dt;
                            if (player.armor > 0) {
                                player.armor -= dmg;
                                if (player.armor < 0) { player.hp += player.armor; player.armor = 0; }
                            } else {
                                player.hp -= dmg;
                            }
                            if (player.hp <= 0) gameState = 'GAMEOVER';
                        }
                    }
                }

                // Пули
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx * dt; b.y += b.vy * dt;
                    for (let z of zombies) {
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
                            z.hp -= b.damage; z.alerted = true;
                            bullets.splice(i, 1);
                            if (z.hp <= 0) zombies.splice(zombies.indexOf(z), 1);
                            break;
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ГРАФИКА И ОТРЕСОВКА ---
        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#27441e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(-camera.x, -camera.y);

            // 1. Здания (Пол)
            for (let b of environment.buildings) {
                ctx.fillStyle = '#3a2e2b';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }

            // 2. Мебель и Тайники (Видны ТОЛЬКО внутри здания)
            for (let b of environment.buildings) {
                if (b.inside) {
                    // Мебель
                    for (let f of environment.furniture.filter(item => item.bId === environment.buildings.indexOf(b))) {
                        ctx.fillStyle = f.type === 'table' ? '#5d4037' : '#1565c0';
                        ctx.fillRect(f.x, f.y, f.w, f.h);
                    }
                    // Тайники
                    for (let c of environment.crates.filter(item => item.bId === environment.buildings.indexOf(b))) {
                        ctx.fillStyle = '#f57c00';
                        ctx.fillRect(c.x, c.y, c.w, c.h);
                    }
                }
            }

            // 3. Стены / Крыши
            for (let i = 0; i < environment.buildings.length; i++) {
                let b = environment.buildings[i];
                if (!b.inside) {
                    // Крыша скрывает интерьер снаружи
                    ctx.fillStyle = '#424242';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#212121';
                    ctx.fillRect(b.x + 10, b.y + 10, b.w - 20, b.h - 20);
                } else {
                    // Рисуем только стены, если игрок внутри
                    ctx.fillStyle = '#616161';
                    for (let w of environment.walls.filter(wall => wall.bId === i)) {
                        ctx.fillRect(w.x, w.y, w.w, w.h);
                    }
                }
            }

            // Окружение
            ctx.fillStyle = '#5a6266';
            for (let r of environment.rocks) { ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.fill(); }

            // Пули
            ctx.fillStyle = '#fff566';
            for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }

            // Зомби
            for (let z of zombies) {
                ctx.save(); ctx.translate(z.x, z.y);
                ctx.rotate(Math.atan2(player.y - z.y, player.x - z.x));
                ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(0, 0, z.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // Персонаж
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = player.equippedArmor ? '#78909c' : '#1565c0';
            ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e0a96d';
            ctx.beginPath(); ctx.arc(-2, 0, 6, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // Деревья (Кроны)
            for (let t of environment.trees) {
                ctx.fillStyle = '#1b3811';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();

            // HUD Статусы
            if (gameState === 'PLAYING') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(15, 15, 170, 40);
                ctx.fillStyle = '#4caf50'; ctx.fillRect(20, 20, (player.hp / player.maxHp) * 160, 12);
                ctx.fillStyle = '#00bcd4'; ctx.fillRect(20, 36, (player.armor / 50) * 160, 8);

                if (activeCrate) {
                    ctx.fillStyle = '#ffb74d'; ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('Нажмите [E] или «Инвентарь» чтобы обыскать', canvas.width / 2 - 160, canvas.height - 80);
                }
            }

            // Джойстик
            if (joystick.active) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, 50, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath(); ctx.arc(joystick.baseX + joystick.dx * 50, joystick.baseY + joystick.dy * 50, 20, 0, Math.PI * 2); ctx.fill();
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
