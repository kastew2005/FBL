<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Craft Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Предупреждение о портретной ориентации */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            color: #fff;
            z-index: 999;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; }
        }
        /* Прицел */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            margin-top: -5px; margin-left: -5px;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Элементы управления (UI) */
        .touch-zone {
            position: absolute;
            bottom: 20px;
            z-index: 20;
        }
        #joystick-container {
            left: 20px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
        }
        #joystick-stick {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 35px; left: 35px;
        }
        #action-buttons {
            right: 20px;
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 65px; height: 65px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="orientation-warning">Пожалуйста, поверните устройство в альбомный режим 🔄</div>
    <div id="crosshair"></div>
    <div id="game-container"></div>

    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <div id="action-buttons" class="touch-zone">
        <div class="btn" id="btn-destroy">ЛОМАТЬ</div>
        <div class="btn" id="btn-build">СТРОИТЬ</div>
        <div class="btn" id="btn-jump">ПРЫЖОК</div>
    </div>

    <script>
        // --- Настройка сцены Three.js ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Цвет неба
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Освобождение и свет ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- Текстуры блоков (упрощенная процедурная генерация) ---

            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, 64, 4); ctx.fillRect(0, 0, 4, 64);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(0, 60, 64, 4); ctx.fillRect(60, 0, 4, 64);
            return new THREE.CanvasTexture(canvas);
