<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Деревня: Эпоха Процветания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #gameCanvas {
            display: block;
            background: #2d5a27;
            cursor: pointer;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .panel {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #8b6914;
            border-radius: 10px;
            padding: 10px;
            pointer-events: auto;
            color: #fff;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .top-bar {
            position: fixed;
            top: 5px;
            left: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            pointer-events: none;
            flex-wrap: wrap;
        }
        
        .resource {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 12px;
            color: #fff;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .resource-icon {
            font-size: 14px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
            transition: all 0.3s;
            pointer-events: auto;
            min-height: 40px;
            touch-action: manipulation;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            min-height: 30px;
        }
        
        .btn-close {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            pointer-events: auto;
        }
        
        .building-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .worker-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 8px;
            margin: 3px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #8b6914;
            border-radius: 15px;
            padding: 20px;
            color: #fff;
            z-index: 100;
            pointer-events: auto;
            min-width: 280px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            pointer-events: auto;
        }
        
        .hidden {
            display: none !important;
        }
        
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
            text-align: center;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-bar {
            background: #333;
            border-radius: 10px;
            height: 20px;
            position: relative;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }
        
        .stat-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        
        .mini-map {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 10px;
            pointer-events: auto;
            image-rendering: pixelated;
        }
        
        @media (max-width: 768px) {
            .resource {
                font-size: 10px;
                padding: 2px 5px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                min-height: 35px;
            }
            
            .title {
                font-size: 16px;
            }
            
            .mini-map {
                width: 80px;
                height: 80px;
                bottom: 5px;
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="top-bar" id="resources">
        <div class="resource">
            <span class="resource-icon">🌾</span>
            <span id="food">0</span>
        </div>
        <div class="resource">
            <span class="resource-icon">🪵</span>
            <span id="wood">0</span>
        </div>
        <div class="resource">
            <span class="resource-icon">🪨</span>
            <span id="stone">0</span>
        </div>
        <div class="resource">
            <span class="resource-icon">💰</span>
            <span id="gold">0</span>
        </div>
        <div class="resource">
            <span class="resource-icon">👥</span>
            <span id="population">0/5</span>
        </div>
    </div>
    
    <div class="mini-map" id="miniMap"></div>
    
    <button class="btn" style="position: fixed; bottom: 10px; left: 10px;" onclick="toggleBuildMenu()">
        🏗️ Строить
    </button>
    
    <button class="btn" style="position: fixed; bottom: 10px; left: 120px;" onclick="toggleWorkersMenu()">
        👥 Рабочие
    </button>
    
    <button class="btn" style="position: fixed; bottom: 60px; left: 10px;" onclick="toggleShopMenu()">
        🛒 Магазин
    </button>
    
    <div id="buildMenu" class="panel hidden" style="bottom: 100px; left: 10px; right: 10px;">
        <button class="btn-close" onclick="toggleBuildMenu()">×</button>
        <div class="title">🏗️ Строительство</div>
        <div id="buildingsList"></div>
    </div>
    
    <div id="workersMenu" class="panel hidden" style="bottom: 100px; left: 10px; right: 10px;">
        <button class="btn-close" onclick="toggleWorkersMenu()">×</button>
        <div class="title">👥 Управление рабочими</div>
        <div id="workersList"></div>
    </div>
    
    <div id="shopMenu" class="panel hidden" style="bottom: 100px; left: 10px; right: 10px;">
        <button class="btn-close" onclick="toggleShopMenu()">×</button>
        <div class="title">🛒 Магазин улучшений</div>
        <div id="shopList"></div>
    </div>
    
    <div id="buildingInfo" class="modal hidden">
        <div class="title" id="buildingInfoTitle"></div>
        <div id="buildingInfoContent"></div>
        <button class="btn" onclick="closeBuildingInfo()">Закрыть</button>
    </div>
    
    <div id="questModal" class="modal hidden">
        <div class="title">📜 Новое задание!</div>
        <div id="questContent"></div>
        <button class="btn" onclick="acceptQuest()">Принять</button>
        <button class="btn" onclick="declineQuest()">Отклонить</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Адаптация размера канваса
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Состояние игры
        const gameState = {
            resources: {
                food: 50,
                wood: 30,
                stone: 10,
                gold: 20
            },
            population: 3,
            maxPopulation: 5,
            villagers: [],
            buildings: [],
            tiles: [],
            selectedVillager: null,
            selectedBuilding: null,
            camera: { x: 0, y: 0 },
            worldSize: 100,
            tileSize: 32,
            day: 1,
            time: 0,
            quests: [],
            activeQuests: [],
            weather: 'sunny',
            season: 'spring',
            achievements: []
        };
        
        // Типы тайлов
        const TILE_TYPES = {
            GRASS: 'grass',
            FOREST: 'forest',
            STONE: 'stone',
            WATER: 'water',
            FARM: 'farm',
            HOUSE: 'house',
            ROAD: 'road'
        };
        
        // Типы зданий
        const BUILDING_TYPES = {
            HOUSE: {
                name: 'Дом',
                cost: { wood: 15, stone: 5 },
                description: 'Увеличивает население на 2',
                size: 2,
                color: '#8B4513',
                emoji: '🏠'
            },
            FARM: {
                name: 'Ферма',
                cost: { wood: 10, gold: 5 },
                description: 'Производит еду',
                size: 2,
                color: '#228B22',
                emoji: '🌾'
            },
            LUMBER_MILL: {
                name: 'Лесопилка',
                cost: { wood: 20, stone: 10 },
                description: 'Ускоряет добычу дерева',
                size: 2,
                color: '#654321',
                emoji: '🪚'
            },
            QUARRY: {
                name: 'Каменоломня',
                cost: { wood: 15, stone: 15 },
                description: 'Ускоряет добычу камня',
                size: 2,
                color: '#808080',
                emoji: '⛏️'
            },
            MARKET: {
                name: 'Рынок',
                cost: { wood: 20, gold: 20 },
                description: 'Увеличивает доход золота',
                size: 3,
                color: '#FFD700',
                emoji: '🏪'
            }
        };
        
        // Типы работ
        const JOB_TYPES = {
            IDLE: { name: 'Без работы', emoji: '😴', color: '#808080' },
            WOODCUTTER: { name: 'Лесоруб', emoji: '🪓', color: '#8B4513' },
            MINER: { name: 'Шахтёр', emoji: '⛏️', color: '#696969' },
            FISHER: { name: 'Рыбак', emoji: '🎣', color: '#4169E1' },
            FARMER: { name: 'Фермер', emoji: '🌾', color: '#228B22' },
            BUILDER: { name: 'Строитель', emoji: '🔨', color: '#D2691E' }
        };
        
        // Генерация мира
        function generateWorld() {
            gameState.tiles = [];
            for (let x = 0; x < gameState.worldSize; x++) {
                gameState.tiles[x] = [];
                for (let y = 0; y < gameState.worldSize; y++) {
                    let type = TILE_TYPES.GRASS;
                    const noise = Math.random();
                    
                    if (noise < 0.3) {
                        type = TILE_TYPES.FOREST;
                    } else if (noise < 0.35) {
                        type = TILE_TYPES.STONE;
                    } else if (noise < 0.4) {
                        type = TILE_TYPES.WATER;
                    }
                    
                    gameState.tiles[x][y] = {
                        type: type,
                        building: null,
                        resource: noise < 0.3 ? 'tree' : noise < 0.35 ? 'stone' : null
                    };
                }
            }
            
            // Размещаем стартовые здания
            const centerX = Math.floor(gameState.worldSize / 2);
            const centerY = Math.floor(gameState.worldSize / 2);
            
            for (let i = 0; i < 2; i++) {
                addBuilding(BUILDING_TYPES.HOUSE, centerX + i * 3, centerY);
            }
            addBuilding(BUILDING_TYPES.FARM, centerX, centerY + 3);
            
            // Создаём стартовых жителей
            for (let i = 0; i < gameState.population; i++) {
                gameState.villagers.push({
                    id: i,
                    name: `Житель ${i + 1}`,
                    job: JOB_TYPES.IDLE,
                    x: centerX * gameState.tileSize + Math.random() * 100,
                    y: centerY * gameState.tileSize + Math.random() * 100,
                    health: 100,
                    energy: 100,
                    happiness: 70,
                    inventory: { wood: 0, stone: 0, food: 0 }
                });
            }
            
            gameState.camera.x = centerX * gameState.tileSize - canvas.width / 2;
            gameState.camera.y = centerY * gameState.tileSize - canvas.height / 2;
        }
        
        function addBuilding(type, x, y) {
            const building = {
                type: type,
                x: x,
                y: y,
                level: 1,
                workers: [],
                production: 0
            };
            
            for (let dx = 0; dx < type.size; dx++) {
                for (let dy = 0; dy < type.size; dy++) {
                    gameState.tiles[x + dx][y + dy].building = building;
                }
            }
            
            gameState.buildings.push(building);
            
            if (type === BUILDING_TYPES.HOUSE) {
                gameState.maxPopulation += 2;
            }
            
            return building;
        }
        
        // Управление рабочими
        function assignJob(villagerId, jobType) {
            const villager = gameState.villagers.find(v => v.id === villagerId);
            if (villager) {
                villager.job = jobType;
                updateUI();
            }
        }
        
        // Производство ресурсов
        function updateProduction() {
            gameState.villagers.forEach(villager => {
                switch (villager.job.name) {
                    case 'Лесоруб':
                        if (villager.energy > 0) {
                            villager.inventory.wood += 2;
                            villager.energy -= 5;
                            villager.happiness -= 1;
                        }
                        break;
                    case 'Шахтёр':
                        if (villager.energy > 0) {
                            villager.inventory.stone += 1;
                            villager.energy -= 8;
                            villager.happiness -= 1;
                        }
                        break;
                    case 'Фермер':
                        if (villager.energy > 0) {
                            villager.inventory.food += 3;
                            villager.energy -= 6;
                        }
                        break;
                    case 'Рыбак':
                        if (villager.energy > 0) {
                            villager.inventory.food += 2;
                            villager.energy -= 4;
                            villager.happiness += 2;
                        }
                        break;
                }
                
                // Восстановление энергии
                if (villager.job.name === 'Без работы') {
                    villager.energy = Math.min(100, villager.energy + 5);
                    villager.happiness = Math.min(100, villager.happiness + 3);
                }
                
                // Сбор ресурсов в общий пул
                if (villager.inventory.wood > 0) {
                    gameState.resources.wood += villager.inventory.wood;
                    villager.inventory.wood = 0;
                }
                if (villager.inventory.stone > 0) {
                    gameState.resources.stone += villager.inventory.stone;
                    villager.inventory.stone = 0;
                }
                if (villager.inventory.food > 0) {
                    gameState.resources.food += villager.inventory.food;
                    villager.inventory.food = 0;
                }
            });
            
            // Потребление еды
            const foodConsumption = gameState.population * 1;
            gameState.resources.food -= foodConsumption;
            if (gameState.resources.food < 0) {
                gameState.resources.food = 0;
                gameState.villagers.forEach(v => v.health -= 5);
            }
            
            // Генерация золота от рынков
            const markets = gameState.buildings.filter(b => b.type === BUILDING_TYPES.MARKET);
            gameState.resources.gold += markets.length * 5;
        }
        
        // Квесты
        function generateQuest() {
            const quests = [
                {
                    title: 'Сбор древесины',
                    description: 'Соберите 50 единиц дерева',
                    requirement: { wood: 50 },
                    reward: { gold: 30, food: 10 },
                    duration: 60
                },
                {
                    title: 'Каменный запас',
                    description: 'Добудьте 30 единиц камня',
                    requirement: { stone: 30 },
                    reward: { gold: 40, wood: 10 },
                    duration: 50
                },
                {
                    title: 'Продовольствие',
                    description: 'Произведите 40 единиц еды',
                    requirement: { food: 40 },
                    reward: { gold: 25, wood: 15 },
                    duration: 45
                },
                {
                    title: 'Строительный бум',
                    description: 'Постройте 3 новых здания',
                    requirement: { buildings: 3 },
                    reward: { gold: 100, wood: 30, stone: 20 },
                    duration: 90
                }
            ];
            
            const quest = quests[Math.floor(Math.random() * quests.length)];
            gameState.activeQuests.push({
                ...quest,
                progress: 0,
                startTime: gameState.time
            });
            
            showQuestModal(quest);
        }
        
        // UI функции
        function updateUI() {
            document.getElementById('food').textContent = Math.floor(gameState.resources.food);
            document.getElementById('wood').textContent = Math.floor(gameState.resources.wood);
            document.getElementById('stone').textContent = Math.floor(gameState.resources.stone);
            document.getElementById('gold').textContent = Math.floor(gameState.resources.gold);
            document.getElementById('population').textContent = `${gameState.population}/${gameState.maxPopulation}`;
        }
        
        function toggleBuildMenu() {
            const menu = document.getElementById('buildMenu');
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                updateBuildingsList();
            }
        }
        
        function toggleWorkersMenu() {
            const menu = document.getElementById('workersMenu');
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                updateWorkersList();
            }
        }
        
        function toggleShopMenu() {
            const menu = document.getElementById('shopMenu');
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                updateShopList();
            }
        }
        
        function updateBuildingsList() {
            const list = document.getElementById('buildingsList');
            list.innerHTML = '';
            
            Object.values(BUILDING_TYPES).forEach(type => {
                const canAfford = Object.entries(type.cost).every(([resource, amount]) => 
                    gameState.resources[resource] >= amount
                );
                
                const item = document.createElement('div');
                item.className = 'building-item';
                item.innerHTML = `
                    <div>
                        <strong>${type.emoji} ${type.name}</strong><br>
                        <small>${type.description}</small><br>
                        <small>Стоимость: ${formatCost(type.cost)}</small>
                    </div>
                    <button class="btn btn-small" ${canAfford ? '' : 'style="opacity:0.5"'} 
                        onclick="buildBuilding('${type.name}')">
                        Построить
                    </button>
                `;
                list.appendChild(item);
            });
        }
        
        function updateWorkersList() {
            const list = document.getElementById('workersList');
            list.innerHTML = '';
            
            gameState.villagers.forEach(villager => {
                const item = document.createElement('div');
                item.className = 'worker-item';
                item.innerHTML = `
                    <div>
                        <strong>${villager.name}</strong><br>
                        <small>Работа: ${villager.job.emoji} ${villager.job.name}</small><br>
                        <small>Энергия: ${villager.energy}% | Счастье: ${villager.happiness}%</small>
                    </div>
                    <select onchange="assignJob(${villager.id}, JOB_TYPES[this.value])">
                        ${Object.entries(JOB_TYPES).map(([key, job]) => 
                            `<option value="${key}" ${villager.job.name === job.name ? 'selected' : ''}>
                                ${job.emoji} ${job.name}
                            </option>`
                        ).join('')}
                    </select>
                `;
                list.appendChild(item);
            });
        }
        
        function updateShopList() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';
            
            const upgrades = [
                { name: 'Улучшить дома', description: '+2 к населению для всех домов', cost: { gold: 50, wood: 20 }, effect: () => { gameState.maxPopulation += 5; } },
                { name: 'Эффективные инструменты', description: '+50% к добыче ресурсов', cost: { gold: 80, stone: 30 }, effect: () => { /* Добавить множитель */ } },
                { name: 'Праздник урожая', description: '+20 к счастью всех жителей', cost: { gold: 30, food: 50 }, effect: () => { gameState.villagers.forEach(v => v.happiness = Math.min(100, v.happiness + 20)); } },
                { name: 'Нанять жителя', description: '+1 житель', cost: { gold: 40, food: 20 }, effect: () => { hireVillager(); } }
            ];
            
            upgrades.forEach(upgrade => {
                const canAfford = Object.entries(upgrade.cost).every(([resource, amount]) => 
                    gameState.resources[resource] >= amount
                );
                
                const item = document.createElement('div');
                item.className = 'building-item';
                item.innerHTML = `
                    <div>
                        <strong>${upgrade.name}</strong><br>
                        <small>${upgrade.description}</small><br>
                        <small>Стоимость: ${formatCost(upgrade.cost)}</small>
                    </div>
                    <button class="btn btn-small" ${canAfford ? '' : 'style="opacity:0.5"'} 
                        onclick="buyUpgrade(${upgrades.indexOf(upgrade)})">
                        Купить
                    </button>
                `;
                list.appendChild(item);
            });
        }
        
        function formatCost(cost) {
            return Object.entries(cost).map(([resource, amount]) => 
                `${getEmoji(resource)}${amount}`
            ).join(' ');
        }
        
        function getEmoji(resource) {
            const emojis = { wood: '🪵', stone: '🪨', gold: '💰', food: '🌾' };
            return emojis[resource] || '📦';
        }
        
        function buildBuilding(typeName) {
            const type = Object.values(BUILDING_TYPES).find(t => t.name === typeName);
            if (!type) return;
            
            const canAfford = Object.entries(type.cost).every(([resource, amount]) => 
                gameState.resources[resource] >= amount
            );
            
            if (!canAfford) return;
            
            // Вычитаем ресурсы
            Object.entries(type.cost).forEach(([resource, amount]) => {
                gameState.resources[resource] -= amount;
            });
            
            // Находим место для строительства
            const centerX = Math.floor(gameState.camera.x / gameState.tileSize) + Math.floor(canvas.width / gameState.tileSize / 2);
            const centerY = Math.floor(gameState.camera.y / gameState.tileSize) + Math.floor(canvas.height / gameState.tileSize / 2);
            
            // Ищем свободное место
            let placed = false;
            for (let radius = 0; radius < 20 && !placed; radius++) {
                for (let angle = 0; angle < Math.PI * 2 && !placed; angle += 0.5) {
                    const x = Math.floor(centerX + Math.cos(angle) * radius);
                    const y = Math.floor(centerY + Math.sin(angle) * radius);
                    
                    if (x > 0 && y > 0 && x + type.size < gameState.worldSize && y + type.size < gameState.worldSize) {
                        let canPlace = true;
                        for (let dx = 0; dx < type.size; dx++) {
                            for (let dy = 0; dy < type.size; dy++) {
                                if (gameState.tiles[x + dx][y + dy].building) {
                                    canPlace = false;
                                    break;
                                }
                            }
                            if (!canPlace) break;
                        }
                        
                        if (canPlace) {
                            addBuilding(type, x, y);
                            placed = true;
                        }
                    }
                }
            }
            
            updateUI();
            updateBuildingsList();
        }
        
        function hireVillager() {
            if (gameState.population >= gameState.maxPopulation) {
                alert('Достигнут лимит населения! Постройте больше домов.');
                return;
            }
            
            const cost = { gold: 40, food: 20 };
            const canAfford = Object.entries(cost).every(([resource, amount]) => 
                gameState.resources[resource] >= amount
            );
            
            if (!canAfford) {
                alert('Недостаточно ресурсов для найма!');
                return;
            }
            
            Object.entries(cost).forEach(([resource, amount]) => {
                gameState.resources[resource] -= amount;
            });
            
            const newVillager = {
                id: gameState.villagers.length,
                name: `Житель ${gameState.villagers.length + 1}`,
                job: JOB_TYPES.IDLE,
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                health: 100,
                energy: 100,
                happiness: 70,
                inventory: { wood: 0, stone: 0, food: 0 }
            };
            
            gameState.villagers.push(newVillager);
            gameState.population++;
            
            updateUI();
            updateWorkersList();
            updateShopList();
        }
        
        function buyUpgrade(index) {
            const upgrades = [
                { cost: { gold: 50, wood: 20 }, effect: () => { gameState.maxPopulation += 5; } },
                { cost: { gold: 80, stone: 30 }, effect: () => { /* Улучшение инструментов */ } },
                { cost: { gold: 30, food: 50 }, effect: () => { gameState.villagers.forEach(v => v.happiness = Math.min(100, v.happiness + 20)); } },
                { cost: { gold: 40, food: 20 }, effect: () => { hireVillager(); } }
            ];
            
            const upgrade = upgrades[index];
            if (!upgrade) return;
            
            const canAfford = Object.entries(upgrade.cost).every(([resource, amount]) => 
                gameState.resources[resource] >= amount
            );
            
            if (!canAfford) return;
            
            Object.entries(upgrade.cost).forEach(([resource, amount]) => {
                gameState.resources[resource] -= amount;
            });
            
            upgrade.effect();
            updateUI();
            updateShopList();
        }
        
        function showQuestModal(quest) {
            document.getElementById('questContent').innerHTML = `
                <h3>${quest.title}</h3>
                <p>${quest.description}</p>
                <p><strong>Награда:</strong> ${formatCost(quest.reward)}</p>
                <p><strong>Время:</strong> ${quest.duration} секунд</p>
            `;
            document.getElementById('questModal').classList.remove('hidden');
        }
        
        function acceptQuest() {
            document.getElementById('questModal').classList.add('hidden');
            // Квест уже добавлен в activeQuests
        }
        
        function declineQuest() {
            gameState.activeQuests.pop();
            document.getElementById('questModal').classList.add('hidden');
        }
        
        function showBuildingInfo(building) {
            document.getElementById('buildingInfoTitle').textContent = 
                `${building.type.emoji} ${building.type.name} (Уровень ${building.level})`;
            
            let content = `<p>${building.type.description}</p>`;
            content += `<p>Рабочих: ${building.workers.length}</p>`;
            content += `<p>Производство: ${building.production}</p>`;
            
            if (building.workers.length < 3) {
                content += `<button class="btn" onclick="assignWorkerToBuilding(${building.x}, ${building.y})">Назначить рабочего</button>`;
            }
            
            document.getElementById('buildingInfoContent').innerHTML = content;
            document.getElementById('buildingInfo').classList.remove('hidden');
        }
        
        function closeBuildingInfo() {
            document.getElementById('buildingInfo').classList.add('hidden');
        }
        
        function assignWorkerToBuilding(x, y) {
            const building = gameState.tiles[x][y].building;
            const idleVillager = gameState.villagers.find(v => v.job.name === 'Без работы');
            
            if (building && idleVillager) {
                building.workers.push(idleVillager.id);
                idleVillager.job = building.type === BUILDING_TYPES.FARM ? JOB_TYPES.FARMER : JOB_TYPES.BUILDER;
                closeBuildingInfo();
                updateWorkersList();
            }
        }
        
        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка тайлов
            const startX = Math.floor(gameState.camera.x / gameState.tileSize);
            const startY = Math.floor(gameState.camera.y / gameState.tileSize);
            const endX = Math.ceil((gameState.camera.x + canvas.width) / gameState.tileSize);
            const endY = Math.ceil((gameState.camera.y + canvas.height) / gameState.tileSize);
            
            for (let x = Math.max(0, startX); x < Math.min(gameState.worldSize, endX); x++) {
                for (let y = Math.max(0, startY); y < Math.min(gameState.worldSize, endY); y++) {
                    const tile = gameState.tiles[x][y];
                    const screenX = x * gameState.tileSize - gameState.camera.x;
                    const screenY = y * gameState.tileSize - gameState.camera.y;
                    
                    // Цвет тайла
                    let color = '#4CAF50'; // Трава
                    
                    switch (tile.type) {
                        case TILE_TYPES.FOREST:
                            color = '#2E7D32';
                            break;
                        case TILE_TYPES.STONE:
                            color = '#9E9E9E';
                            break;
                        case TILE_TYPES.WATER:
                            color = '#2196F3';
                            break;
                        case TILE_TYPES.FARM:
                            color = '#8BC34A';
                            break;
                    }
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(screenX, screenY, gameState.tileSize, gameState.tileSize);
                    
                    // Отрисовка ресурсов
                    if (tile.resource === 'tree') {
                        ctx.fillStyle = '#33691E';
                        ctx.beginPath();
                        ctx.arc(screenX + gameState.tileSize / 2, screenY + gameState.tileSize / 2, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (tile.resource === 'stone') {
                        ctx.fillStyle = '#616161';
                        ctx.fillRect(screenX + 8, screenY + 8, 16, 16);
                    }
                    
                    // Отрисовка зданий
                    if (tile.building && tile.building.x === x && tile.building.y === y) {
                        ctx.fillStyle = tile.building.type.color;
                        ctx.fillRect(
                            screenX, 
                            screenY, 
                            tile.building.type.size * gameState.tileSize, 
                            tile.building.type.size * gameState.tileSize
                        );
                        
                        ctx.fillStyle = '#000';
                        ctx.font = `${gameState.tileSize * tile.building.type.size}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(
                            tile.building.type.emoji,
                            screenX + (tile.building.type.size * gameState.tileSize) / 2,
                            screenY + (tile.building.type.size * gameState.tileSize) / 2
                        );
                    }
                }
            }
            
            // Отрисовка жителей
            gameState.villagers.forEach(villager => {
                const screenX = villager.x - gameState.camera.x;
                const screenY = villager.y - gameState.camera.y;
                
                if (screenX > -20 && screenX < canvas.width + 20 && 
                    screenY > -20 && screenY < canvas.height + 20) {
                    
                    // Тело
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Работа
                    if (villager.job.emoji) {
                        ctx.font = '12px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(villager.job.emoji, screenX, screenY - 15);
                    }
                    
                    // Имя
                    ctx.fillStyle = '#FFF';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(villager.name, screenX, screenY + 20);
                }
            });
            
            // Мини-карта
            drawMiniMap();
        }
        
        function drawMiniMap() {
            const miniMap = document.getElementById('miniMap');
            const miniCtx = miniMap.getContext('2d');
            const scale = miniMap.width / (gameState.worldSize * gameState.tileSize);
            
            miniCtx.clearRect(0, 0, miniMap.width, miniMap.height);
            
            // Отрисовка мира
            for (let x = 0; x < gameState.worldSize; x++) {
                for (let y = 0; y < gameState.worldSize; y++) {
                    const tile = gameState.tiles[x][y];
                    let color = '#4CAF50';
                    
                    if (tile.type === TILE_TYPES.FOREST) color = '#2E7D32';
                    else if (tile.type === TILE_TYPES.WATER) color = '#2196F3';
                    else if (tile.type === TILE_TYPES.STONE) color = '#9E9E9E';
                    
                    miniCtx.fillStyle = color;
                    miniCtx.fillRect(
                        x * gameState.tileSize * scale,
                        y * gameState.tileSize * scale,
                        gameState.tileSize * scale,
                        gameState.tileSize * scale
                    );
                }
            }
            
            // Позиция камеры
            miniCtx.strokeStyle = '#FF0000';
            miniCtx.strokeRect(
                gameState.camera.x * scale,
                gameState.camera.y * scale,
                canvas.width * scale,
                canvas.height * scale
            );
        }
        
        // Игровой цикл
        let lastTime = 0;
        let questTimer = 0;
        
        function gameLoop(timestamp) {
            const deltaTime = lastTime ? (timestamp - lastTime) / 1000 : 0;
            lastTime = timestamp;
            
            // Обновление времени
            gameState.time += deltaTime;
            
            // Обновление производства (каждые 5 секунд)
            if (Math.floor(gameState.time) % 5 === 0 && Math.floor(gameState.time) !== Math.floor(gameState.time - deltaTime)) {
                updateProduction();
                updateUI();
            }
            
            // Генерация квестов (каждые 60 секунд)
            questTimer += deltaTime;
            if (questTimer > 60) {
                questTimer = 0;
                if (gameState.activeQuests.length < 3) {
                    generateQuest();
                }
            }
            
            // Движение жителей
            gameState.villagers.forEach(villager => {
                if (Math.random() < 0.02) {
                    villager.x += (Math.random() - 0.5) * 50;
                    villager.y += (Math.random() - 0.5) * 50;
                    
                    // Ограничение по миру
                    villager.x = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize, villager.x));
                    villager.y = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize, villager.y));
                }
            });
            
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Управление с клавиатуры и мыши
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Управление камерой
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                
                gameState.camera.x -= dx;
                gameState.camera.y -= dy;
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                
                // Ограничение камеры
                gameState.camera.x = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.width, gameState.camera.x));
                gameState.camera.y = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.height, gameState.camera.y));
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && e.touches.length === 1) {
                const dx = e.touches[0].clientX - lastMouseX;
                const dy = e.touches[0].clientY - lastMouseY;
                
                gameState.camera.x -= dx;
                gameState.camera.y -= dy;
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                
                gameState.camera.x = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.width, gameState.camera.x));
                gameState.camera.y = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.height, gameState.camera.y));
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // Клик по зданию
        canvas.addEventListener('click', (e) => {
            if (isDragging) return;
            
            const worldX = e.clientX + gameState.camera.x;
            const worldY = e.clientY + gameState.camera.y;
            const tileX = Math.floor(worldX / gameState.tileSize);
            const tileY = Math.floor(worldY / gameState.tileSize);
            
            if (tileX >= 0 && tileX < gameState.worldSize && tileY >= 0 && tileY < gameState.worldSize) {
                const tile = gameState.tiles[tileX][tileY];
                if (tile.building) {
                    showBuildingInfo(tile.building);
                }
            }
        });
        
        // Клавиши для перемещения камеры
        function moveCamera() {
            const speed = 10;
            
            if (keys['ArrowLeft'] || keys['a']) gameState.camera.x -= speed;
            if (keys['ArrowRight'] || keys['d']) gameState.camera.x += speed;
            if (keys['ArrowUp'] || keys['w']) gameState.camera.y -= speed;
            if (keys['ArrowDown'] || keys['s']) gameState.camera.y += speed;
            
            gameState.camera.x = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.width, gameState.camera.x));
            gameState.camera.y = Math.max(0, Math.min(gameState.worldSize * gameState.tileSize - canvas.height, gameState.camera.y));
        }
        
        // Инициализация
        generateWorld();
        updateUI();
        
        // Запуск игрового цикла
        requestAnimationFrame(gameLoop);
        
        // Обновление камеры
        setInterval(moveCamera, 16);
        
        // Показ первого квеста через 10 секунд
        setTimeout(() => {
            generateQuest();
        }, 10000);
    </script>
</body>
</html>
