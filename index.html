<style>
  :root{ --ui-bg:rgba(11,19,27,.55); --ui-line:rgba(255,255,255,.16); --accent:#ffd23f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b1420;
    font-family:Manrope,-apple-system,'Segoe UI',Roboto,sans-serif; }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; touch-action:none; cursor:grab; }
  #app canvas:active{ cursor:grabbing; }

  /* ---------- верхний титул ---------- */
  #chip{ position:fixed; top:14px; left:16px; z-index:5; pointer-events:none; color:#fff;
    text-shadow:0 1px 8px rgba(10,40,20,.45); }
  #chip .t{ font-family:Unbounded,Manrope,sans-serif; font-weight:900; font-size:14px; letter-spacing:.32em; }
  #chip .s{ font-size:10.5px; letter-spacing:.18em; opacity:.75; margin-top:3px; text-transform:uppercase; }

  /* ---------- панель управления ---------- */
  #bar{ position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:6; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    max-width:min(96vw,760px); padding:9px 12px; border-radius:18px;
    background:var(--ui-bg); border:1px solid var(--ui-line);
    -webkit-backdrop-filter:blur(14px) saturate(1.25); backdrop-filter:blur(14px) saturate(1.25);
    box-shadow:0 10px 34px rgba(6,20,10,.35); }
  #bar button{ appearance:none; border:1px solid transparent; background:transparent; color:#fff;
    min-width:38px; height:38px; padding:0 10px; border-radius:12px; display:grid; place-items:center;
    font:600 12px/1 Manrope,sans-serif; letter-spacing:.04em; cursor:pointer;
    transition:background .18s, transform .12s, border-color .18s; }
  #bar button:hover{ background:rgba(255,255,255,.12); }
  #bar button:active{ transform:scale(.94); }
  #bar button svg{ width:17px; height:17px; fill:currentColor; }
  #bar .sep{ width:1px; height:24px; background:var(--ui-line); }
  .speedBox{ display:flex; align-items:center; gap:8px; color:#fff; font-size:11.5px; }
  .speedBox span{ opacity:.7; letter-spacing:.06em; text-transform:uppercase; font-size:10px; }
  .speedBox b{ font-size:11.5px; min-width:42px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:104px; height:4px; border-radius:4px;
    background:rgba(255,255,255,.35); accent-color:var(--accent); cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2px solid #5b4300; box-shadow:0 1px 5px rgba(0,0,0,.4); }

  /* ---------- toast / подсказка ---------- */
  #toast{ position:fixed; left:50%; bottom:84px; transform:translate(-50%,8px); z-index:8;
    background:rgba(8,14,20,.82); color:#fff; font-size:12.5px; padding:8px 15px; border-radius:99px;
    border:1px solid var(--ui-line); opacity:0; pointer-events:none; transition:.35s; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  #hint{ position:fixed; top:16px; right:16px; z-index:5; color:#fff; font-size:11.5px; letter-spacing:.03em;
    background:rgba(11,19,27,.45); border:1px solid var(--ui-line); padding:7px 13px; border-radius:99px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); opacity:.9; transition:opacity 1.2s; pointer-events:none; }
  #hint.hide{ opacity:0; }

  /* ---------- обложка ---------- */
  #cover{ position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:hidden;
    background:
      radial-gradient(circle at 74% 16%, rgba(255,250,220,.95) 0%, rgba(255,233,168,.85) 6%, rgba(255,233,168,0) 26%),
      linear-gradient(#6cb6e8 0%, #a8d4f0 42%, #d9eddc 58%, #57963f 58.6%, #2c5a26 100%); }
  #cover .cl{ position:absolute; background:rgba(255,255,255,.9); border-radius:50%;
    filter:blur(2px); box-shadow:0 6px 0 rgba(120,160,190,.18) inset; }
  #cover .c1{ width:190px; height:58px; top:18%; left:-220px; animation:drift 34s linear infinite; }
  #cover .c2{ width:130px; height:42px; top:33%; left:-160px; animation:drift 47s 6s linear infinite; opacity:.85; }
  #cover .c3{ width:240px; height:70px; top:9%;  left:-300px; animation:drift 58s 12s linear infinite; opacity:.7; }
  @keyframes drift{ to{ transform:translateX(calc(100vw + 420px)); } }
  .card{ position:relative; text-align:center; color:#fff; padding:34px 40px; border-radius:26px;
    background:rgba(10,26,16,.42); border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); max-width:92vw;
    text-shadow:0 2px 14px rgba(10,30,15,.5); }
  .card .k{ font-size:10.5px; letter-spacing:.42em; text-transform:uppercase; opacity:.85; }
  .card h1{ font-family:Unbounded,Manrope,sans-serif; font-weight:900; margin:12px 0 10px;
    font-size:clamp(34px,8vw,62px); letter-spacing:.06em; line-height:1; }
  .card h1 em{ font-style:normal; color:var(--accent); }
  .card p{ margin:0 0 24px; font-size:13.5px; opacity:.92; max-width:420px; }
  #startBtn{ appearance:none; border:0; cursor:pointer; font:800 15px Manrope,sans-serif; letter-spacing:.05em;
    color:#3a2c00; background:var(--accent); padding:15px 34px; border-radius:99px;
    box-shadow:0 8px 26px rgba(255,210,63,.45), inset 0 -3px 0 rgba(0,0,0,.14);
    transition:transform .15s, box-shadow .2s, filter .2s; }
  #startBtn:not(:disabled):hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 14px 34px rgba(255,210,63,.55); }
  #startBtn:disabled{ filter:grayscale(.4) brightness(.9); cursor:wait; }
  #coverErr{ margin-top:16px; font-size:12.5px; color:#ffd9d0; max-width:420px; white-space:pre-wrap; }
  #cover.away{ opacity:0; pointer-events:none; transition:opacity .9s ease .1s; }

  body.immersive #bar, body.immersive #chip, body.immersive #hint{ opacity:0; pointer-events:none; transition:opacity .5s; }
</style>

<body>

<div id="app"></div>

<div id="chip"><div class="t">COW&nbsp;MEADOW</div><div class="s">солнечный луг · процедурная 3D-сцена</div></div>

<div id="bar">
  <button id="btnPlay" title="Пауза / пуск (Пробел)"></button>

<div id="cover">
  <div class="cl c1"></div><div class="cl c2"></div><div class="cl c3"></div>
  <div class="card">
    <div class="k">three.js · webgl · всё процедурно</div>
    <h1>COW <em>MEADOW</em></h1>
    <p>Кинематографическая 3D-сцена: корова бежит по цветущему лугу под объёмными облаками. Ветер, птицы и стук копыт генерируются кодом.</p>
    <button id="startBtn" disabled>Загрузка…</button>
    <div id="coverErr"></div>
  </div>

<script type="module">
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
let toastT=null;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800); }
function fatal(msg){
  const err=$('#coverErr'); if(err) err.textContent=msg;
  const b=$('#startBtn'); if(b){ b.textContent='Повторить попытку'; b.disabled=false;
    b.onclick=()=>location.reload(); }
  console.error(msg);
}
window.addEventListener('unhandledrejection',e=>fatal('Необработанная ошибка загрузки: '+(e.reason&&e.reason.message||e.reason)));

/* детерминированный ГПСЧ — луг всегда одинаково красив */
let _s=987654321;
function rnd(){ _s|=0; _s=_s+0x6D2B79F5|0; let t=Math.imul(_s^_s>>>15,1|_s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
function rr(a,b){ return a+rnd()*(b-a); }
function gauss(x,s){ return Math.exp(-(x*x)/(2*s*s)); }

/* 2D value-noise для рельефа и покраски земли */
function h2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453123; return s-Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(h2(xi,yi),h2(xi+1,yi),u), lerp(h2(xi,yi+1),h2(xi+1,yi+1),u), v); }
function fbm(x,y){ let a=0,amp=.5,f=1; for(let i=0;i<4;i++){ a+=amp*vnoise(x*f,y*f); f*=2.03; amp*=.5; } return a; }

const PATH_R=30;
function terrainH(x,z){
  const d=Math.hypot(x,z);
  const pm=gauss(d-PATH_R,3.2);
  let h=(fbm(x*0.02+7.3,z*0.02+2.1)-0.45)*3.4 + (fbm(x*0.09+3.7,z*0.09+8.2)-0.5)*0.9;
  return h*(1-0.72*pm);
}
function pathMask(x,z){ return gauss(Math.hypot(x,z)-PATH_R,3.2); }

/* ---------- процедурные canvas-текстуры ---------- */
function radialTex(stops,size=128){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'); const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const [o,col] of stops) gr.addColorStop(o,col);
  g.fillStyle=gr; g.fillRect(0,0,size,size); return c;
}
function speckleTex(){
  const s=256,c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,s,s);
  for(let i=0;i<7000;i++){ const v=Math.random();
    g.fillStyle=v<.5?`rgba(60,80,40,${.05+Math.random()*.08})`:`rgba(255,255,240,${.04+Math.random()*.06})`;
    g.fillRect(Math.random()*s,Math.random()*s,1+Math.random()*1.6,1+Math.random()*1.6); }
  for(let i=0;i<26;i++){ const x=Math.random()*s,y=Math.random()*s,r=8+Math.random()*22;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${Math.random()<.5?'70,90,50':'200,210,160'},0.07)`); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
  return c;
}

/* ---------- GLSL-шум для шкуры коровы ---------- */
const NOISE_GLSL = `
float cHash(vec3 p){ p=fract(p*0.3183099+vec3(0.1,0.2,0.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float cNoise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(cHash(i+vec3(0.0,0.0,0.0)),cHash(i+vec3(1.0,0.0,0.0)),f.x),
                 mix(cHash(i+vec3(0.0,1.0,0.0)),cHash(i+vec3(1.0,1.0,0.0)),f.x),f.y),
             mix(mix(cHash(i+vec3(0.0,0.0,1.0)),cHash(i+vec3(1.0,0.0,1.0)),f.x),
                 mix(cHash(i+vec3(0.0,1.0,1.0)),cHash(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z); }
float cFbm(vec3 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*cNoise(p); p=p*2.02+vec3(13.7); a*=0.5; } return v; }
`;

async function boot(){
const THREE = await import('three');
const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
const { RenderPass }     = await import('three/addons/postprocessing/RenderPass.js');
const { UnrealBloomPass }= await import('three/addons/postprocessing/UnrealBloomPass.js');
const { ShaderPass }     = await import('three/addons/postprocessing/ShaderPass.js');
const { OutputPass }     = await import('three/addons/postprocessing/OutputPass.js');
const { mergeGeometries }= await import('three/addons/utils/BufferGeometryUtils.js');

const state={ paused:false, speed:1, qMode:'auto', resolved:'high', started:false, soundOn:true, degraded:false };
const isMobile=(matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);

/* ================= РЕНДЕРЕР ================= */
const renderer=new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
$('#app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd7e8f2,70,260);
scene.background=new THREE.Color(0xa8d0ec);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.1,900);

const bake=(geo,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0)=>{
  const m=new THREE.Matrix4(), q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz));
  m.compose(new THREE.Vector3(x,y,z),q,new THREE.Vector3(sx,sy,sz)); geo.applyMatrix4(m); return geo; };
const M=(geo,mat)=>new THREE.Mesh(geo,mat);

/* ================= НЕБО И СОЛНЦЕ ================= */
const sunDir=new THREE.Vector3(0.52,0.55,-0.42).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(430,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uSun:{value:sunDir} },
  vertexShader:`varying vec3 vW; void main(){ vW=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vW; uniform vec3 uSun;
    void main(){
      vec3 d=normalize(vW);
      float h=d.y;
      vec3 zen=vec3(0.145,0.40,0.80);
      vec3 hor=vec3(0.76,0.875,0.96);
      vec3 col=mix(hor,zen,pow(max(h,0.0),0.6));
      float s=max(dot(d,uSun),0.0);
      col+=vec3(1.0,0.83,0.55)*pow(s,6.0)*0.24;
      col+=vec3(1.0,0.94,0.80)*pow(s,90.0)*0.9;
      col+=vec3(1.0,0.98,0.92)*smoothstep(0.9993,0.9998,s)*2.2;
      col=mix(col,vec3(0.72,0.80,0.72),smoothstep(0.0,-0.25,h)*0.5);
      gl_FragColor=vec4(col,1.0);
    }`
}));
scene.add(sky);

const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({
  map:new THREE.CanvasTexture(radialTex([[0,'rgba(255,255,255,1)'],[0.18,'rgba(255,244,205,0.95)'],[0.45,'rgba(255,222,150,0.35)'],[1,'rgba(255,210,120,0)']])),
  blending:THREE.AdditiveBlending, depthWrite:false, fog:false, transparent:true }));
sunSprite.position.copy(sunDir).multiplyScalar(360); sunSprite.scale.setScalar(95);
scene.add(sunSprite);

/* ================= СВЕТ ================= */
const sunLight=new THREE.DirectionalLight(0xfff0d6,2.6);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.bias=-0.0006; sunLight.shadow.normalBias=0.5;
const sc=sunLight.shadow.camera; sc.left=-8.5; sc.right=8.5; sc.top=8.5; sc.bottom=-8.5; sc.near=8; sc.far=120;
scene.add(sunLight); scene.add(sunLight.target);
scene.add(new THREE.HemisphereLight(0xbdd7ff,0x61803f,0.9));
scene.add(new THREE.AmbientLight(0xffffff,0.14));

/* ================= МАТЕРИАЛ КОРОВЫ (пятна — в шейдере) ================= */
function cowMaterial({seed=0,thresh=0.545,sockY=-100,color=0xf3efe6,rough=0.92}={}){
  const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:0});
  m.onBeforeCompile=(sh)=>{
    sh.uniforms.uSeed={value:seed}; sh.uniforms.uThresh={value:thresh}; sh.uniforms.uSockY={value:sockY};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vCowPos;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvCowPos=position;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vCowPos;\nuniform float uSeed;\nuniform float uThresh;\nuniform float uSockY;\n'+NOISE_GLSL)
      .replace('#include <color_fragment>',`#include <color_fragment>
        vec3 cp=vCowPos;
        float n=cFbm(cp*vec3(1.6,2.0,1.6)*1.12+vec3(uSeed));
        float spot=smoothstep(uThresh,uThresh+0.05,n);
        float sock=(1.0-smoothstep(uSockY,uSockY+0.14,cp.y))*step(0.45,fract(uSeed*7.13));
        float mm=clamp(spot+sock,0.0,1.0);
        diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.085,0.078,0.084),mm);
        float fz=cNoise(cp*26.0+vec3(uSeed*3.1));
        diffuseColor.rgb*=(0.93+0.10*fz);
      `);
  };
  m.customProgramCacheKey=()=> 'cowspot-v1';
  return m;
}
const bodyMat=cowMaterial({seed:5});
const headMat=cowMaterial({seed:19,thresh:0.585});
const earMat =cowMaterial({seed:31,thresh:0.57});
const tailMat =cowMaterial({seed:8,thresh:0.52});
const legMats=[cowMaterial({seed:11,sockY:-0.55}),cowMaterial({seed:23,sockY:-0.55}),
               cowMaterial({seed:37,sockY:-0.55}),cowMaterial({seed:51,sockY:-0.55})];
const pinkMat=new THREE.MeshStandardMaterial({color:0xe8a49b,roughness:0.6});
const hoofMat=new THREE.MeshStandardMaterial({color:0x37302b,roughness:0.5});
const eyeMat =new THREE.MeshStandardMaterial({color:0x241610,roughness:0.16});
const hornMat=new THREE.MeshStandardMaterial({color:0xe9dfc6,roughness:0.5});
const hornTip=new THREE.MeshStandardMaterial({color:0x9a8a70,roughness:0.6});
const tuftMat=new THREE.MeshStandardMaterial({color:0x1b1713,roughness:1});
const glowW  =new THREE.MeshBasicMaterial({color:0xffffff});

/* ================= КОРОВА ================= */
const cow=new THREE.Group(); cow.rotation.order='YXZ'; scene.add(cow);

/* туловище — сплав нескольких объёмов в одну мягкую форму */
{
  const parts=[
    bake(new THREE.SphereGeometry(1,32,22), 0,1.06,-0.10, 0.60,0.62,1.18),
    bake(new THREE.SphereGeometry(1,26,18), 0,1.02, 0.62, 0.52,0.55,0.55),
    bake(new THREE.SphereGeometry(1,26,18), 0,1.08,-0.85, 0.55,0.58,0.60),
    bake(new THREE.SphereGeometry(1,24,16), 0,0.86,-0.10, 0.50,0.42,0.90),
    bake(new THREE.SphereGeometry(1,20,14), 0.42,1.32,0.32, 0.18,0.22,0.30),
    bake(new THREE.SphereGeometry(1,20,14),-0.42,1.32,0.32, 0.18,0.22,0.30),
    bake(new THREE.CapsuleGeometry(0.26,0.45,6,14), 0,1.30,0.95, 1,1,1, -0.62),
    bake(new THREE.SphereGeometry(1,20,14), 0,1.42,0.80, 0.34,0.30,0.34),
  ];
  const torso=M(mergeGeometries(parts),bodyMat); torso.castShadow=true; cow.add(torso);
  cow.userData.torso=torso;
}
/* вымя */
{
  const g=new THREE.Group();
  g.add(M(bake(new THREE.SphereGeometry(1,18,14),0,0,0,0.20,0.16,0.22),pinkMat));
  const tp=new THREE.CylinderGeometry(0.022,0.026,0.075,8);

  grassMat.userData.shader=sh;

    .replace('#include <common>','#include <common>\nuniform float uTime;\nuniform vec3 uCow;')
    .replace('#include <begin_vertex>',`#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec4 gwp=modelMatrix*instanceMatrix*vec4(transformed,1.0);
      #else
        vec4 gwp=modelMatrix*vec4(transformed,1.0);
      #endif
      float gwT=uTime*1.7+gwp.x*0.32+gwp.z*0.24;
      float hgt=clamp(position.y/0.9,0.0,1.0);
      float sway=(sin(gwT)+0.5*sin(gwT*1.9+1.7))*0.10*hgt*hgt;
      vec2 dv=gwp.xz-uCow.xz; float dd=length(dv);
      float push=smoothstep(1.7,0.15,dd);
      vec2 pdir=dv/max(dd,0.001);
      float pf=push*hgt;
      transformed.x+=sway+pdir.x*pf*0.55;
      transformed.z+=sway*0.7+pdir.y*pf*0.55;
    `);
};

  for(let i=0;i<n;i++){

}

    const w=M(new THREE.PlaneGeometry(0.05,0.022),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.45,side:THREE.DoubleSide}));
    w.position.y=0.02; w.rotation.x=-Math.PI/2; g.add(w);
    const a=rnd()*TAU,r=rr(24,36);
    g.userData={anchor:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),ph:rnd()*TAU,w};
    scene.add(g); bees.push(g);
  }
}
/* бабочки */
const butterflies=[];
{
  const cols=[0xff8a3d,0x6fc3ff,0xf7e86b];
  for(let i=0;i<3;i++){
    const g=new THREE.Group();
    const wm=new THREE.MeshLambertMaterial({color:cols[i],side:THREE.DoubleSide,emissive:cols[i],emissiveIntensity:0.12});

    const lwg=wg.clone(); lwg.translate(-0.06,0,0); const rwg=wg.clone(); rwg.translate(0.06,0,0);
    const lw=M(lwg,wm), rw=M(rwg,wm); g.add(lw,rw);
    const body=M(new THREE.CapsuleGeometry(0.012,0.06,3,6),new THREE.MeshLambertMaterial({color:0x221a10}));
    body.rotation.x=Math.PI/2; g.add(body);
    const a=rnd()*TAU,r=rr(22,40);
    g.userData={anchor:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),ph:rnd()*TAU,lw,rw,prev:null};
    scene.add(g); butterflies.push(g);
  }
}

/* ================= ПОСТПРОЦЕСС ================= */
const GradeShader={
  uniforms:{ tDiffuse:{value:null}, uRes:{value:new THREE.Vector2(innerWidth,innerHeight)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      vec2 uv=vUv; vec2 cc=uv-0.5;
      vec2 off=cc*dot(cc,cc)*0.0018;
      vec3 col;
      col.r=texture2D(tDiffuse,uv+off).r;
      col.g=texture2D(tDiffuse,uv).g;
      col.b=texture2D(tDiffuse,uv-off).b;
      float l=dot(col,vec3(0.299,0.587,0.114));
      col=mix(vec3(l),col,1.07);
      col=(col-0.5)*1.045+0.5;
      col*=vec3(1.028,1.004,0.984);
      float d=length(cc*vec2(uRes.x/max(uRes.y,1.0),1.0));
      col*=mix(0.78,1.0,smoothstep(0.98,0.42,d));
      gl_FragColor=vec4(col,1.0);
    }`
};
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.38,0.6,0.82);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
const gradePass=new ShaderPass(GradeShader);
composer.addPass(gradePass);

/* ================= ЗВУК (полностью процедурный) ================= */
const AudioEngine={
  ctx:null,master:null,noiseBuf:null,enabled:true,
  start(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=this.ctx=new AC();
    this.master=c.createGain(); this.master.gain.value=0.85; this.master.connect(c.destination);
    const len=2*c.sampleRate, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noiseBuf=buf;
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=330; lp.Q.value=0.5;
    const wg=c.createGain(); wg.gain.value=0.085;
    const lfo=c.createOscillator(); lfo.frequency.value=0.07;
    const lg=c.createGain(); lg.gain.value=0.045; lfo.connect(lg); lg.connect(wg.gain);
    src.connect(lp); lp.connect(wg); wg.connect(this.master);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.9;
    const wg2=c.createGain(); wg2.gain.value=0.016;
    src.connect(bp); bp.connect(wg2); wg2.connect(this.master);
    src.start(); lfo.start();
    this.scheduleBird();
  },
  scheduleBird(){ setTimeout(()=>{ this.phrase(); this.scheduleBird(); },2500+Math.random()*6000); },
  phrase(){
    if(!this.ctx||document.hidden||!this.enabled) return;
    const c=this.ctx,t0=c.currentTime+0.05,n=2+(Math.random()*3|0);
    for(let i=0;i<n;i++){
      const t=t0+i*(0.10+Math.random()*0.07);
      const o=c.createOscillator(),g=c.createGain(); o.type='sine';
      const f=1900+Math.random()*2300;
      o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*(0.55+Math.random()*0.3),t+0.09);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.045+Math.random()*0.03,t+0.014);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.17);
    }
  },
  step(vol){
    if(!this.ctx||!this.enabled) return;
    const c=this.ctx,t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=0.7+Math.random()*0.5;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=240+Math.random()*140;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.15*vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.10);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t,Math.random()*1.5); s.stop(t+0.13);
  },
  setEnabled(on){
    this.enabled=on;
    if(this.master&&this.ctx) this.master.gain.setTargetAtTime(on?0.85:0.0,this.ctx.currentTime,0.08);
  }
};

/* ================= АНИМАЦИЯ ================= */
let simTime=0, phase=0, pathAng=rr(0,TAU), pitchSm=0;
const cowPos=new THREE.Vector3(), cowFwd=new THREE.Vector3(), tmpV=new THREE.Vector3(), hoofV=new THREE.Vector3();

function gaitPose(dt){
  const s=state.speed;
  const freq=1.05*s;
  phase+=freq*dt;
  pathAng+=(2.31*s)/PATH_R*dt;
  const x=Math.cos(pathAng)*PATH_R, z=Math.sin(pathAng)*PATH_R;
  const gy=terrainH(x,z);
  const yaw=Math.atan2(-Math.sin(pathAng),Math.cos(pathAng));
  cowPos.set(x,gy,z); cowFwd.set(Math.sin(yaw),0,Math.cos(yaw));

  const tauF=TAU*(phase+0.5);
  const bob=0.05*Math.sin(2*tauF+1.0)+0.018*Math.sin(tauF);
  cow.position.set(x,gy+bob,z);
  cow.rotation.y=yaw;
  const aA=pathAng+1.3/PATH_R;
  const hA=terrainH(Math.cos(aA)*PATH_R,Math.sin(aA)*PATH_R);
  pitchSm=lerp(pitchSm,-Math.atan2(hA-gy,1.3)*0.75,1-Math.exp(-6*dt));
  cow.rotation.x=pitchSm;
  cow.rotation.z=0.045+0.02*Math.sin(tauF*0.5);

  const tF=TAU*phase;
  cow.userData.torso.scale.set(1+0.006*Math.sin(simTime*2.1),1+0.008*Math.sin(simTime*2.1),1);

  const stepVol=0.5+0.5*((s-0.5)/1.3);
  for(const leg of legs){
    const t=TAU*(phase+leg.off);
    leg.hip.rotation.x=(leg.off<0.2?0.62:0.55)*Math.sin(t)-0.10*Math.sin(2*t);
    const lift=Math.pow(Math.max(0,-Math.cos(t)),1.3);
    leg.knee.rotation.x=(leg.off<0.2?0.12:0.15)+(leg.off<0.2?1.1:1.3)*lift;
    leg.ankle.rotation.x=0.55*lift;
    const cs=Math.cos(t);
    if(leg.prevCos<0&&cs>=0&&dt>0){ /* копыто коснулось земли */
      leg.ankle.getWorldPosition(hoofV); spawnDust(hoofV);
      AudioEngine.step(stepVol*rr(0.8,1.1));
    }
    leg.prevCos=cs;
  }
  /* голова, уши, хвост */
  const hg=cow.children.indexOf(headGrp)>=0?headGrp:headGrp;
  headGrp.rotation.x=0.06+0.10*Math.sin(2*tauF+2.4)+0.04*Math.sin(tauF);
  headGrp.rotation.z=0.03*Math.sin(tauF*0.5+1);
  const ears=cow.userData.ears;
  const flickL=Math.pow(Math.max(0,Math.sin(simTime*6.7)),24)*0.5;
  const flickR=Math.pow(Math.max(0,Math.sin(simTime*5.9+2.2)),24)*0.5;
  ears[0].rotation.z=-0.2+0.10*Math.sin(tauF*2+1)+flickL;
  ears[1].rotation.z= 0.2-0.10*Math.sin(tauF*2+1.7)-flickR;
  ears[0].rotation.x=0.12*Math.sin(simTime*3.1)*0.4;
  ears[1].rotation.x=0.12*Math.sin(simTime*3.4+1)*0.4;
  for(let i=0;i<tailSegs.length;i++){
    tailSegs[i].rotation.x=(i===0?0.0:0)+0.10*Math.sin(tauF-i*0.55)-0.04*i;
    tailSegs[i].rotation.z=0.22*(1+i*0.22)*Math.sin(simTime*1.4-i*0.5);
  }
}

function updateAmbient(dt){
  /* облака */
  for(const c of clouds){ c.mesh.position.x+=c.speed*dt; if(c.mesh.position.x>210) c.mesh.position.x=-210; }
  /* пыльца */
  const pa=pollenGeo.attributes.position.array;
  for(let i=0;i<MAX_POLLEN;i++){
    const j=i*3, s=pollenSeed[i];
    pa[j]  +=(0.22+0.15*Math.sin(simTime*0.4+s))*dt;
    pa[j+1]+=0.12*Math.sin(simTime*0.7+s*2)*dt;
    pa[j+2]+=0.10*Math.cos(simTime*0.5+s)*dt;
    if(pa[j]-cowPos.x>18) pa[j]-=36; if(pa[j]-cowPos.x<-18) pa[j]+=36;
    if(pa[j+2]-cowPos.z>18) pa[j+2]-=36; if(pa[j+2]-cowPos.z<-18) pa[j+2]+=36;
    if(pa[j+1]<0.2) pa[j+1]=0.2; if(pa[j+1]>4) pa[j+1]=4;
  }
  pollenGeo.attributes.position.needsUpdate=true;
  /* пыль */
  for(const d of dust){
    if(d.life<=0) continue;
    d.life-=dt;
    if(d.life<=0){ d.s.visible=false; d.s.material.opacity=0; continue; }
    d.s.position.addScaledVector(d.v,dt); d.v.y-=1.2*dt;
    d.s.scale.setScalar(0.18+(0.5-d.life)*1.3);
    d.s.material.opacity=Math.max(0,d.life/0.5)*0.55;
  }
  /* пчёлы */
  for(const b of bees){
    const u=b.userData,t=simTime;
    b.position.set(
      u.anchor.x+Math.sin(t*1.7+u.ph)*1.1,
      0.6+0.35*Math.sin(t*2.3+u.ph*2)+0.5+terrainH(u.anchor.x,u.anchor.z),
      u.anchor.z+Math.cos(t*1.3+u.ph)*1.1);
    b.rotation.y=t*1.7+u.ph;
    u.w.scale.x=0.4+0.6*Math.abs(Math.sin(t*40+u.ph));
  }
  /* бабочки */
  for(const f of butterflies){
    const u=f.userData,t=simTime;
    const nx=u.anchor.x+Math.sin(t*0.31+u.ph)*2.6;
    const nz=u.anchor.z+Math.cos(t*0.27+u.ph)*2.6;
    const ny=0.9+0.5*Math.sin(t*0.53+u.ph*2)+terrainH(nx,nz);
    if(u.prev){ f.rotation.y=Math.atan2(nx-u.prev.x,nz-u.prev.z); }
    u.prev=u.prev||new THREE.Vector3(); u.prev.set(nx,ny,nz);
    f.position.set(nx,ny,nz);
    const flap=0.25+0.75*Math.abs(Math.sin(t*17+u.ph));
    u.lw.rotation.z=flap; u.rw.rotation.z=-flap;
  }
  /* трава: время ветра + позиция коровы для пригибания */
  const sh=grassMat.userData.shader;
  if(sh){ sh.uniforms.uTime.value=simTime; sh.uniforms.uCow.value.copy(cowPos); }
  /* солнце следует за героем, чтобы тень всегда была рядом */
  sunLight.position.copy(cowPos).addScaledVector(sunDir,46);
  sunLight.target.position.copy(cowPos);
  sky.position.copy(camera.position);
}

/* ================= КАМЕРА ================= */
let userTheta=0,userPitch=0,distT=5.2,dist=5.2,baseFov=44;
const camPosSm=new THREE.Vector3(), camTgtSm=new THREE.Vector3(); let camInit=false;
function updateCamera(dt){
  const yaw=cow.rotation.y;
  const drift=Math.sin(simTime*0.05)*0.06;
  const ang=yaw+1.25+userTheta+drift;
  const cx=cowPos.x+Math.sin(ang)*dist, cz=cowPos.z+Math.cos(ang)*dist;
  let cy=cowPos.y+1.55+userPitch*2.2;
  const minY=terrainH(cx,cz)+0.5; if(cy<minY) cy=minY;
  tmpV.set(
    cx+Math.sin(simTime*0.9)*0.05+Math.sin(simTime*2.3)*0.02,
    cy+Math.sin(simTime*1.3)*0.035,
    cz+Math.cos(simTime*0.8)*0.05);
  const tx=cowPos.x+cowFwd.x*0.9, ty=cowPos.y+1.12+0.03*Math.sin(simTime*1.7), tz=cowPos.z+cowFwd.z*0.9;
  if(!camInit){ camPosSm.copy(tmpV); camTgtSm.set(tx,ty,tz); camInit=true; }
  const k=1-Math.exp(-3.1*dt);
  camPosSm.lerp(tmpV,k); camTgtSm.lerp(tmpV.set(tx,ty,tz),k);
  camera.position.copy(camPosSm);
  camera.lookAt(camTgtSm);
  dist=lerp(dist,distT,1-Math.exp(-5*dt));
  camera.fov=baseFov+state.speed*2.5;
  camera.updateProjectionMatrix();
}

/* ================= КАЧЕСТВО ================= */
function applyQuality(q){
  state.resolved=q;
  const hi=q==='high';
  const dpr=hi?Math.min(devicePixelRatio,2):(isMobile?1:1.25);
  renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr);
  composer.setSize(innerWidth,innerHeight);
  sunLight.shadow.mapSize.set(hi?2048:1024,hi?2048:1024);
  if(sunLight.shadow.map){ sunLight.shadow.map.dispose(); sunLight.shadow.map=null; }
  grassMesh.count=hi?MAX_GRASS:6500;
  grassMesh.receiveShadow=hi;
  pollenGeo.setDrawRange(0,hi?MAX_POLLEN:60);
  bloomPass.strength=hi?0.38:0.22;
  $('#btnQuality').textContent='Качество: '+(state.qMode==='auto'?'авто · ':'')+ (hi?'высокое':'низкое');
}
let fpsEMA=60;

/* ================= СОБЫТИЯ / UI ================= */
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_RESTART='<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>';
const ICON_FS='<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm16 0v6h-2V6h-4V4h6zM4 20v-6h2v4h4v2H4zm16 0h-6v-2h4v-4h2v6z"/></svg>';
$('#btnPlay').innerHTML=ICON_PAUSE; $('#btnRestart').innerHTML=ICON_RESTART; $('#btnFs').innerHTML=ICON_FS;

function togglePause(){
  state.paused=!state.paused;
  $('#btnPlay').innerHTML=state.paused?ICON_PLAY:ICON_PAUSE;
}
function restart(){
  phase=0; pathAng=0; simTime=0; userTheta=0; userPitch=0; distT=5.2; pitchSm=0; camInit=false;
  toast('Сцена перезапущена');
}
$('#btnPlay').onclick=togglePause;
$('#btnRestart').onclick=restart;
$('#speed').addEventListener('input',e=>{ state.speed=parseFloat(e.target.value); $('#speedVal').textContent='×'+state.speed.toFixed(2); });
$('#btnQuality').onclick=()=>{
  const order=['auto','high','low'];
  state.qMode=order[(order.indexOf(state.qMode)+1)%3];
  const target=state.qMode==='auto'?(isMobile?'low':'high'):state.qMode;
  applyQuality(target);
  toast('Качество: '+(target==='high'?'высокое':'низкое')+(state.qMode==='auto'?' (авто)':''));
};
$('#btnSound').onclick=()=>{
  state.soundOn=!state.soundOn;
  AudioEngine.setEnabled(state.soundOn);
  $('#btnSound').textContent='Звук: '+(state.soundOn?'вкл':'выкл');
};
$('#btnFs').onclick=()=>{
  const el=document.documentElement;
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
  else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
  else { document.body.classList.toggle('immersive');
    toast(document.body.classList.contains('immersive')?'Режим погружения (нажмите ещё раз для выхода)':'Обычный режим'); }
};
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); togglePause(); }
  if(e.code==='KeyR') restart();
});
/* перетаскивание камеры */
let dragging=false,lx=0,ly=0,interacted=false;
const cnv=renderer.domElement;
cnv.addEventListener('pointerdown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; cnv.setPointerCapture(e.pointerId);
  if(!interacted){ interacted=true; $('#hint').classList.add('hide'); } });
cnv.addEventListener('pointermove',e=>{ if(!dragging) return;
  userTheta-=(e.clientX-lx)*0.0045;
  userPitch=clamp(userPitch+(e.clientY-ly)*0.003,-0.5,0.7);
  lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup',()=>dragging=false);
cnv.addEventListener('wheel',e=>{ e.preventDefault(); distT=clamp(distT+e.deltaY*0.004,3.6,8.5); },{passive:false});

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  baseFov=camera.aspect<0.75?58:(camera.aspect<1?50:44);
  camera.aspect=camera.aspect; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  gradePass.uniforms.uRes.value.set(innerWidth,innerHeight);
}
addEventListener('resize',onResize); onResize();

/* ================= СТАРТ ================= */
applyQuality(isMobile?'low':'high');
const startBtn=$('#startBtn');
startBtn.textContent='▶  Запустить сцену'; startBtn.disabled=false;
startBtn.onclick=()=>{
  $('#cover').classList.add('away');
  AudioEngine.start(); state.started=true;
  setTimeout(()=>toast('Перетаскивайте сцену, чтобы сменить ракурс'),1200);
};

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
let last=performance.now(); const t0=last;
function frame(now){
  requestAnimationFrame(frame);
  const dt=clamp((now-last)/1000,0,0.05); last=now;
  if(dt>0) fpsEMA=lerp(fpsEMA,1/dt,0.04);
  /* адаптивное снижение качества один раз */
  if(!state.degraded&&state.resolved==='high'&&now-t0>8000&&fpsEMA<36){
    state.degraded=true; applyQuality('low'); toast('Автоматически снижено качество для плавности');
  }
  if(!state.paused){
    simTime+=dt;
    gaitPose(dt);
    updateAmbient(dt);
  }
  updateCamera(dt);
  composer.render();
}
requestAnimationFrame(frame);
}

boot().catch(e=>fatal('Не удалось инициализировать 3D-сцену.\nПроверьте подключение к интернету (Three.js загружается с CDN) и поддержку WebGL2.\n\n'+(e&&e.message||e)));
</script>
