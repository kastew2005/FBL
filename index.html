<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Pocket Edition (JS)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.imgur.com/714493L.png') center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .mc-title {
            color: #fff;
            font-size: 24px;
            text-shadow: 3px 3px #000;
            margin-bottom: 40px;
            text-align: center;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .mc-btn {
            width: 280px;
            height: 45px;
            background-color: #727272;
            border: 3px solid #373737;
            border-top-color: #9e9e9e;
            border-left-color: #9e9e9e;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            text-shadow: 2px 2px #373737;
            margin: 6px 0;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px #555;
        }

        .mc-btn:active {
            background-color: #555;
            border-top-color: #373737;
            border-left-color: #373737;
            border-bottom-color: #9e9e9e;
            border-right-color: #9e9e9e;
        }

        .version-text {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #a0a0a0;
            font-size: 8px;
            text-shadow: 1px 1px #000;
        }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС (HUD) --- */
        #game-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 10;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><path d="M7 0h2v16H7zM0 7h16v2H0z" fill="white" fill-opacity="0.6"/></svg>') no-repeat center;
            pointer-events: none;
        }

        /* Джойстик движения */
        #joystick-base {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
        }

        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        /* Кнопки справа (Прыжок и Действие) */
        .right-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
        }

        .action-btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-shadow: 1px 1px #000;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.3); }

        /* Хотбар (Инвентарь снизу) */
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.6);
            border: 2px solid #3b3b3b;
            padding: 3px;
            gap: 2px;
        }

        .hotbar-slot {
            width: 40px;
            height: 40px;
            background: #8b8b8b;
            border: 2px solid #373737;
            border-top-color: #373737;
            border-left-color: #373737;
            border-bottom-color: #fff;
            border-right-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .hotbar-slot.selected {
            border: 2px solid #fff;
            outline: 2px solid #fff;
        }

        .slot-icon {
            width: 28px;
            height: 28px;
        }
    </style>

    <!-- Подключаем Three.js для 3D графики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen">
        <div class="mc-title">Minecraft<br><span style="font-size: 10px; color: #ff0px;">Pocket Edition</span></div>
        <button class="mc-btn" onclick="startGame()">Одиночная игра</button>
        <button class="mc-btn" onclick="alert('Настройки: Управление сенсорное, графика стандартная.')">Настройки</button>
        <button class="mc-btn" onclick="alert('Создатели: Mojang / Модификация для JS')">О программе</button>
        <div class="version-text">Alpha 0.1.0_js</div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen">
        <div id="crosshair"></div>
        
        <!-- Управление -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div class="right-controls">
            <div class="action-btn" id="btn-break">ЛОМАТЬ</div>
            <div class="action-btn" id="btn-place" style="background: rgba(0,100,200,0.4);">СТАВИТЬ</div>
            <div class="action-btn" id="btn-jump">ПРЫЖОК</div>
        </div>

        <!-- Панель быстрого доступа -->
        <div id="hotbar">
            <div class="hotbar-slot selected" onclick="selectBlock(1)" data-id="1"><div class="slot-icon" style="background:#5c4033;"></div></div>
            <div class="hotbar-slot" onclick="selectBlock(2)" data-id="2"><div class="slot-icon" style="background:#5c8a32;"></div></div>
            <div class="hotbar-slot" onclick="selectBlock(3)" data-id="3"><div class="slot-icon" style="background:#808080;"></div></div>
            <div class="hotbar-slot" onclick="selectBlock(4)" data-id="4"><div class="slot-icon" style="background:#a0522d;"></div></div>
        </div>
    </div>

    <script>
        let gameStarted = false;
        let scene, camera, renderer;
        let worldBlocks = {}; // Хранилище блоков { "x,y,z": mesh }
        let selectedBlockType = 1; // 1: Земля, 2: Трава, 3: Камень, 4: Дерево

        // Параметры игрока
        let player = {
            x: 0, y: 10, z: 0,
            rotationX: 0, rotationY: 0,
            speed: 0.12,
            vy: 0,
            isJumping: false
        };

        // Текстуры/Цвета блоков в стиле Minecraft
        const blockMaterials = {
            1: new THREE.MeshLambertMaterial({ color: 0x866043 }), // Земля
            2: new THREE.MeshLambertMaterial({ color: 0x5b8731 }), // Трава
            3: new THREE.MeshLambertMaterial({ color: 0x7a7a7a }), // Камень
            4: new THREE.MeshLambertMaterial({ color: 0x6e4726 })  // Дерево
        };
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            gameStarted = true;
            init3D();
            initControls();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x8cb8ff); // Небо Minecraft PE
            scene.fog = new THREE.FogExp2(0x8cb8ff, 0.05);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false }); // Пиксельный стиль без сглаживания
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-screen').appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Генерация мира (плоский мир с холмами)
            for (let x = -8; x <= 8; x++) {
                for (let z = -8; z <= 8; z++) {
                    createBlock(x, 0, z, 3); // Камень снизу
                    createBlock(x, 1, z, 1); // Земля
                    createBlock(x, 2, z, 2); // Трава сверху
                }
            }

            // Спавн игрока
            player.x = 0;
            player.y = 5;
            player.z = 0;

            animate();
        }

        function createBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (worldBlocks[key]) return;

            const mesh = new THREE.Mesh(boxGeo, blockMaterials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            worldBlocks[key] = { mesh: mesh, type: type };
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (worldBlocks[key]) {
                scene.remove(worldBlocks[key].mesh);
                delete worldBlocks[key];
            }
        }

        // --- УПРАВЛЕНИЕ МОБИЛЬНОЕ (1 в 1) ---
        let joystickActive = false;
        let joystickData = { x: 0, y: 0 };
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;

        function initControls() {
            // Джойстик движения
            const jBase = document.getElementById('joystick-base');
            const jStick = document.getElementById('joystick-stick');
            let baseRect = jBase.getBoundingClientRect();

            jBase.addEventListener('touchstart', (e) => {
                joystickActive = true;
                updateJoystick(e.touches[0]);
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    let t = e.touches[i];
                    if (joystickActive && t.clientX < window.innerWidth / 2) {
                        updateJoystick(t);
                    } else if (touchLookId === t.identifier) {
                        let dx = t.clientX - lastTouchX;
                        let dy = t.clientY - lastTouchY;
                        player.rotationY -= dx * 0.005;
                        player.rotationX -= dy * 0.005;
                        player.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotationX));
                        lastTouchX = t.clientX;
                        lastTouchY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                joystickActive = false;
                joystickData = { x: 0, y: 0 };
                jStick.style.transform = `translate(0px, 0px)`;
                touchLookId = null;
            });

            // Обзор правой половиной экрана
            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    let t = e.touches[i];
                    if (t.clientX >= window.innerWidth / 2 && touchLookId === null && t.target.classList.contains('action-btn') === false) {
                        touchLookId = t.identifier;
                        lastTouchX = t.clientX;
                        lastTouchY = t.clientY;
                    }
                }
            });

            function updateJoystick(touch) {
                let centerX = baseRect.left + 60;
                let centerY = baseRect.top + 60;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.hypot(dx, dy);
                let maxDist = 40;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                jStick.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickData.x = dx / maxDist;
                joystickData.y = dy / maxDist;
            }

            // Кнопки действий
            document.getElementById('btn-jump').addEventListener('touchstart', () => {
                if (player.y <= 3) { // Простейшее условие прыжка от земли
                    player.vy = 0.15;
                }
            });

            document.getElementById('btn-break').addEventListener('touchstart', () => {
                raycastAction(false); // Ломать блок перед собой
            });

            document.getElementById('btn-place').addEventListener('touchstart', () => {
                raycastAction(true); // Ставить блок перед собой
            });
        }

        function selectBlock(type) {
            selectedBlockType = type;
            document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-id="${type}"]`).classList.add('selected');
        }

        // Взаимодействие с блоками (Луч из камеры)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Центр экрана

        function raycastAction(isPlace) {
            raycaster.setFromCamera(mouse, camera);
            // Собираем все меши блоков в массив
            let meshes = [];
            for (let k in worldBlocks) meshes.push(worldBlocks[k].mesh);

            let intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                let hit = intersects[0];
                let p = hit.point.clone();
                let normal = hit.face.normal.clone();

                if (isPlace) {
                    // Ставим блок чуть смещенным по нормали
                    p.addScaledVector(normal, 0.5);
                    let bx = Math.round(p.x);
                    let by = Math.round(p.y);
                    let bz = Math.round(p.z);
                    createBlock(bx, by, bz, selectedBlockType);
                } else {
                    // Удаляем блок
                    p.addScaledVector(normal, -0.5);
                    let bx = Math.round(p.x);
                    let by = Math.round(p.y);
                    let bz = Math.round(p.z);
                    removeBlock(bx, by, bz);
                }
            }
        }

        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) return;

            // Движение игрока
            let moveX = -joystickData.x;
            let moveZ = -joystickData.y;

            let cos = Math.cos(player.rotationY);
            let sin = Math.sin(player.rotationY);

            let vx = (moveX * cos - moveZ * sin) * player.speed;
            let vz = (moveX * sin + moveZ * cos) * player.speed;

            player.x += vx;
            player.z += vz;

            // Гравитация
            player.vy -= 0.01;
            player.y += player.vy;
            if (player.y < 3) {
                player.y = 3;
                player.vy = 0;
            }

            // Обновление камеры
            camera.position.set(player.x, player.y + 1.6, player.z); // Глаза игрока
            
            let euler = new THREE.Euler(player.rotationX, player.rotationY, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!gameStarted) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
